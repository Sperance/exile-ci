# Обновления действий GitHub: все действия закреплены полным SHA коммита (тег - в комментарии). Dependabot раз в месяц присылает
# один сгруппированный PR - список «что обновить»: обновление переносится в main обычным коммитом, PR закрывается (схема без PR).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: [ "*" ]
    commit-message:
      prefix: "ci"
