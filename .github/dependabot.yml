# Обновления действий GitHub: все действия закреплены полным SHA коммита (тег - в комментарии), Dependabot раз в неделю присылает
# PR с новым SHA и тегом. Владелец принимает их сам (main защищён, rules-md/common/process/versions-release.md сервера).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
