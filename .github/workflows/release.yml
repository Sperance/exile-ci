# Единая точка запуска: один выбор вместо двух workflow. Ничего не собирает сам, а запускает нужный режим server.yml / client.yml в этом
# же репозитории (токену хватает actions: write). Что выбирать, ассистент пишет в конце каждой задачи рядом с Server-Update / Server-Wipe.
#
#   server          - выкатить сервер: деплой того сервера, что стоит на тесте (запись последнего удачного deploy-test, ci/test-stand.sh), если
#                     его образ уже проверен пушем (server.yml mode=deploy); с skip_test - головы рабочей ветки сервера. Вайп коллекций
#                     делает сам сервер при старте по CollectionSchemas;
#   server-rebuild  - сервер заново: проверки, образ и деплой (server.yml mode=rebuild) того же сервера (с теста; с skip_test - головы), если
#                     образ не собрался или не проверен;
#   client          - ВЫПУСК: накопительный, пуши в рабочие ветки сами ничего не выпускают и не выкатывают. Поле bump (patch - x.y.z+1,
#                     minor - x.y+1.0, от последнего выпущенного тега v<версия> здесь): job `client` берёт голову рабочей ветки
#                     клиента, коммитом `feat: release <версия>` ставит versionCode/versionName в app/build.gradle.kts и переименовывает
#                     `## Следующая версия` в RELEASE_NOTES.md (нет раздела или он пуст - ошибка), затем запускает client.yml mode=release
#                     на этом коммите (до коммита - стоп, если голова сервера по коду не закреплена в клиенте, её образ не
#                     проверен или сторож деплоя ci/deploy-guard.py --candidate против выката: новый клиент не играл бы на сервере
#                     после выката, или выкат отрезал бы сборки каналов без force_breaking; а также если стенд включён (задана TEST_SERVER_URL), а голова клиента ещё не на
#                     живом тесте: тестовый стенд стоит на другом коде клиента или другом закреплённом сервере (коммиты без кода не мешают) либо
#                     не отвечает образом выката; стенд не включён - выпуск идёт, в сводке красная строка; с skip_test это не проверяется): все проверки (кроме уже зелёных на том же коде), релиз, закрытие Issues по трейлерам `Issue: #N` (клиент) и `Refs Sperance/ExileForge#N` (сервер), выкат сервера (деплой после релиза запускает
#                     client.yml сам) и после него перенос баланса и «Текстов клиента» теста в бой (как Release balance; отказ - красный
#                     прогон server.yml, job `balance`), выкладка в магазины. Коммит делает EXILEFORGE_TOKEN (Contents: write на ExileForge);
#   balance         - только баланс: по SSH слепок опубликованного баланса и «Текстов клиента» теста (update.sh balance-export ключом теста)
#                     уходит в бой (balance-import ключом боя): бой выпускает его новой версией баланса с записью журнала и откатом. Отказ, если код
#                     сервера на тесте и в бою различается, - красный прогон, ответ сервера в зашифрованном артефакте balance-log;

#   client-shots    - UI-тесты и картинки магазина (StoreShotsTest), без релиза (client.yml mode=shots);
#   telegram        - пост о последнем релизе в тему «Обновления» группы Telegram заново (telegram.yml): пост той же версии правится;
#   important       - пост IMPORTANT.md головы сервера в тему «Важное» (telegram-important.yml), если этот текст ещё не выходил;
#   server-notes    - пост новых пунктов «[сервер]» заметок в тему «Обновления» заново (telegram-server-notes.yml): то, что не вышло при выкате сервера;
#   preview         - ничего не выпускает: сводка накопленного в итоге прогона (баланс теста числами без значений - job preview-balance, заметки по разделам, текст «Важного», Issues к закрытию, вайпы,
#                     обязательность, совет bump по трейлерам `Bump: minor`); нажимать перед client. Итог прогона публичен: в нём заметки и «Важное».
#
# skip_test (client, server, server-rebuild): выпуск без проверки теста - голова клиента не обязана стоять на тесте, сервер выкатывается с головы
# рабочей ветки, а не с теста, баланс теста в бой не переносится; в итоге прогона красная строка «выпущено мимо теста». Без skip_test итог прогона
# показывает, сколько голова живёт на тесте, и число открытых Issues с меткой `test` в ExileForge (выпуск они не блокируют).
#
# Накопление: заметки клиента (RELEASE_NOTES.md, подразделы «Новое / Изменения / Исправления / Техническое») и «Важное» сервера
# (IMPORTANT.md, темы `### …`) копятся до выпуска; Issues и обязательность читаются по коммитам клиента и сервера с прошлого выпуска.
# Release → server сам выкладывает новые пункты «[сервер]» в «Обновления» и закрывает Issues серверных коммитов (метка «сервер <дата>»).
name: Release

on:
  workflow_dispatch:
    inputs:
      what:
        description: 'server - deploy checked head; server-rebuild - checks, image and deploy; client - cumulative release: version commit, checks, release, server deploy, balance of the test stand to prod (bump below); balance - only the balance and client texts of the test stand to prod; client-shots - UI tests and store images only; telegram - post the latest release to the Telegram group again; important - post the new IMPORTANT.md of the server; server-notes - post the new server note lines again; preview - summary of what the release would contain, nothing is released'
        type: choice
        options: [ server, server-rebuild, client, balance, client-shots, telegram, important, server-notes, preview ]
        default: server
      bump:
        description: 'client only: patch - next patch version, minor - next minor version (x.y+1.0)'
        type: choice
        options: [ patch, minor ]
        default: patch
      force_breaking:
        description: 'client only: owner-approved break - the server deploy after the release may cut older builds of the store channels'
        type: boolean
        default: false
      skip_test:
        description: 'server, server-rebuild, client: release without the test stand (the head need not be on the test, the server head is deployed, the test balance is not carried); the summary says it was released past the test'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ inputs.what != 'client' && inputs.what != 'preview' && inputs.what != 'balance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Сервер выкатывается тот, что стоит на тесте (запись ci/test-stand.sh), с skip_test - голова рабочей ветки (sha пуст). Записи нет и skip_test
      # не отмечен - отказ: на тест ещё ничего не выкатывали.
      - name: Server to deploy
        id: stand
        if: ${{ inputs.what == 'server' || inputs.what == 'server-rebuild' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          SKIP_TEST: ${{ inputs.skip_test }}
        run: |
          code=0
          bash ci/test-stand.sh fetch "$RUNNER_TEMP/stand.json" || code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
          file=-; sha=
          if [ "$code" -eq 0 ]; then file="$RUNNER_TEMP/stand.json"; sha=$(python3 -I -c 'import json, sys; print(json.load(open(sys.argv[1]))["server"])' "$file"); fi
          if [ "$SKIP_TEST" = true ]; then sha=
          elif [ -z "$sha" ]; then echo "::error::no deploy to the test stand is recorded yet: wait for the test deploy of a client push (or tick skip_test)"; exit 1
          fi
          issues=$(GH_TOKEN=$ISSUES_TOKEN bash ci/test-stand.sh test-issues 2>/dev/null) || issues='?'
          python3 -I ci/test-stand.py report "$file" na "${issues//[[:space:]]/}" "$SKIP_TEST" "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Start the selected workflow
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ inputs.what }}
          SERVER_SHA: ${{ steps.stand.outputs.sha }}
        run: |
          case "$WHAT" in
            server)         bash ci/retry.sh once gh workflow run server.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=deploy -f sha="$SERVER_SHA" ;;
            server-rebuild) bash ci/retry.sh once gh workflow run server.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=rebuild -f sha="$SERVER_SHA" ;;
            client-shots)   bash ci/retry.sh once gh workflow run client.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=shots ;;
            telegram)       bash ci/retry.sh once gh workflow run telegram.yml -R "$GITHUB_REPOSITORY" --ref main ;;
            important)      bash ci/retry.sh once gh workflow run telegram-important.yml -R "$GITHUB_REPOSITORY" --ref main ;;
            server-notes)   bash ci/retry.sh once gh workflow run telegram-server-notes.yml -R "$GITHUB_REPOSITORY" --ref main ;;
            *) echo "::error::unknown choice '$WHAT'"; exit 1 ;;
          esac
          echo "started: $WHAT"

  # Выпуск клиента: коммит номера версии в рабочую ветку приватного ExileForge и запуск client.yml mode=release на нём. Коммит с
  # темой `feat: release <версия>` проверки пуша пропускают (client.yml, шаг Changed parts), так что петли нет: пуш не выпускает.
  client:
    if: ${{ inputs.what == 'client' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-client
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      packages: read
    env:
      LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Head of the client working branch
        env:
          TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          . ci/branches.env
          bash ci/quiet.sh clone-client bash ci/retry.sh read git clone -q --branch "$CLIENT_BRANCH" "https://x-access-token:$TOKEN@github.com/Sperance/ExileForge.git" src
      # Выпуск выходит парой, проверенной вместе: голова рабочей ветки сервера по коду равна серверу, закреплённому в клиенте (разница -
      # только .md вне образа, ci/server-diff.sh), и у неё есть проверенный образ (ci/checked-image.sh). Иначе выпуск не начинается:
      # клиент со старыми правилами рядом с новым сервером никто не проверял, а без образа сервер не выкатился бы.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server pinned and checked
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
          IMAGE: ghcr.io/sperance/ktor-bestgame
        run: |
          . ci/branches.env
          bash ci/quiet.sh clone-server bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout --branch "$SERVER_BRANCH" "https://x-access-token:$TOKEN@github.com/Sperance/ktor-bestgame.git" srv
          pin=$(git -C src ls-tree HEAD backend | awk '{print $3}')
          head=$(git -C srv rev-parse HEAD)
          [[ $pin =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no server is pinned in backend/ of the client"; exit 1; }
          git -C srv cat-file -e "$pin^{commit}" 2>/dev/null || { echo "::error::the pinned server $pin is not in the server working branch"; exit 1; }
          bash ci/server-diff.sh srv "$pin" "$head" || { echo "::error::the server head $head has code the client does not pin ($pin): pin it in ExileForge (backend/, API_REVISION by its rules) and press Release again"; exit 1; }
          bash ci/checked-image.sh "$IMAGE" srv "$head" >/dev/null || { echo "::error::the server head $head has no checked image: wait for its push checks (or start Server with mode push) and press Release again"; exit 1; }
          echo "server $head: pinned and checked"
      # Ворота теста. Стенд не включён (нет vars.TEST_SERVER_URL) - ворота пропускают, в сводке красная строка «тестовый стенд не включён».
      # Стенд включён - ворота строгие: голова клиента уже стоит на тесте (запись последнего удачного deploy-test, ci/test-stand.sh: код клиента после
      # коммита стенда не менялся, версия, заметки и .md не в счёт, закреплённый сервер тот же) И сам живой стенд отвечает публичным static/index.json
      # образом этой записи. Итог (возраст выката, открытые Issues `test`, блок «Состояние теста») - в сводке всегда. skip_test обходит ворота.
      - name: Head of the client is on the test stand
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          SKIP_TEST: ${{ inputs.skip_test }}
          TEST_SERVER_URL: ${{ vars.TEST_SERVER_URL }}
        run: |
          if [ -z "$TEST_SERVER_URL" ]; then
            python3 -I ci/test-stand.py report - disabled - "$SKIP_TEST" "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=0
          bash ci/test-stand.sh fetch "$RUNNER_TEMP/stand.json" || code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
          file=-; state=off; reason="no deploy to the test stand is recorded"
          if [ "$code" -eq 0 ]; then
            file="$RUNNER_TEMP/stand.json"
            python3 -I ci/test-stand.py check "$file" src srv "$(git -C src rev-parse HEAD)" "$RUNNER_TEMP/check.txt"
            grep -qx 'on_test=true' "$RUNNER_TEMP/check.txt" && state=on
            reason=$(sed -n 's/^reason=//p' "$RUNNER_TEMP/check.txt")
          fi
          live=-
          if bash ci/test-stand.sh live "$RUNNER_TEMP/live.json"; then live="$RUNNER_TEMP/live.json"; fi
          python3 -I ci/test-stand.py live-check "$file" "$live" "$RUNNER_TEMP/live.txt"
          if [ "$state" = on ] && ! grep -qx 'image_ok=true' "$RUNNER_TEMP/live.txt"; then
            state=off; reason=$(sed -n 's/^reason=//p' "$RUNNER_TEMP/live.txt")
          fi
          issues=$(GH_TOKEN=$ISSUES_TOKEN bash ci/test-stand.sh test-issues 2>/dev/null) || issues='?'
          python3 -I ci/test-stand.py report "$file" "$state" "${issues//[[:space:]]/}" "$SKIP_TEST" "$GITHUB_STEP_SUMMARY"
          python3 -I ci/test-stand.py state-block "$file" "$live" "$GITHUB_STEP_SUMMARY"
          if [ "$state" != on ] && [ "$SKIP_TEST" != true ]; then
            echo "::error::the head is not verified on the live test stand ($reason): wait for the test build of the last push and its deploy, or tick skip_test"
            exit 1
          fi
      # Тот же сторож, что у деплоя (ci/deploy-guard.py), до коммита версии: выпуск не начинается, если новый клиент не будет играть
      # на сервере после выката или сервер не посчитает свою эпоху (это не одобряется), или если выкат отрежет сборки каналов магазинов
      # без force_breaking. Исходники сторожа - Protocol.kt и Content.kt головы сервера (по коду она равна закреплённой).
      - name: The released pair plays after the server deploy
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          FORCE_BREAKING: ${{ inputs.force_breaking }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/guard.txt
        run: |
          for path in rules/src/main/kotlin/com/sperance/exileforge/rules/wire/Protocol.kt rules/src/main/kotlin/com/sperance/exileforge/rules/content/Content.kt; do
            mkdir -p "guard/$(dirname "$path")" && git -C srv show "HEAD:$path" > "guard/$path"
          done
          code=0
          bash ci/quiet.sh deploy-guard python3 ci/deploy-guard.py guard --candidate || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          last=$(bash ci/retry.sh read gh release list -R "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          [ -n "$last" ] || { echo "::error::no released v<x.y.z> tag in $GITHUB_REPOSITORY"; exit 1; }
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "last release: $last, bump: $BUMP"
          python3 -I ci/bump-release.py src "$BUMP" "$last" "$GITHUB_OUTPUT"
      # Обязательность релиза читает ci/release-files.py из последнего коммита, а им станет коммит выпуска: трейлер «Update-Mandatory: yes»
      # любой работы с прошлого выпуска переносится в него - и коммитов клиента, и коммитов сервера между серверами, закреплёнными
      # на прошлом и этом выпуске (ci/release_state.py). Начало диапазона - ci/release-base.sh. Метка «<!-- quiet -->» лежит внутри
      # раздела заметок и переименование заголовка её сохраняет.
      - name: Mandatory update from the accumulated work
        id: mandatory
        env:
          PREV: ${{ steps.version.outputs.last }}
        run: |
          base=$(bash ci/release-base.sh src "$PREV")
          if python3 -I ci/release_state.py trailer Update-Mandatory --cli src --srv srv --base "$base" --head HEAD | grep -qiE '^yes'; then
            echo "mandatory update found since $base"
            echo "mandatory=yes" >> "$GITHUB_OUTPUT"
          else
            echo "mandatory=no" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit the release number
        id: commit
        env:
          TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MANDATORY: ${{ steps.mandatory.outputs.mandatory }}
        run: |
          . ci/branches.env
          export GIT_AUTHOR_NAME=Sperance GIT_AUTHOR_EMAIL=dmitriymalaye@gmail.com GIT_COMMITTER_NAME=Sperance GIT_COMMITTER_EMAIL=dmitriymalaye@gmail.com
          git -C src add app/build.gradle.kts RELEASE_NOTES.md
          git -C src commit -q -m "feat: release $VERSION" -m "Cumulative release: the version number and the notes heading are set when the release is started." -m "$(printf 'Server-Update: yes\nServer-Wipe: no\nVerified: ci'; [ "$MANDATORY" = yes ] && printf '\nUpdate-Mandatory: yes')"
          bash ci/quiet.sh push-client bash ci/retry.sh idem git -C src push -q "https://x-access-token:$TOKEN@github.com/Sperance/ExileForge.git" "HEAD:refs/heads/$CLIENT_BRANCH"
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Start the release run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
          FORCE: ${{ inputs.force_breaking }}
          SKIP_TEST: ${{ inputs.skip_test }}
        run: |
          bash ci/retry.sh once gh workflow run client.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=release -f sha="$SHA" -f force_breaking="$FORCE" -f skip_test="$SKIP_TEST"
          echo "started: release of ${{ steps.version.outputs.version }} at $SHA"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-start-log

  # Release → balance: слепок баланса и текстов клиента теста - в бой (ci/balance-transfer.sh test-to-prod). Оба ключа VPS - только через действие
  # balance-transfer (сторож ci/guard-test-vps.py). Отказ сервера (код на тесте и в бою различается и т.п.) - красный прогон.
  balance:
    if: ${{ inputs.what == 'balance' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: balance-transfer
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/balance-transfer
        with:
          direction: test-to-prod
          host: ${{ secrets.DEPLOY_HOST }}
          prod-key: ${{ secrets.DEPLOY_SSH_KEY }}
          test-key: ${{ secrets.DEPLOY_SSH_KEY_TEST }}
          host-key: ${{ vars.VPS_HOST_KEY }}
          log-recipient: ${{ vars.LOG_AGE_RECIPIENT }}
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: balance-log

  # Сводка слепка баланса теста для предпросмотра: числа и имена файлов, без значений (ci/balance-summary.py). Читает только тест, боевого ключа нет
  # (сторож ci/guard-test-vps.py). Стенд не включён - job не идёт.
  preview-balance:
    if: ${{ inputs.what == 'preview' && vars.TEST_SERVER_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/balance-transfer
        with:
          direction: test-summary
          host: ${{ secrets.DEPLOY_HOST }}
          test-key: ${{ secrets.DEPLOY_SSH_KEY_TEST }}
          host-key: ${{ vars.VPS_HOST_KEY }}
          log-recipient: ${{ vars.LOG_AGE_RECIPIENT }}
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: preview-balance-log

  # Предпросмотр накопленного без выпуска: те же исходники и диапазоны, что у выпуска (голова рабочей ветки клиента, коммиты клиента и
  # закреплённых серверов с прошлого тега), итог - markdown в сводке прогона (ci/release_state.py preview): совет bump, обязательность,
  # Issues к закрытию, вайпы игровых коллекций, текст «Важного», заметки по подразделам. Сводка публична: заметки и «Важное» в ней
  # уже в том виде, в каком выйдут к игрокам; кода, данных игроков и секретов в ней нет.
  preview:
    if: ${{ inputs.what == 'preview' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Heads of both working branches
        env:
          TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          SOURCE: ${{ secrets.SOURCE_TOKEN }}
        run: |
          . ci/branches.env
          bash ci/quiet.sh clone-client bash ci/retry.sh read git clone -q --branch "$CLIENT_BRANCH" "https://x-access-token:$TOKEN@github.com/Sperance/ExileForge.git" src
          bash ci/quiet.sh clone-server bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout --branch "$SERVER_BRANCH" "https://x-access-token:$SOURCE@github.com/Sperance/ktor-bestgame.git" srv
      - name: Preview
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/preview-public.txt
        run: |
          last=$(GH_TOKEN=$REPO_TOKEN bash ci/retry.sh read gh release list -R "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          [ -n "$last" ] || { echo "::error::no released v<x.y.z> tag in $GITHUB_REPOSITORY"; exit 1; }
          tags() { GH_TOKEN=$REPO_TOKEN bash ci/retry.sh read gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$1" --paginate --jq '.[].ref' > "$RUNNER_TEMP/$2"; }
          tags important- tags-important.txt
          tags server-note- tags-notes.txt
          tags server-deployed/ tags-deployed.txt
          base=$(bash ci/release-base.sh src "$last")
          code=0
          mkdir -p preview
          bash ci/quiet.sh preview python3 -I ci/release_state.py preview --cli src --srv srv --base "$base" --head HEAD --srv-head HEAD \
            --last "$last" --repo Sperance/ExileForge --out preview/preview.md --summary "$RUNNER_TEMP/summary.md" --posted-important "$RUNNER_TEMP/tags-important.txt" \
            --posted-server "$RUNNER_TEMP/tags-notes.txt" --deployed "$RUNNER_TEMP/tags-deployed.txt" || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          [ "$code" -eq 0 ] && cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: Seal the preview
        if: always()
        run: bash ci/seal.sh sealed/preview.enc preview
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: preview
          path: sealed/preview.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: preview-log
