# CI и релизы приватного клиента Sperance/ExileForge на бесплатных минутах публичного репозитория.
# Код клиента здесь не хранится: job'ы скачивают нужный коммит токеном SOURCE_TOKEN (.github/actions/source). Журналы и
# артефакты публичны: сборки и тесты идут через ci/quiet.sh (в журнал - только итог шага), артефакты зашифрованы ci/seal.sh
# (age, открытые ключи vars.LOG_AGE_RECIPIENT и SEAL_AGE_RECIPIENT; ci/crypt.sh) - APK UI-тестов не ужат, отчёты и снимки экранов
# раскрывают код.
# Подпись отделена от сборки: Gradle собирает релизные пакеты в job'ах БЕЗ секретов подписи (одноразовый ключ, ci/build-keystore.sh),
# а job `sign` (секреты подписи только ему; без ручного подтверждения: выпуск запускает владелец кнопкой Release)
# без кода игры снимает эту подпись, подписывает пакеты ключом релиза (apksigner / jarsigner, ci/sign.sh) и проверяет отпечаток.
#
# Запуск:
#   repository_dispatch client-push - пуш в рабочую ветку клиента (job `forward` в android.yml ExileForge): sha и before. ТОЛЬКО
#                                     проверки затронутого (с R8-сборками и эмулятором, если задет код), без релиза: выпуски накопительные (заметки копятся в RELEASE_NOTES.md
#                                     под `## Следующая версия`, номер версии в работах не трогается). Коммит выпуска `feat: release
#                                     <версия>` (его делает release.yml) проверки пуша пропускает: те же проверки идут в режиме release,
#                                     кроме тех, что уже были зелёными на том же коде (метка «зелёное дерево», ci/green-tree.sh);
#   workflow_dispatch               - вручную: push - как пуш (проверки затронутого, без релиза); release - все проверки и релиз
#                                     коммита (его запускает Release → client после коммита номера версии, руками не запускать);
#                                     shots - UI-тесты на эмуляторе и картинки магазина (StoreShotsTest), без релиза;
#                                     stores - заново выложить выпущенную версию в магазины; cache - только архивы для облачных
#                                     сессий агента (job `gradle-cache`); check-wip - все проверки как у пуша кода (core, app, R8-сборки,
#                                     эмулятор, контракт с сервером), не по разнице, без релиза: его зовёт check-wip.yml как вызываемый
#                                     workflow на текущем wip клиента (см. там).
# Релиз (только режим release): versionName без релиза в exile-ci после зелёных проверок - тег v<версия> здесь с APK, update.json и заметками
# RELEASE_NOTES.md (их читает игра, Updates.kt); карты R8 (mapping.txt прямого APK, mapping-play.txt и mapping-rustore.txt магазинов) - только в релиз того же тега приватного ExileForge
# (её качает сервер, ReleaseMappings). Сразу после публикации запускается деплой сервера (server.yml, режим deploy), затем Issues, что называют
# коммиты с прошлого релиза трейлером `Issue: #N`, получают метку версии, теряют метки `ready` и `in-progress` и закрываются.
# Каналы: прямой APK (релиз здесь), Google Play (AAB на дорожку переменной PLAY_TRACK: alpha - закрытый тест, beta - ранний доступ,
# production - долей 20%; job `publish-play`) и RuStore (APK с автопубликацией, job
# `publish-rustore`); задачи сборки и пути результатов - ci/build-tasks.env. Загрузка в магазин идёт после релиза, дождавшись сервера на
# ревизии релиза, и только если в репозитории есть ключи магазина, иначе job зелёный без дела. Состояние каналов опрашивает maintenance.yml (задача store-status); прямой канал
# отчётом серверу объявляет сам `release` (переменная SERVER_URL, секрет RELEASE_STATUS_TOKEN).
# Секреты: SOURCE_TOKEN, EXILEFORGE_TOKEN (Contents и Issues: write на ExileForge), SEAL_AGE_IDENTITY (закрытый ключ age для
# распаковки артефактов между job'ами; только шагам, что их распаковывают), RELEASE_KEYSTORE, RELEASE_KEYSTORE_PASSWORD,
# RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD (только job `sign`); магазины: PLAY_SERVICE_ACCOUNT_JSON, RUSTORE_KEY_ID,
# RUSTORE_PRIVATE_KEY; RELEASE_STATUS_TOKEN. Переменные: RUSTORE_CONTACT_EMAIL, RUSTORE_CONTACT_WEBSITE, RUSTORE_CONTACT_VK -
# контакты разработчика карточки RuStore (без email магазин может отказать в черновике); LOG_AGE_RECIPIENT, SEAL_AGE_RECIPIENT.
# Ручной режим stores - заново собрать и выложить в Google Play и RuStore уже выпущенную версию (без проверок и релиза здесь).
# Архивы для облачных сессий агента (job'ы `gradle-cache` и `gradle-toolchain`, в конце файла) пересобираются, только когда меняется
# ключ (хэш файлов сборки) или кнопкой (режим cache).
# Пуш после Check wip: commit status `check-wip` = success на том же sha (его кладёт check-wip.yml, пуш в рабочую ветку - fast-forward из wip)
# пропускает все ворота пуша (core, app, R8-сборки и эмулятор, контракт с сервером); метки зелёного дерева при этом ставятся. Нет статуса - ворота идут.
# Зелёные деревья: пуш (и ручной push) после успешных ворот кладёт в кэш Actions пустую метку `client-green-<дерево>-<ворота>` (дерево -
# ci/green-tree.sh: код без RELEASE_NOTES.md и номера версии). Режим release ищет метки и пропускает ворота, чей код уже был зелёным;
# метки нет - ворота идут как обычно. Метка живёт в кэше Actions (до 7 суток без обращений).
# Тестовая сборка (flavor qa, vars.TEST_SERVER_URL): после зелёных ворот пуша (режим push), если менялся код клиента или пин backend/ (любой файл,
# кроме .md, audit/, .claude/ и номера версии; ci/test-stand.py code-changed - пуш только с документами сборку не запускает) и sha - голова рабочей ветки,
# job `qa-apk` собирает qa-вариант (R8, одноразовый ключ; карта R8 едет запечатанной вместе с APK), `qa-sign` подписывает его ключом релиза, `qa-release` готовит файлы предрелиза qa-<число
# коммитов> (ExileForge-qa.apk, update.json с mandatory=true и подпись; заметки - номер сборки и пункты «что проверить» из трейлеров `Test-Plan:`), запечатывает
# их, кладёт карту R8 (mapping.txt.gz после ci/verify-map.py) в приватный предрелиз qa-<n> ExileForge (хранятся карты 5 новейших) и запускает server.yml deploy-test на сервере, закреплённом в клиенте (передаёт ему sha клиента, тег qa и номер своего прогона: по ним deploy-test
# записывает, что стоит на тесте, - ci/test-stand.sh, а job `qa-publish` ПОСЛЕ удачного выката публикует предрелиз, оставляет 5 новейших и ведёт qa-latest). Переменная пуста - все три job'а пропускаются зелёными. Секреты те же, что у выпуска; новых нет.
name: Client

on:
  repository_dispatch:
    types: [ client-push ]
  workflow_call:
    inputs:
      mode:
        type: string
        default: check-wip
      sha:
        type: string
        default: ''
      server_head:
        type: boolean
        default: false
      force_breaking:
        type: boolean
        default: false
      skip_test:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      mode:
        description: 'push - checks of the changed parts, no release; release - all checks (except the gates already green on the same code) and release of the commit (started by Release -> client after the version commit); shots - emulator UI tests and the store images (StoreShotsTest), no release; stores - publish the already released version to Google Play and RuStore again; cache - rebuild the agent session archives, build cache included (gradle-cache release of ExileForge); check-wip - all gates of a code push, no release (check-wip.yml calls it)'
        type: choice
        options: [ push, release, shots, stores, cache, check-wip ]
        default: push
      sha:
        description: 'Client commit (empty - head of the working branch)'
        required: false
      server_head:
        description: 'cache mode: build the archives with the head of the server working branch instead of the pinned server (server.yml starts it after a deploy that changed build files)'
        type: boolean
        default: false
      force_breaking:
        description: 'release mode: owner-approved break for the server deploy after the release (set by Release -> client)'
        type: boolean
        default: false
      skip_test:
        description: 'release mode: the release went out without the test stand (set by Release -> client); the balance of the test stand is not carried to prod'
        type: boolean
        default: false

# Чужой код здесь не исполняется: триггеров pull_request нет, токен job'ов по умолчанию только читает.
permissions:
  contents: read

env:
  CLIENT_REPO: Sperance/ExileForge
  # Открытые ключи age (ci/crypt.sh) для журналов и артефактов: общие для всех job'ов.
  LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
  SEAL_AGE_RECIPIENT: ${{ vars.SEAL_AGE_RECIPIENT }}

# Каждый job проверок в своей группе: новый пуш отменяет устаревший прогон, а начатую публикацию (job `release`) - нет.
jobs:
  # Что затронуто и будет ли релиз: от этого зависят тяжёлые job ниже.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # Поиск меток зелёных деревьев в кэше Actions (release)
      actions: read
    concurrency:
      group: client-changes-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'push' }}
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      core: ${{ steps.diff.outputs.core }}
      app: ${{ steps.diff.outputs.app }}
      code: ${{ steps.diff.outputs.code }}
      tree: ${{ steps.green.outputs.tree }}
      skip_core: ${{ steps.green.outputs.skip_core }}
      skip_app: ${{ steps.green.outputs.skip_app }}
      skip_server: ${{ steps.green.outputs.skip_server }}
      trusted: ${{ steps.green.outputs.trusted }}
      release: ${{ steps.release.outputs.pending }}
      shots: ${{ steps.target.outputs.mode == 'shots' }}
      # R8-сборки и эмулятор: выпуск, снимки и каждый пуш, что задел core, app или сервер - зелёный пуш значит, что выпуск пройдёт
      ui: ${{ (steps.target.outputs.mode == 'release' || steps.target.outputs.mode == 'shots' || steps.target.outputs.mode == 'check-wip' || (steps.target.outputs.mode == 'push' && (steps.diff.outputs.core == 'true' || steps.diff.outputs.app == 'true'))) && steps.green.outputs.skip_ui != 'true' }}
      stores: ${{ steps.release.outputs.stores }}
      cache: ${{ steps.target.outputs.mode == 'cache' }}
      qa: ${{ steps.qa.outputs.build }}
      qa_name: ${{ steps.qa.outputs.name }}
      qa_code: ${{ steps.qa.outputs.code }}
      tag: ${{ steps.release.outputs.tag }}
      suffix: ${{ steps.release.outputs.pending == 'true' && '-release' || steps.target.outputs.mode == 'check-wip' && '-wip' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: CI scripts guards
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 -I ci/guard-network.py
          python3 -I ci/guard-parity.py
          python3 -I ci/guard-test-vps.py
      - name: Target commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SHA: ${{ inputs.sha }}
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: . ci/branches.env && bash ci/resolve.sh "$CLIENT_REPO" "$CLIENT_BRANCH" client push release shots stores cache check-wip
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
          fetch-depth: 0
      # Затронутое - по разнице с прошлой головой ветки (before пуша). Ручной запуск, первый пуш или неизвестный before - всё.
      # core и закреплённый сервер: от них зависят тесты core и клиент-серверный контракт; app (TEST-01) - тесты core:
      # UiStringsTest читает ключи `ui("…")` из исходников app
      - name: Changed parts
        id: diff
        working-directory: src
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.client_payload.before }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          if [ "$EVENT" = repository_dispatch ] && git log -1 --format=%s "$SHA" | grep -qE '^feat: release [0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "commit of the release number: the release run checks it, the push run does nothing"
            core=false; app=false; code=false
          elif [ "$EVENT" != repository_dispatch ] || [[ ! $BEFORE =~ ^[0-9a-f]{40}$ || $BEFORE =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            core=true; app=true; code=true
          else
            files=$(git diff --name-only "$BEFORE" "$SHA")
            # app: оболочка и Android-модули (platform, ui-kit, feature/*) и сборочные файлы любого модуля
            grep -qE '^(app|platform|ui-kit|feature)/|(^|/)build\.gradle\.kts$' <<<"$files" && app=true || app=false
            grep -qE '^(core/|backend$|scripts/client_server_test\.py$|gradle/|[^/]+\.gradle\.kts$|gradle\.properties$)' <<<"$files" && core=true || core=false
            code=$(python3 -I ../ci/test-stand.py code-changed . "$BEFORE" "$SHA")
          fi
          echo "core=$core app=$app code=$code"
          { echo "core=$core"; echo "app=$app"; echo "code=$code"; } >> "$GITHUB_OUTPUT"
      # Зелёное дерево: в режиме release ворота, чей код уже прошёл на пуше, пропускаются (метки кладёт job `mark-green`). Не нашли
      # метку или поиск не удался - ворота идут как обычно.
      - name: Green trees
        id: green
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          MODE: ${{ steps.target.outputs.mode }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          tree=$(bash ../ci/green-tree.sh .)
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "code tree $tree"
          trusted=false
          if [ "$MODE" = push ]; then
            # Пуш в рабочую ветку - fast-forward из wip, sha тот же, что прошёл Check wip: commit status `check-wip` = success на этом sha
            # значит, все ворота уже зелёные на этом коде, и они пропускаются. Статуса нет или он не success - ворота идут как обычно; статус не
            # прочитался - то же, но с предупреждением и строкой в сводке job (ci/check-wip-read.sh), а не молча.
            state=$(TOKEN="$STATUS_TOKEN" bash ../ci/check-wip-read.sh "$CLIENT_REPO" "$SHA")
            echo "check-wip status of ${SHA:0:12}: $state"
            if [ "$state" = success ]; then
              trusted=true
              for gate in core app ui server; do echo "skip_$gate=true" >> "$GITHUB_OUTPUT"; done
              echo "all gates are skipped: this commit was checked by Check wip"
            fi
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = release ]; then
            keys=$(bash ../ci/retry.sh read gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=client-green-$tree-&per_page=100" --jq '.actions_caches[].key' 2>/dev/null || true)
            for gate in core app ui server; do
              if grep -qx "client-green-$tree-$gate" <<<"$keys"; then
                echo "skip_$gate=true" >> "$GITHUB_OUTPUT"
                echo "gate $gate: this code was green on a push, the gate is skipped"
              fi
            done
          fi
      # Релиз только в режиме release (пуш не выпускает); R8-сборки и эмулятор идут и на пуш (выход ui). У versionName уже есть релиз
      # здесь - ошибка, номер версии занят.
      - name: Release state
        id: release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          pending=false
          if [ "$MODE" = release ]; then
            ! bash ../ci/retry.sh read gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::v$version is already released: release mode needs a new versionName"; exit 1; }
            pending=true
          fi
          # Режим stores: версия уже выпущена здесь - заново собираются и выкладываются только сборки магазинов
          stores=false
          if [ "$MODE" = stores ]; then
            bash ../ci/retry.sh read gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::v$version is not released yet: stores mode publishes only a released version"; exit 1; }
            stores=true
          fi
          { echo "pending=$pending"; echo "stores=$stores"; echo "tag=v$version"; } >> "$GITHUB_OUTPUT"
          echo "v$version: release pending=$pending, stores=$stores"
      # Тестовая сборка: только пуш с изменённым кодом клиента, sha которого - голова рабочей ветки, и только при заданном адресе тестового
      # сервера. Версия: <следующий patch>-test.<число коммитов ветки>+<sha7>; число коммитов - и versionCode, и номер предрелиза qa-<n>.
      - name: Test build target
        id: qa
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          TEST_SERVER_URL: ${{ vars.TEST_SERVER_URL }}
          MODE: ${{ steps.target.outputs.mode }}
          SHA: ${{ steps.target.outputs.sha }}
          CORE: ${{ steps.diff.outputs.core }}
          APP: ${{ steps.diff.outputs.app }}
          CODE: ${{ steps.diff.outputs.code }}
        run: |
          build=false
          if [ -z "$TEST_SERVER_URL" ]; then
            echo "TEST_SERVER_URL is not set: no test build"
          elif [ "$MODE" != push ] || { [ "$CORE" != true ] && [ "$APP" != true ] && [ "$CODE" != true ]; }; then
            echo "not a push with client code or server pin changes: no test build"
          else
            . ../ci/branches.env
            head=$(GH_TOKEN="$HEAD_TOKEN" bash ../ci/retry.sh read gh api "repos/$CLIENT_REPO/git/ref/heads/$CLIENT_BRANCH" --jq .object.sha)
            if [ "$head" != "$SHA" ]; then
              echo "${SHA:0:12} is not the head of the working branch: no test build"
            else
              code=$(git rev-list --count "$SHA")
              last=$(bash ../ci/retry.sh read gh release list -R "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
              [ -n "$last" ] || { echo "::error::no released version to number the test build from"; exit 1; }
              python3 ../ci/qa-files.py version "$last" "$code" "${SHA:0:7}" "$GITHUB_OUTPUT"
              echo "code=$code" >> "$GITHUB_OUTPUT"
              build=true
              echo "test build $code"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  core:
    needs: changes
    # Перед релизом - всегда (TEST-01): релиз не выходит без словарей и тестов core
    if: ${{ needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' && needs.changes.outputs.skip_core != 'true' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.app == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: client-core${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          cache-writer: 'true'
      # Задачи job - в scripts/check.sh клиента: та же проверка перед пушем
      - name: Core checks
        working-directory: src
        run: bash ../ci/quiet.sh core bash scripts/check.sh core
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: core-log

  # Быстрая часть app: ktlint и сторожа Android-модулей - ранний красный, пока Lint ещё идёт
  app-fast:
    needs: changes
    # При правке app (Android-модули), перед релизом и по ручному запуску; правка только core или сервера сторожей app не трогает
    if: ${{ needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' && needs.changes.outputs.skip_app != 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: client-app-fast${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Fast Android guards
        working-directory: src
        run: bash ../ci/quiet.sh app-fast bash scripts/check.sh app-fast
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: app-fast-log

  app:
    needs: changes
    if: ${{ needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' && needs.changes.outputs.skip_app != 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: client-app${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          cache-writer: 'true'
      # Отладочной сборки нет нигде: lint - по релизному варианту, APK - только R8-сборки ниже. Компиляция и lint - разные шаги, чтобы в журнале
      # было видно время каждого; job пишет кэш Gradle, и выходы lintAnalyze остаются для следующих прогонов
      - name: Release flavor compile
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          bash ../ci/quiet.sh app-release-compile bash gradlew "$DIRECT_COMPILE_TASK"
      - name: Android Lint
        working-directory: src
        run: bash ../ci/quiet.sh app bash scripts/check.sh app-lint
      - name: QA flavor compiles
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          bash ../ci/quiet.sh app-qa-compile bash gradlew "$QA_COMPILE_TASK"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: app-log

  # Сборки с инструментальным APK для эмулятора: `ui-build` - БЕЗ R8 (тип uiTest, флаг -PuiTests): UI-тесты зовут экраны и модели
  # приложения напрямую, на ужатом коде им пришлось бы держать весь пакет (артефакт только зашифрованным); `minified-strict` -
  # единственная сборка с R8 и тестовым APK (без флага): код приложения ужат как в релизе, её проверяет смоук ReleaseSmokeTest.
  # Имя job'а, артефакта, журнала и группы concurrency берутся из matrix.name; `ui-build` пишет кэш Gradle.
  minified:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: client-${{ matrix.name }}${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ui-build
            artifact: ui-apks
            prefix: UI
            stage: true
            writer: 'true'
          - name: minified-strict
            artifact: ui-apks-minified
            prefix: MINIFIED
            stage: false
            writer: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          cache-writer: ${{ matrix.writer }}
      # Приложение и инструментальный APK - два шага: в журнале видно время R8 и время сборки тестов отдельно (решение о делении эмулятора - по цифрам)
      - name: Build the app APK
        working-directory: src
        env:
          NAME: ${{ matrix.name }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          . ../ci/build-tasks.env
          app_task=${PREFIX}_APP_TASK flags=${PREFIX}_FLAGS
          # shellcheck disable=SC2086
          bash ../ci/quiet.sh "$NAME-app" bash gradlew "${!app_task}" ${!flags}
      - name: Build the androidTest APK
        working-directory: src
        env:
          NAME: ${{ matrix.name }}
          PREFIX: ${{ matrix.prefix }}
        run: |
          . ../ci/build-tasks.env
          test_task=${PREFIX}_TEST_TASK flags=${PREFIX}_FLAGS
          # shellcheck disable=SC2086
          bash ../ci/quiet.sh "$NAME-test" bash gradlew "${!test_task}" ${!flags}
      - name: Stage UI test APKs
        if: ${{ matrix.stage }}
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          mkdir -p ui-apks
          cp "$UI_APK" ui-apks/app.apk
          cp "$UI_TEST_APK" ui-apks/app-androidTest.apk
      - name: Seal APKs
        working-directory: src
        env:
          SEALED: ../sealed/${{ matrix.artifact }}.enc
          STAGE: ${{ matrix.stage }}
        run: |
          . ../ci/build-tasks.env
          if [ "$STAGE" = true ]; then paths=ui-apks; else paths="$MINIFIED_APK_DIR $MINIFIED_TEST_APK_DIR"; fi
          bash ../ci/seal.sh --transit "$SEALED" $paths
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: sealed/${{ matrix.artifact }}.enc
          if-no-files-found: error
          retention-days: 1
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: ${{ matrix.name }}-log

  # Релизные пакеты собираются один раз, здесь, БЕЗ секретов подписи: Gradle подписывает их одноразовым ключом
  # (ci/build-keystore.sh), а пакеты уходят в job `sign` зашифрованными артефактами `unsigned-*`. Код игры исполняется только
  # в этих job'ах.
  release-apk:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: client-release-apk${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build release APK (build-only key)
        working-directory: src
        env:
          # Открытый ключ подписи update.json (64 hex) вшивается в прямой канал; пусто - клиент описание не проверяет
          UPDATE_SIGN_PUBLIC_KEY: ${{ vars.UPDATE_SIGN_PUBLIC_KEY }}
        run: |
          . ../ci/build-tasks.env
          eval "$(bash ../ci/build-keystore.sh)"
          bash ../ci/quiet.sh release-apk bash gradlew "$DIRECT_APK_TASK"
      - name: Seal the unsigned package
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          bash ../ci/seal.sh --transit ../sealed/unsigned-apk.enc "$DIRECT_APK" "$DIRECT_MAPPING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-apk
          path: sealed/unsigned-apk.enc
          if-no-files-found: error
          retention-days: 1
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-apk-log

  # Пакет для Google Play (канал `play`: без самообновления и REQUEST_INSTALL_PACKAGES): собирается так же без секретов подписи;
  # подпись ключом релиза - job `sign`, в Play его кладёт job `publish-play` (или вручную: `ci/seal.sh -d`, Play Console).
  release-aab:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' || needs.changes.outputs.stores == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: client-release-aab${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build Play bundle (build-only key)
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          eval "$(bash ../ci/build-keystore.sh)"
          bash ../ci/quiet.sh release-aab bash gradlew "$PLAY_AAB_TASK"
      - name: Seal the unsigned package
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          bash ../ci/seal.sh --transit ../sealed/unsigned-aab.enc "$PLAY_AAB" "$PLAY_MAPPING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-aab
          path: sealed/unsigned-aab.enc
          if-no-files-found: error
          retention-days: 1
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-aab-log

  # APK для RuStore (канал `rustore`: свой магазин обновлений вместо самообновления): так же без секретов подписи; подпись -
  # job `sign`, в магазин его кладёт job `publish-rustore`.
  release-rustore:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' || needs.changes.outputs.stores == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: client-release-rustore${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build RuStore APK (build-only key)
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          eval "$(bash ../ci/build-keystore.sh)"
          bash ../ci/quiet.sh release-rustore bash gradlew "$RUSTORE_APK_TASK"
      - name: Seal the unsigned package
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          bash ../ci/seal.sh --transit ../sealed/unsigned-rustore.enc "$RUSTORE_APK" "$RUSTORE_MAPPING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-rustore
          path: sealed/unsigned-rustore.enc
          if-no-files-found: error
          retention-days: 1
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-rustore-log

  # Подпись ключом релиза: job без кода игры (только ci/ этого репозитория и артефакты сборки), секреты подписи - только
  # его шагам, ручного подтверждения нет: выпуск запускает сам владелец кнопкой Release. Опубликованный APK всегда подписан ключом
  # релиза, поэтому каждый ставится поверх прошлого: нет ключа или отпечаток не совпал - нет релиза. Подписанное уходит дальше теми же
  # именами артефактов, что были раньше (`exile-forge-release`, `exile-forge-play`, `exile-forge-rustore`).
  sign:
    needs: [ changes, release-apk, release-aab, release-rustore ]
    if: ${{ !cancelled() && (needs.changes.outputs.release == 'true' || needs.changes.outputs.stores == 'true') && needs.release-aab.result == 'success' && needs.release-rustore.result == 'success' && (needs.changes.outputs.stores == 'true' || needs.release-apk.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: client-sign
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: ${{ needs.release-apk.result == 'success' }}
        with:
          name: unsigned-apk
          path: sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-aab
          path: sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-rustore
          path: sealed
      - name: Sign with the release key
        env:
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          . ci/build-tasks.env
          bash ci/keystore.sh
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          sign() {   # sign <имя артефакта> <apk|aab> <путь пакета> [сопутствующие файлы...]
            local artifact=$1 kind=$2 pkg=$3 extra
            shift 3
            bash ci/seal.sh -d "sealed/unsigned-$artifact.enc" "unsigned/$artifact"
            bash ci/quiet.sh "sign-$artifact" bash ci/sign.sh "$kind" "unsigned/$artifact/$pkg" "signed/$artifact/$pkg"
            for extra in "$@"; do
              mkdir -p "signed/$artifact/$(dirname "$extra")"
              cp "unsigned/$artifact/$extra" "signed/$artifact/$extra"
            done
          }
          [ ! -f sealed/unsigned-apk.enc ] || sign apk apk "$DIRECT_APK" "$DIRECT_MAPPING"
          sign aab aab "$PLAY_AAB" "$PLAY_MAPPING"
          sign rustore apk "$RUSTORE_APK" "$RUSTORE_MAPPING"
          rm -f "$RUNNER_TEMP/release.jks"
      - name: Seal the signed packages
        run: |
          . ci/build-tasks.env
          mkdir -p out
          seal() {   # seal <имя артефакта> <файл.enc> <пути...>
            local artifact=$1 target=$2
            shift 2
            (cd "signed/$artifact" && bash "$GITHUB_WORKSPACE/ci/seal.sh" --transit "$GITHUB_WORKSPACE/out/$target" "$@")
          }
          [ ! -d signed/apk ] || seal apk release.enc "$DIRECT_APK" "$DIRECT_MAPPING"
          seal aab play.enc "$PLAY_AAB" "$PLAY_MAPPING"
          seal rustore rustore.enc "$RUSTORE_APK" "$RUSTORE_MAPPING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ needs.release-apk.result == 'success' }}
        with:
          name: exile-forge-release
          path: out/release.enc
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exile-forge-play
          path: out/play.enc
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exile-forge-rustore
          path: out/rustore.enc
          if-no-files-found: error
          retention-days: 7
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: sign-log

  # UI-тесты и смоук R8 - только перед релизом и по shots: собранные APK приходят артефактами, Gradle здесь не нужен.
  emulator:
    needs: [ changes, minified ]
    if: ${{ needs.changes.outputs.ui == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: client-emulator${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    env:
      API_LEVEL: 35
      SHOTS: ${{ needs.changes.outputs.shots }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-apks
          path: sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-apks-minified
          path: sealed
      - name: Unpack APKs
        env:
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
        run: |
          bash ci/seal.sh -d sealed/ui-apks.enc .
          bash ci/seal.sh -d sealed/ui-apks-minified.enc .
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      # Эмулятор ставится заранее и с повторами: обрыв скачивания («Error on ZipFile unknown archive») ронял job, а уже
      # поставленный пакет раннер эмулятора не качает заново
      - name: Install the emulator
        id: emulator
        run: |
          home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for attempt in 1 2 3; do
            "$home/cmdline-tools/latest/bin/sdkmanager" --install emulator --channel=0 > /dev/null && [ -x "$home/emulator/emulator" ] && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          echo "version=$(sed -n 's/^Pkg.Revision=//p' "$home/emulator/source.properties")" >> "$GITHUB_OUTPUT"
      # Снимок загруженного эмулятора в кэше: прогон стартует из него, а не с холодной загрузки; новый эмулятор - новый снимок
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-pixel_2-emu${{ steps.emulator.outputs.version }}
      - name: Create AVD snapshot
        if: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"
      - name: Run UI checks on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/quiet.sh ui bash ci/ui-tests.sh
      # Картинки магазина (design-preview/store при shots) - зашифрованным артефактом; отчётов UI-тестов в артефактах нет, упавший шаг
      # пишет зашифрованный журнал
      - name: Seal the store images
        if: ${{ always() && needs.changes.outputs.shots == 'true' }}
        run: bash ci/seal.sh sealed/store-shots.enc design-preview
      - name: Upload the store images
        if: ${{ always() && needs.changes.outputs.shots == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: store-shots
          path: sealed/store-shots.enc
          retention-days: 7
          if-no-files-found: ignore
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: emulator-log

  client-server:
    needs: changes
    # Контракт зависит от core и закреплённого сервера; перед релизом - всегда
    if: ${{ needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' && needs.changes.outputs.skip_server != 'true' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: client-client-server${{ needs.changes.outputs.suffix }}
      cancel-in-progress: ${{ needs.changes.outputs.suffix == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Сервер под проверкой - закреплённый сабмодуль backend/: его HEAD - сгенерированный SERVER_COMMIT
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          java: '21'
      # Образ Mongo тянется, пока собирается сервер: действие mongo потом берёт его уже скачанным
      - name: Start the Mongo image pull
        run: (docker pull -q mirror.gcr.io/library/mongo:8.0 >/dev/null 2>&1 || true) &
      - name: Build the server distribution
        working-directory: src/backend
        run: bash ../../ci/quiet.sh server-dist bash gradlew installDist
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/mongo
      - name: Verify actual client and server contract
        working-directory: src
        run: bash ../ci/quiet.sh client-server python3 scripts/client_server_test.py
      - name: Seal reports
        if: always()
        working-directory: src
        run: bash ../ci/seal.sh ../sealed/client-server.enc core/build/reports/tests core/build/test-results build/client-server.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: client-server-reports
          path: |
            sealed/client-server.enc
            logs
          if-no-files-found: ignore

  # Метки зелёных деревьев: ворота, что прошли на этом коде (дерево без номера версии и заметок, ci/green-tree.sh), кладутся в кэш Actions
  # пустым файлом под ключом client-green-<дерево>-<ворота>. Выпуск (release) такие ворота пропускает. Ворота `app` - обе части (app-fast
  # и Lint), `ui` - R8-сборки и эмулятор, `server` - client-server. Режимы shots, stores и cache меток не ставят.
  mark-green:
    needs: [ changes, core, app-fast, app, emulator, client-server ]
    if: ${{ !cancelled() && needs.changes.outputs.shots != 'true' && needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TREE: ${{ needs.changes.outputs.tree }}
    steps:
      - name: Green tree file
        run: mkdir -p green && echo "$TREE" > green/tree
      - if: ${{ needs.core.result == 'success' || needs.changes.outputs.trusted == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: green
          key: client-green-${{ env.TREE }}-core
      - if: ${{ (needs.app-fast.result == 'success' && needs.app.result == 'success') || needs.changes.outputs.trusted == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: green
          key: client-green-${{ env.TREE }}-app
      - if: ${{ needs.emulator.result == 'success' || needs.changes.outputs.trusted == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: green
          key: client-green-${{ env.TREE }}-ui
      - if: ${{ needs.client-server.result == 'success' || needs.changes.outputs.trusted == 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: green
          key: client-green-${{ env.TREE }}-server

  # После зелёных проверок versionName без релиза публикуется: тег v<versionName> здесь с APK из `release-apk`, update.json и
  # заметками RELEASE_NOTES.md; карты R8 всех трёх вариантов (с проверкой pg_map_id по dex сборки) - в релиз того же тега приватного ExileForge, на коммите клиента. Затем - пост о версии
  # в группу Telegram (telegram.yml).
  # Пропущенные по фильтру проверки (core без изменений) релиз не держат; упавшие или отменённые - держат.
  release:
    # Пакеты магазинов собираются до публикации: сломанный вариант сборки не даёт выпустить версию в одном канале и не выпустить в другом
    needs: [ changes, core, app-fast, app, minified, release-apk, release-aab, release-rustore, sign, emulator, client-server ]
    if: ${{ !cancelled() && needs.changes.outputs.release == 'true' && needs.sign.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
      # Запуск деплоя сервера (server.yml) после релиза
      actions: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      SHA: ${{ needs.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Публикации нужны заметки, версии и ревизии из исходников, а закрытию Issues - история с тегами
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - name: Release version
        id: version
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if bash ../ci/retry.sh read gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-release
          path: sealed
      # Пакеты Play и RuStore нужны только ради их карт R8 (подписанные, как и опубликованные в магазины)
      - if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-play
          path: sealed
      - if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-rustore
          path: sealed
      - if: steps.version.outputs.exists == 'false'
        name: Release files
        id: files
        working-directory: src
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
        run: |
          . ../ci/build-tasks.env
          export DIRECT_APK DIRECT_MAPPING
          bash ../ci/seal.sh -d ../sealed/release.enc .
          python3 ../ci/release-files.py "$TAG" ..
          bash ../ci/seal.sh -d ../sealed/play.enc ../maps/play
          bash ../ci/seal.sh -d ../sealed/rustore.enc ../maps/rustore
          cp "../maps/play/$PLAY_MAPPING" ../mapping-play.txt
          cp "../maps/rustore/$RUSTORE_MAPPING" ../mapping-rustore.txt
          python3 ../ci/verify-map.py "$DIRECT_APK" ../mapping.txt
          python3 ../ci/verify-map.py "../maps/play/$PLAY_AAB" ../mapping-play.txt
          python3 ../ci/verify-map.py "../maps/rustore/$RUSTORE_APK" ../mapping-rustore.txt
          cat ../update.json
          echo "apk=ExileForge-$TAG.apk" >> "$GITHUB_OUTPUT"
      # Карта R8 - сначала и только в приватный ExileForge: тег на коммите клиента нужен и для диапазона коммитов с трейлером `Issue: #N` ниже.
      - if: steps.version.outputs.exists == 'false'
        name: Private release with the R8 maps
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Карты сжатые (в ~10 раз меньше): сервер читает mapping.txt.gz (прямой APK), mapping-play.txt.gz и mapping-rustore.txt.gz
          # (сборки магазинов; нужную выбирает по pg_map_id), у старых релизов - mapping.txt (ReleaseMappings)
          gzip -9 -kf mapping.txt mapping-play.txt mapping-rustore.txt
          if bash ../ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            bash ../ci/retry.sh idem gh release upload "$TAG" mapping.txt.gz mapping-play.txt.gz mapping-rustore.txt.gz -R "$CLIENT_REPO" --clobber
          else
            bash ../ci/retry.sh once gh release create "$TAG" mapping.txt.gz mapping-play.txt.gz mapping-rustore.txt.gz -R "$CLIENT_REPO" --target "$SHA" --title "ExileForge ${TAG#v}" --notes "R8 mapping of ${TAG#v}"
          fi
          # Карты хранятся у 10 последних релизов v*: у старших ассеты mapping*.txt* удаляются (сам релиз и тег остаются)
          # Порядок - по дате выхода, не по номеру: среди тегов есть старая схема v4.x, старше нынешних v0.x
          bash ../ci/retry.sh read gh api --paginate "repos/$CLIENT_REPO/releases?per_page=100" --jq '.[] | select(.tag_name | test("^v[0-9]")) | [.created_at, .tag_name, ([.assets[] | select(.name | startswith("mapping")) | .id] | join(" "))] | @tsv' \
            | sort -r | tail -n +11 | while IFS=$'\t' read -r _ old ids; do
                for id in $ids; do bash ../ci/retry.sh idem gh api -X DELETE "repos/$CLIENT_REPO/releases/assets/$id" >/dev/null || echo "::warning::mapping of $old was not deleted"; done
              done
      # Подпись описания: Ed25519 над байтами update.json как есть, 128 hex в update.json.sig (клиент: ManifestSignature)
      - if: steps.version.outputs.exists == 'false'
        name: Sign update.json
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: bash ci/sign-update.sh update.json
      - if: steps.version.outputs.exists == 'false'
        name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.files.outputs.apk }}
        run: |
          sig=(); [ -s update.json.sig ] && sig=(update.json.sig)
          bash ../ci/retry.sh once gh release create "$TAG" "$APK" update.json "${sig[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ExileForge ${TAG#v}" --notes-file RELEASE_NOTES.md --latest
      # Сервер с новым API ждёт этот релиз: опубликовали - сразу запускаем его деплой (магазины ждут сервер, job'ы publish-* стартуют
      # после этого job'а), он выкатит проверенный образ головы рабочей ветки сервера. Закрытие Issues и пост идут уже после запуска.
      - if: steps.version.outputs.exists == 'false'
        name: Trigger the server deploy
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_breaking || false }}
          SKIP_TEST: ${{ inputs.skip_test || false }}
          TAG: ${{ steps.version.outputs.tag }}
        run: bash ../ci/retry.sh once gh workflow run server.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=deploy -f force_breaking="$FORCE" -f skip_test="$SKIP_TEST" -f version="${TAG#v}"
      # Пост с заметками в группу Telegram (telegram.yml). Не запустился - релиз не держит: повторить можно через Release → telegram.
      - if: steps.version.outputs.exists == 'false'
        name: Announce in Telegram
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: bash ../ci/retry.sh once gh workflow run telegram.yml -R "$GITHUB_REPOSITORY" --ref main -f tag="$TAG"
      # Issues, что чинит релиз: коммиты клиента с прошлого релиза, что называют трейлером `Issue: #N`, и коммиты сервера между
      # закреплёнными в клиенте серверами прошлого и этого релиза с трейлером `Refs <репо клиента>#N` (история backend/ нужна целиком) -
      # Issue получает метку версии и закрывается выполненным, без комментария; игра увидит это синхронизацией сервера.
      # Рабочая ветка - не основная, сам GitHub по таким словам Issues не закрывает.
      - if: steps.version.outputs.exists == 'false'
        name: Close the issues this release fixes
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          bash ../ci/retry.sh read git -C backend fetch --quiet --unshallow 2>/dev/null || true
          bash ../ci/close-issues.sh "$CLIENT_REPO" "$TAG" "$SHA"
      # Прямой канал сервер узнаёт отчётом: релиз GitHub вышел, доля 1.0. Новый деплой сервера (шаг выше) ещё идёт, поэтому отчёт
      # может не дойти (маршрута нет у прежнего сервера) - это предупреждение, отчёт повторит задача store-status (после выкладки и раз в 6 часов) в maintenance.yml.
      - if: steps.version.outputs.exists == 'false'
        name: Report the direct channel to the server
        continue-on-error: true
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_TOKEN }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
        run: |
          code=0
          bash ci/quiet.sh report-direct python3 ci/store-status.py direct update.json || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-log

  # Тестовая сборка клиента (flavor qa, сервер из vars.TEST_SERVER_URL): после зелёных ворот пуша, если код менялся и sha - голова рабочей
  # ветки (выход qa job'а changes). Сборка идёт без секретов, как release-apk: одноразовый ключ, URL тестового сервера и версия - свойствами Gradle.
  # Профиль Gradle (--profile) кладётся зашифрованным артефактом qa-apk-profile на 7 дней - замер, на что уходит время сборки.
  qa-apk:
    needs: [ changes, core, app-fast, app, minified, emulator, client-server ]
    if: ${{ !cancelled() && needs.changes.outputs.qa == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: client-qa-apk
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build the test APK (build-only key)
        working-directory: src
        env:
          UPDATE_SIGN_PUBLIC_KEY: ${{ vars.UPDATE_SIGN_PUBLIC_KEY }}
          TEST_SERVER_URL: ${{ vars.TEST_SERVER_URL }}
          QA_NAME: ${{ needs.changes.outputs.qa_name }}
          QA_CODE: ${{ needs.changes.outputs.qa_code }}
        run: |
          . ../ci/build-tasks.env
          eval "$(bash ../ci/build-keystore.sh)"
          bash ../ci/quiet.sh qa-apk bash gradlew --profile "$QA_APK_TASK" "-PqaServerUrl=$TEST_SERVER_URL" "-PqaVersionName=$QA_NAME" "-PqaVersionCode=$QA_CODE"
      - name: Encrypted build profile
        working-directory: src
        run: |
          mkdir -p ../profile
          tar -czf "$RUNNER_TEMP/qa-profile.tgz" -C build/reports profile
          bash ../ci/encrypt-log.sh "$RUNNER_TEMP/qa-profile.tgz" ../profile/qa-apk-profile.tgz.enc
      - uses: ./.github/actions/upload-log
        with:
          name: qa-apk-profile
          path: profile
      - name: Seal the unsigned package
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          bash ../ci/seal.sh --transit ../sealed/unsigned-qa.enc "$QA_APK" "$QA_MAPPING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-qa
          path: sealed/unsigned-qa.enc
          if-no-files-found: error
          retention-days: 1
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: qa-apk-log

  # Подпись тестового APK ключом релиза (тот же ci/sign.sh и те же секреты, что у job `sign`; сборка с одним applicationId не заходит на боевой
  # сервер: пакет проверяет атрибуция сервера). Секреты подписи только здесь, кода игры в job'е нет.
  qa-sign:
    needs: [ changes, qa-apk ]
    if: ${{ !cancelled() && needs.qa-apk.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: client-qa-sign
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-qa
          path: sealed
      - name: Sign with the release key
        env:
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          . ci/build-tasks.env
          bash ci/keystore.sh
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          bash ci/seal.sh -d sealed/unsigned-qa.enc unsigned
          bash ci/quiet.sh sign-qa bash ci/sign.sh apk "unsigned/$QA_APK" "signed/$QA_APK"
          mkdir -p out
          mkdir -p "signed/$(dirname "$QA_MAPPING")"
          cp "unsigned/$QA_MAPPING" "signed/$QA_MAPPING"
          (cd signed && bash "$GITHUB_WORKSPACE/ci/seal.sh" --transit "$GITHUB_WORKSPACE/out/qa.enc" "$QA_APK" "$QA_MAPPING")
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exile-forge-qa
          path: out/qa.enc
          if-no-files-found: error
          retention-days: 1
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: qa-sign-log

  # Файлы тестовой сборки (qa-<число коммитов>): APK, update.json только с номером сборки и пунктами «что проверить» (трейлеры `Test-Plan:` коммитов
  # с прошлой тестовой сборки, ci/qa-files.py plan) и подпись запечатываются в артефакт qa-publish. Сами они НЕ публикуются: предрелиз qa-<n> и
  # постоянный адрес qa-latest выкладывает server.yml job `qa-publish` ТОЛЬКО после удачного выката сервера теста. Здесь - если sha всё ещё голова
  # рабочей ветки (более новый пуш ведёт свою сборку; порядок номеров сохраняется) и тега ещё нет - запуск деплоя тестового сервера на sha,
  # закреплённом в этом коммите клиента (server.yml, режим deploy-test), с номером этого прогона.
  qa-release:
    needs: [ changes, qa-sign ]
    if: ${{ !cancelled() && needs.qa-sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    concurrency:
      group: client-qa-release
      cancel-in-progress: false
    env:
      SHA: ${{ needs.changes.outputs.sha }}
      QA_NAME: ${{ needs.changes.outputs.qa_name }}
      QA_CODE: ${{ needs.changes.outputs.qa_code }}
      TAG: qa-${{ needs.changes.outputs.qa_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          submodules: true
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Still the head of the working branch
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          . ci/branches.env
          head=$(GH_TOKEN="$HEAD_TOKEN" bash ci/retry.sh read gh api "repos/$CLIENT_REPO/git/ref/heads/$CLIENT_BRANCH" --jq .object.sha)
          current=true
          [ "$head" = "$SHA" ] || { echo "a newer push owns the test build: nothing is published"; current=false; }
          if bash ci/retry.sh read gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$TAG is already published"; current=false; fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-qa
          path: sealed
      - if: steps.head.outputs.current == 'true'
        name: Test plan since the previous test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(bash ci/retry.sh read gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.prerelease) | .tag_name' | grep -E '^qa-[0-9]+$' | sort -t- -k2 -n | tail -1 || true)
          old=-
          if [ -n "$prev" ]; then
            short=$(bash ci/retry.sh read gh release view "$prev" -R "$GITHUB_REPOSITORY" --json body --jq .body | sed -n 's/.*+\([0-9a-f]\{7\}\).*/\1/p' | head -1)
            [ -z "$short" ] || old=$(git -C src rev-parse --verify --quiet "$short^{commit}" || echo -)
          fi
          python3 -I ci/qa-files.py plan src "$old" "$SHA" "$RUNNER_TEMP/plan.txt"
      - if: steps.head.outputs.current == 'true'
        name: Test release files
        working-directory: src
        env:
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          . ../ci/build-tasks.env
          bash ../ci/seal.sh -d ../sealed/qa.enc ../signed
          python3 ../ci/qa-files.py release "../signed/$QA_APK" "$QA_NAME" "$QA_CODE" ../qa "$RUNNER_TEMP/plan.txt"
          bash ../ci/sign-update.sh ../qa/update.json
      - if: steps.head.outputs.current == 'true'
        name: Private prerelease with the R8 map
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          . ci/build-tasks.env
          python3 ci/verify-map.py "signed/$QA_APK" "signed/$QA_MAPPING"
          cp "signed/$QA_MAPPING" mapping.txt
          gzip -9 -f mapping.txt
          if bash ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            bash ci/retry.sh idem gh release upload "$TAG" mapping.txt.gz -R "$CLIENT_REPO" --clobber
          else
            bash ci/retry.sh once gh release create "$TAG" mapping.txt.gz -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "ExileForge test ${TAG#qa-}" --notes "R8 mapping of test build $QA_NAME"
          fi
          bash ci/retry.sh read gh api --paginate "repos/$CLIENT_REPO/releases?per_page=100" --jq '.[] | select(.tag_name | test("^qa-[0-9]+$")) | [(.tag_name | ltrimstr("qa-") | tonumber), .tag_name, ([.assets[] | select(.name | startswith("mapping")) | .id] | join(" "))] | @tsv' \
            | sort -rn | tail -n +6 | while IFS=$'\t' read -r _ old ids; do
                for id in $ids; do bash ci/retry.sh idem gh api -X DELETE "repos/$CLIENT_REPO/releases/assets/$id" >/dev/null || echo "::warning::mapping of $old was not deleted"; done
              done
      - if: steps.head.outputs.current == 'true'
        name: Seal the files for the publication after the test deploy
        run: bash ci/seal.sh --transit sealed-out/qa-publish.enc qa
      - if: steps.head.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-publish
          path: sealed-out/qa-publish.enc
          retention-days: 2
          if-no-files-found: error
      - if: steps.head.outputs.current == 'true'
        name: Trigger the test server deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(git -C src ls-tree "$SHA" backend | awk '{print $3}')
          [[ $pin =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the client commit pins no server in backend/"; exit 1; }
          bash ci/retry.sh once gh workflow run server.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=deploy-test -f sha="$pin" -f client_sha="$SHA" -f qa_tag="$TAG" -f qa_run="$GITHUB_RUN_ID"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: qa-release-log

  # Загрузка в магазины - после публикации релиза и только с ключами магазина; без них job зелёный и ничего не делает. Перед загрузкой
  # job ждёт сервер: манифест SERVER_URL/static/index.json должен объявить ревизию не ниже apiRevision релиза (ci/wait-server.py, до 30
  # минут, иначе красный): сборка из магазина не должна опередить сервер, на котором она говорит. Повторить неудачную загрузку можно
  # перезапуском упавшего job'а: пакеты лежат в артефактах прогона, повторная загрузка той же версии безопасна. Заметки магазинов и
  # обязательность (приоритет обновления 5) - из update.json релиза (RELEASE_NOTES.md без заголовка).
  publish-play:
    needs: [ changes, release, sign ]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.changes.outputs.stores == 'true') && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    concurrency:
      group: publish-play
      cancel-in-progress: false
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_TRACK: ${{ vars.PLAY_TRACK }}
      TAG: ${{ needs.release.outputs.tag || needs.changes.outputs.tag }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - name: Store gate
        id: gate
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set: Google Play upload skipped"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.enabled == 'true'
        name: Wait for the server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/retry.sh read gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p update.json
          python3 ci/wait-server.py update.json
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-play
          path: sealed
      - if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/store-tools
      - if: steps.gate.outputs.enabled == 'true'
        name: Upload to Google Play
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
        run: |
          set -a; . ci/build-tasks.env; set +a
          bash ci/seal.sh -d sealed/play.enc .
          code=0
          bash ci/quiet.sh publish-play python3 ci/play.py upload "$PLAY_AAB" update.json || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: publish-play-log

  publish-rustore:
    needs: [ changes, release, sign ]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.changes.outputs.stores == 'true') && needs.sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    concurrency:
      group: publish-rustore
      cancel-in-progress: false
    env:
      RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
      RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
      TAG: ${{ needs.release.outputs.tag || needs.changes.outputs.tag }}
      RUSTORE_CONTACT_EMAIL: ${{ vars.RUSTORE_CONTACT_EMAIL }}
      RUSTORE_CONTACT_WEBSITE: ${{ vars.RUSTORE_CONTACT_WEBSITE }}
      RUSTORE_CONTACT_VK: ${{ vars.RUSTORE_CONTACT_VK }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - name: Store gate
        id: gate
        run: |
          if [ -n "$RUSTORE_KEY_ID" ] && [ -n "$RUSTORE_PRIVATE_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::RUSTORE_KEY_ID or RUSTORE_PRIVATE_KEY is not set: RuStore upload skipped"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.enabled == 'true'
        name: Wait for the server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ci/retry.sh read gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p update.json
          python3 ci/wait-server.py update.json
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-rustore
          path: sealed
      - if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/store-tools
      - if: steps.gate.outputs.enabled == 'true'
        id: upload
        name: Upload to RuStore
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
        run: |
          set -a; . ci/build-tasks.env; set +a
          bash ci/seal.sh -d sealed/rustore.enc .
          code=0
          export RUSTORE_STATE="$RUNNER_TEMP/rustore-state.json"
          bash ci/quiet.sh publish-rustore python3 ci/rustore.py upload "$RUSTORE_APK" update.json || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          # Файл состояния RuStore есть - магазин требует ручной загрузки или ждёт модерации прошлой версии: APK - в релиз, владельцу - Issue
          if [ "$code" = 0 ] && [ -s "$RUSTORE_STATE" ]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            echo "apk=$RUSTORE_APK" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
      - if: steps.upload.outputs.manual == 'true'
        name: Hand the APK over for a manual RuStore upload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          APK: ${{ steps.upload.outputs.apk }}
        run: |
          version=$(python3 -c 'import json;print(json.load(open("update.json"))["versionName"])')
          asset="ExileForge-$version-rustore.apk"
          cp "$APK" "$RUNNER_TEMP/$asset"
          bash ci/retry.sh idem gh release upload "$TAG" "$RUNNER_TEMP/$asset" -R "$GITHUB_REPOSITORY" --clobber
          # Один Issue на версию: шаги, строка «ждёт модерации прошлой / нужна ручная загрузка»; повтор - store-status (maintenance.yml)
          EXILEFORGE_TOKEN="$ISSUE_TOKEN" bash ci/quiet.sh rustore-manual python3 ci/rustore_manual.py note "$version" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset" "$RUNNER_TEMP/rustore-state.json"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: publish-rustore-log

  # Состояние каналов сразу после выкладки выпуска (решение владельца): store-status maintenance.yml запускается один раз, дальше -
  # по его расписанию раз в 6 часов. Только после выпуска версии (не в режиме stores: его запускает сама store-status).
  store-status:
    needs: [ changes, release, publish-play, publish-rustore ]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run the store status task
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/retry.sh once gh workflow run maintenance.yml -R "$GITHUB_REPOSITORY" --ref main -f task=store-status

  # Архивы для облачных сессий агента - prerelease `gradle-cache` приватного ExileForge (не latest: игра, update.json и релизы
  # версий его не видят); сессия распаковывает их хуками .claude/hooks/gradle-cache.sh и toolchain.sh клиента:
  #   gradle-cache-<ключ>  зависимости (caches/modules-2) и дистрибутивы (wrapper/dists) клиента и закреплённого в нём сервера;
  #                        пересобирается, только когда меняется ключ - хэш файлов сборки клиента и сервера (имя файла архива);
  #   build-cache-<ключ>   кэш сборки Gradle (caches/build-cache-1): результаты задач, чтобы неизменные модули не компилировались
  #                        заново; обновляется только в ручном режиме cache (кнопка) вместе со сменой ключа, только из запусков на main;
  #   toolchain-<ключ>     JDK, Android SDK и kotlin-language-server (job gradle-toolchain); ключ - хэш toolchain.env клиента,
  #                        пересобирается, только когда меняется файл; версии и раскладку задаёт .claude/hooks/toolchain.sh.
  # Старые архивы своего вида удаляются после загрузки нового. Проверки здесь лишь наполняют кэш: их падение архив не
  # останавливает (ворота - core, app и client-server). Секреты: SOURCE_TOKEN (чтение кода), EXILEFORGE_TOKEN (релиз ExileForge).
  gradle-cache:
    needs: [ changes, release ]
    # После релиза версии в этом прогоне и по ручному режиму cache (тогда release пропущен); работает только при смене ключа или в режиме cache,
    # иначе проверяет ключ и завершается
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.changes.outputs.cache == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: gradle-cache
      cancel-in-progress: false
    env:
      TAG: gradle-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      # После деплоя сервера с новыми файлами сборки: архив под голову рабочей ветки сервера, чтобы сессии не докачивали зависимости
      - name: Server head instead of the pin
        if: ${{ inputs.server_head == true }}
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          . ci/branches.env
          bash ci/quiet.sh server-head bash ci/retry.sh read git -C src/backend fetch -q "https://x-access-token:$TOKEN@github.com/$SERVER_REPO" "$SERVER_BRANCH"
          git -C src/backend checkout -q FETCH_HEAD
          echo "server for the archives: $(git -C src/backend rev-parse --short HEAD)"
      - name: Cache key
        id: key
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          CACHE_MODE: ${{ needs.changes.outputs.cache }}
        run: |
          key=$(for d in src src/backend; do git -C "$d" ls-files -z -- '*.gradle.kts' 'gradle.properties' 'gradle/*' | (cd "$d" && xargs -0 sha256sum); done | sha256sum | cut -c1-16)
          asset="gradle-cache-$key.tar.gz"
          have=$(bash ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -qx "$asset" <<<"$have"; then fresh=true; else fresh=false; fi
          # Кэш сборки обновляется только кнопкой (режим cache) на main; после обычного выпуска ключ тот же - ничего не пересобирается
          if [ "$CACHE_MODE" = true ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            build=true
          else
            build=false
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "build_asset=build-cache-$key.tar.gz" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "fill=$([ "$fresh" = false ] || [ "$build" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh build=$build"
      # Задача resolveAllDependencies корня не заходит во включённую сборку rules: её конфигурации (в их числе jvmTestRuntimeClasspath
      # с junit-jupiter-engine и junit-platform-launcher, без которых тесты правил офлайн не идут) разрешаются явно, по пути задачи.
      # Наполнение кэша - без запуска тестов: то, что делает сессия агента (ktlint, commentStyle, Lint, компиляция кода и тестов
      # одного варианта), плюс разрешение всех конфигураций (ci/resolve-all.gradle) - зависимости запуска тестов и прочих
      # вариантов попадают в архив без их сборки. Тесты и проверки идут в своих job'ах.
      - name: Fill the client cache
        if: steps.key.outputs.fill == 'true'
        working-directory: src
        run: |
          modules=(:app :platform :ui-kit :feature:hero :feature:craft :feature:city :feature:run :feature:server)
          lint=(); for m in "${modules[@]}"; do lint+=("$m:ktlintCheck"); done
          bash ../ci/quiet.sh gradle-cache-client bash gradlew --continue :core:ktlintCheck commentStyle :core:testClasses \
            "${lint[@]}" :app:lintDirectRelease :app:compileDirectReleaseKotlin || true
          bash ../ci/quiet.sh gradle-cache-client-deps bash gradlew --no-configuration-cache --init-script ../ci/resolve-all.gradle \
            --continue resolveAllDependencies :rules:resolveAllDependencies :rules:rules-check:resolveAllDependencies \
            :rules:rules-lab:resolveAllDependencies || true
      - name: Fill the server cache
        if: steps.key.outputs.fill == 'true'
        working-directory: src/backend
        run: |
          bash ../../ci/quiet.sh gradle-cache-server bash gradlew --continue :rules:rules-lab:labWasmBundle ktlintCheck commentStyle \
            testClasses :rules:ktlintCheck :rules:jvmTestClasses :rules:rules-check:ktlintCheck :rules:rules-check:jvmTestClasses :rules:rules-lab:ktlintCheck :rules:rules-lab:jvmTestClasses || true
          bash ../../ci/quiet.sh gradle-cache-server-deps bash gradlew --no-configuration-cache --init-script ../../ci/resolve-all.gradle \
            --continue resolveAllDependencies :rules:resolveAllDependencies :rules:rules-check:resolveAllDependencies \
            :rules:rules-lab:resolveAllDependencies || true
      - name: Stop Gradle
        if: steps.key.outputs.fill == 'true'
        run: (cd src && ./gradlew --stop >/dev/null 2>&1 || true)
      - name: Publish the dependency archive
        if: steps.key.outputs.fresh == 'false'
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.asset }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          tar -C "$HOME/.gradle" --exclude='*.lock' --exclude='gc.properties' -czf "$ASSET" caches/modules-2 wrapper/dists
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! bash ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            bash ci/retry.sh once gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci client.yml, job gradle-cache). Not a game release."
          fi
          bash ci/retry.sh idem gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          bash ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^gradle-cache-' | grep -vx "$ASSET" | while read -r old; do
            bash ci/retry.sh idem gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - name: Publish the build cache archive
        if: steps.key.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.build_asset }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          if [ ! -d "$HOME/.gradle/caches/build-cache-1" ]; then
            echo "no build cache produced, archive skipped"
            exit 0
          fi
          tar -C "$HOME/.gradle" --exclude='*.lock' --exclude='gc.properties' -czf "$ASSET" caches/build-cache-1
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! bash ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            bash ci/retry.sh once gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci client.yml, job gradle-cache). Not a game release."
          fi
          bash ci/retry.sh idem gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          bash ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^build-cache-' | grep -vx "$ASSET" | while read -r old; do
            bash ci/retry.sh idem gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      # Контрольные суммы архивов: хуки сессии сверяют их до распаковки (ci/cache-sums.sh, файл SHA256SUMS релиза)
      - name: Checksums of the archives
        if: steps.key.outputs.fill == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          shopt -s nullglob
          bash ci/cache-sums.sh "$CLIENT_REPO" "$TAG" gradle-cache-*.tar.gz build-cache-*.tar.gz
      - if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: gradle-cache-log

  # JDK, Android SDK и kotlin-language-server по toolchain.env клиента; ставит их тот же .claude/hooks/toolchain.sh, что и сессия
  # при отсутствии архива, поэтому раскладка и версии совпадают. После job'а gradle-cache: релиз к этому времени уже создан.
  gradle-toolchain:
    needs: [ changes, gradle-cache ]
    if: ${{ !cancelled() && needs.gradle-cache.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: gradle-cache
      cancel-in-progress: false
    env:
      TAG: gradle-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          submodules: 'false'
          persist-credentials: 'false'
          gradle: 'false'
      - name: Toolchain key
        id: key
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          asset="toolchain-$(bash .claude/hooks/toolchain.sh key).tar.gz"
          have=$(bash ../ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -qx "$asset" <<<"$have"; then fresh=true; else fresh=false; fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh"
      - name: Install the toolchain
        if: steps.key.outputs.fresh == 'false'
        working-directory: src
        run: bash ../ci/quiet.sh toolchain bash .claude/hooks/toolchain.sh install
      - name: Publish the toolchain archive
        if: steps.key.outputs.fresh == 'false'
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.asset }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          bash .claude/hooks/toolchain.sh pack "$PWD/$ASSET"
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! bash ../ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            bash ../ci/retry.sh once gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci client.yml, job gradle-cache). Not a game release."
          fi
          bash ../ci/retry.sh idem gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          bash ../ci/retry.sh read gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^toolchain-' | grep -vx "$ASSET" | while read -r old; do
            bash ../ci/retry.sh idem gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - name: Checksums of the archives
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          shopt -s nullglob
          bash ../ci/cache-sums.sh "$CLIENT_REPO" "$TAG" toolchain-*.tar.gz
      - if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: toolchain-log
