# CI и релизы приватного клиента Sperance/ExileForge на бесплатных минутах публичного репозитория.
# Код клиента здесь не хранится: job'ы скачивают нужный коммит токеном SOURCE_TOKEN (.github/actions/source). Журналы и
# артефакты публичны: сборки и тесты идут через ci/quiet.sh (в журнал - только итог шага), артефакты зашифрованы ci/seal.sh
# (ключ LOG_KEY) - APK UI-тестов не ужат, отчёты и снимки экранов раскрывают код.
#
# Запуск:
#   repository_dispatch client-push - пуш в рабочую ветку клиента (job `forward` в android.yml ExileForge): sha и before;
#   workflow_dispatch               - вручную: push - как пуш (все проверки, релиз новой версии); shots - UI-тесты на эмуляторе
#                                     и снимки ключевых экранов (KeyScreensShotTest), без релиза; stores - заново выложить выпущенную версию
#                                     в магазины; cache - только архивы для облачных сессий агента (job `gradle-cache`).
# Релиз: versionName без релиза в exile-ci после зелёных проверок - тег v<versionName> здесь с APK, update.json и заметками
# RELEASE_NOTES.md (их читает игра, Updates.kt); карта R8 mapping.txt - только в релиз того же тега приватного ExileForge
# (её качает сервер, ReleaseMappings). Затем Issues, что называют коммиты релиза «Closes #N», закрываются, и запускается
# деплой сервера (server.yml, режим deploy).
# Каналы: прямой APK (релиз здесь), Google Play (AAB на дорожку переменной PLAY_TRACK: alpha - закрытый тест, beta - ранний доступ,
# production - долей 20%; job `publish-play`) и RuStore (APK с автопубликацией, job
# `publish-rustore`); задачи сборки и пути результатов - ci/build-tasks.env. Загрузка в магазин идёт после релиза, дождавшись сервера на
# ревизии релиза, и только если в репозитории есть ключи магазина, иначе job зелёный без дела. Состояние каналов опрашивает maintenance.yml (задача store-status); прямой канал
# отчётом серверу объявляет сам `release` (переменная SERVER_URL, секрет RELEASE_STATUS_TOKEN).
# Секреты: SOURCE_TOKEN, EXILEFORGE_TOKEN (Contents и Issues: write на ExileForge), LOG_KEY, RELEASE_KEYSTORE,
# RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD; магазины: PLAY_SERVICE_ACCOUNT_JSON, RUSTORE_KEY_ID,
# RUSTORE_PRIVATE_KEY; RELEASE_STATUS_TOKEN. Переменные: RUSTORE_CONTACT_EMAIL, RUSTORE_CONTACT_WEBSITE, RUSTORE_CONTACT_VK -
# контакты разработчика карточки RuStore (без email магазин может отказать в черновике).
# Ручной режим stores - заново собрать и выложить в Google Play и RuStore уже выпущенную версию (без проверок и релиза здесь).
# Архивы для облачных сессий агента (job'ы `gradle-cache` и `gradle-toolchain`, в конце файла) пересобираются после каждого
# релиза версии в этом прогоне и вручную (режим cache).
name: Client

on:
  repository_dispatch:
    types: [ client-push ]
  workflow_dispatch:
    inputs:
      mode:
        description: 'push - checks and release of a new version; shots - emulator UI tests and key screen shots, no release; stores - publish the already released version to Google Play and RuStore again; cache - only rebuild the agent session archives (gradle-cache release of ExileForge)'
        type: choice
        options: [ push, shots, stores, cache ]
        default: push
      sha:
        description: 'Client commit (empty - head of the working branch)'
        required: false

# Чужой код здесь не исполняется: триггеров pull_request нет, токен job'ов по умолчанию только читает.
permissions:
  contents: read

env:
  CLIENT_REPO: Sperance/ExileForge
  # Ключ шифрования журналов ci/quiet.sh: общий для всех job'ов
  LOG_KEY: ${{ secrets.LOG_KEY }}

# Каждый job проверок в своей группе: новый пуш отменяет устаревший прогон, а начатую публикацию (job `release`) - нет.
jobs:
  # Что затронуто и будет ли релиз: от этого зависят тяжёлые job ниже.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: client-changes
      cancel-in-progress: true
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      core: ${{ steps.diff.outputs.core }}
      app: ${{ steps.diff.outputs.app }}
      release: ${{ steps.release.outputs.pending }}
      shots: ${{ steps.target.outputs.mode == 'shots' }}
      stores: ${{ steps.release.outputs.stores }}
      cache: ${{ steps.target.outputs.mode == 'cache' }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Target commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SHA: ${{ inputs.sha }}
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: . ci/branches.env && bash ci/resolve.sh "$CLIENT_REPO" "$CLIENT_BRANCH" client push shots stores cache
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          persist-credentials: false
          fetch-depth: 0
      # Затронутое - по разнице с прошлой головой ветки (before пуша). Ручной запуск, первый пуш или неизвестный before - всё.
      # core и закреплённый сервер: от них зависят тесты core и клиент-серверный контракт; app (TEST-01) - тесты core:
      # UiStringsTest читает ключи `ui("…")` из исходников app
      - name: Changed parts
        id: diff
        working-directory: src
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.client_payload.before }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          if [ "$EVENT" != repository_dispatch ] || [[ ! $BEFORE =~ ^[0-9a-f]{40}$ || $BEFORE =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            core=true; app=true
          else
            files=$(git diff --name-only "$BEFORE" "$SHA")
            grep -qE '^app/' <<<"$files" && app=true || app=false
            grep -qE '^(core/|backend$|scripts/client_server_test\.py$|gradle/|[^/]+\.gradle\.kts$|gradle\.properties$)' <<<"$files" && core=true || core=false
          fi
          echo "core=$core app=$app"
          { echo "core=$core"; echo "app=$app"; } >> "$GITHUB_OUTPUT"
      # Релиз будет, если это пуш и у versionName ещё нет релиза здесь: только тогда собираются R8-сборки и идёт эмулятор.
      - id: release
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$MODE" = push ] && ! gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then pending=true; else pending=false; fi
          # Режим stores: версия уже выпущена здесь - заново собираются и выкладываются только сборки магазинов
          stores=false
          if [ "$MODE" = stores ]; then
            gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || { echo "::error::v$version is not released yet: stores mode publishes only a released version"; exit 1; }
            stores=true
          fi
          { echo "pending=$pending"; echo "stores=$stores"; echo "tag=v$version"; } >> "$GITHUB_OUTPUT"
          echo "v$version: release pending=$pending, stores=$stores"

  core:
    needs: changes
    # Перед релизом - всегда (TEST-01): релиз не выходит без словарей и тестов core
    if: ${{ needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.app == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: client-core
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      # Задачи job - в scripts/check.sh клиента: та же проверка перед пушем
      - working-directory: src
        run: bash ../ci/quiet.sh core bash scripts/check.sh core
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: core-log

  app:
    needs: changes
    # При правке app, перед релизом и по ручному запуску; правка только core или сервера сторожей app не трогает
    if: ${{ needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: client-app
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      # Отладочной сборки нет нигде: lint - по релизному варианту, APK - только R8-сборки ниже
      - working-directory: src
        run: bash ../ci/quiet.sh app bash scripts/check.sh app --no-compile
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: app-log

  # Сжатые R8 сборки с инструментальным APK (единственные тестовые, отладочной нет): `minified` - с флагом `-PuiTests` для всех
  # UI-тестов (код приложения не ужат - артефакт только зашифрованным), `minified-strict` - без флага, строгий смоук R8: код
  # приложения ужат. Имя job'а, артефакта, журнала и группы concurrency берутся из matrix.name.
  minified:
    name: ${{ matrix.name }}
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' || needs.changes.outputs.shots == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: client-${{ matrix.name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minified
            artifact: ui-apks
            flags: -PuiTests
            stage: true
          - name: minified-strict
            artifact: ui-apks-minified
            flags: ''
            stage: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build UI test APKs
        working-directory: src
        env:
          NAME: ${{ matrix.name }}
          FLAGS: ${{ matrix.flags }}
        run: |
          . ../ci/build-tasks.env
          bash ../ci/quiet.sh "$NAME" bash gradlew "$MINIFIED_APP_TASK" "$MINIFIED_TEST_TASK" $FLAGS
      - name: Stage UI test APKs
        if: ${{ matrix.stage }}
        working-directory: src
        run: |
          . ../ci/build-tasks.env
          mkdir -p ui-apks
          cp "$MINIFIED_APK" ui-apks/app.apk
          cp "$MINIFIED_TEST_APK" ui-apks/app-androidTest.apk
      - name: Seal APKs
        working-directory: src
        env:
          SEALED: ../sealed/${{ matrix.artifact }}.enc
          STAGE: ${{ matrix.stage }}
        run: |
          . ../ci/build-tasks.env
          if [ "$STAGE" = true ]; then paths=ui-apks; else paths="$MINIFIED_APK_DIR $MINIFIED_TEST_APK_DIR"; fi
          bash ../ci/seal.sh "$SEALED" $paths
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: sealed/${{ matrix.artifact }}.enc
          if-no-files-found: error
          retention-days: 1
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: ${{ matrix.name }}-log

  # Подписанный релиз собирается один раз, здесь, и уходит в job `release` зашифрованным артефактом: там больше не пересобирают.
  release-apk:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: client-release-apk
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build signed release APK
        working-directory: src
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        # Опубликованный APK всегда подписан ключом релиза, поэтому каждый ставится поверх прошлого: нет ключа - нет релиза.
        run: |
          . ../ci/build-tasks.env
          bash ../ci/keystore.sh
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          bash ../ci/quiet.sh release-apk bash gradlew "$DIRECT_APK_TASK"
          apk=$DIRECT_APK
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$signer" verify --print-certs "$apk" > "$RUNNER_TEMP/signer.txt"
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          rm -f "$RUNNER_TEMP/release.jks"
          grep -qi "SHA-256 digest: $expected" "$RUNNER_TEMP/signer.txt" || { echo "::error::APK is not signed with the release key"; exit 1; }
          echo "APK signed with the release key"
          bash ../ci/seal.sh ../sealed/release.enc "$DIRECT_APK" "$DIRECT_MAPPING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exile-forge-release
          path: sealed/release.enc
          if-no-files-found: error
          retention-days: 7
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-apk-log

  # Пакет для Google Play (канал `play`: без самообновления и REQUEST_INSTALL_PACKAGES): тем же ключом релиза, но не в публичный релиз, а
  # зашифрованным артефактом; в Play его кладёт job `publish-play` (или вручную: `ci/seal.sh -d`, Play Console).
  release-aab:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' || needs.changes.outputs.stores == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: client-release-aab
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build signed Play bundle
        working-directory: src
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          . ../ci/build-tasks.env
          bash ../ci/keystore.sh
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          bash ../ci/quiet.sh release-aab bash gradlew "$PLAY_AAB_TASK"
          rm -f "$RUNNER_TEMP/release.jks"
          bash ../ci/seal.sh ../sealed/play.enc "$PLAY_AAB" "$PLAY_MAPPING"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exile-forge-play
          path: sealed/play.enc
          if-no-files-found: error
          retention-days: 30
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-aab-log

  # APK для RuStore (канал `rustore`: свой магазин обновлений вместо самообновления) тем же ключом релиза: зашифрованным артефактом, в
  # магазин его кладёт job `publish-rustore`.
  release-rustore:
    needs: changes
    if: ${{ needs.changes.outputs.release == 'true' || needs.changes.outputs.stores == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: client-release-rustore
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Build signed RuStore APK
        working-directory: src
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          . ../ci/build-tasks.env
          bash ../ci/keystore.sh
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          bash ../ci/quiet.sh release-rustore bash gradlew "$RUSTORE_APK_TASK"
          signer=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$signer" verify --print-certs "$RUSTORE_APK" > "$RUNNER_TEMP/signer.txt"
          expected=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" | sed -n 's/.*SHA256: *//p' | tr -d ':' | tr 'A-F' 'a-f')
          rm -f "$RUNNER_TEMP/release.jks"
          grep -qi "SHA-256 digest: $expected" "$RUNNER_TEMP/signer.txt" || { echo "::error::APK is not signed with the release key"; exit 1; }
          echo "RuStore APK signed with the release key"
          bash ../ci/seal.sh ../sealed/rustore.enc "$RUSTORE_APK"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exile-forge-rustore
          path: sealed/rustore.enc
          if-no-files-found: error
          retention-days: 30
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-rustore-log

  # UI-тесты и смоук R8 - только перед релизом и по shots: собранные APK приходят артефактами, Gradle здесь не нужен.
  emulator:
    needs: [ changes, minified ]
    if: ${{ needs.changes.outputs.release == 'true' || needs.changes.outputs.shots == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: client-emulator
      cancel-in-progress: true
    env:
      API_LEVEL: 35
      SHOTS: ${{ needs.changes.outputs.shots }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-apks
          path: sealed
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ui-apks-minified
          path: sealed
      - name: Unpack APKs
        run: |
          bash ci/seal.sh -d sealed/ui-apks.enc .
          bash ci/seal.sh -d sealed/ui-apks-minified.enc .
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      # Эмулятор ставится заранее и с повторами: обрыв скачивания («Error on ZipFile unknown archive») ронял job, а уже
      # поставленный пакет раннер эмулятора не качает заново
      - name: Install the emulator
        id: emulator
        run: |
          home="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          for attempt in 1 2 3; do
            "$home/cmdline-tools/latest/bin/sdkmanager" --install emulator --channel=0 > /dev/null && [ -x "$home/emulator/emulator" ] && break
            [ "$attempt" = 3 ] && exit 1
            sleep $((attempt * 15))
          done
          echo "version=$(sed -n 's/^Pkg.Revision=//p' "$home/emulator/source.properties")" >> "$GITHUB_OUTPUT"
      # Снимок загруженного эмулятора в кэше: прогон стартует из него, а не с холодной загрузки; новый эмулятор - новый снимок
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-x86_64-pixel_2-emu${{ steps.emulator.outputs.version }}
      - name: Create AVD snapshot
        if: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"
      - name: Run UI checks on Android
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: x86_64
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/quiet.sh ui bash ci/ui-tests.sh
      # Отчёты UI-тестов, превью и снимки ключевых экранов (design-preview/shots при shots) - одним зашифрованным артефактом
      - name: Seal UI reports and preview
        if: always()
        run: bash ci/seal.sh sealed/ui.enc ui-results.txt release-smoke.txt design-preview
      - name: Upload UI reports and preview
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: exile-forge-ui
          path: |
            sealed/ui.enc
            logs
          if-no-files-found: ignore

  client-server:
    needs: changes
    # Контракт зависит от core и закреплённого сервера; перед релизом - всегда
    if: ${{ needs.changes.outputs.stores != 'true' && needs.changes.outputs.cache != 'true' && (needs.changes.outputs.core == 'true' || needs.changes.outputs.release == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: client-client-server
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Сервер под проверкой - закреплённый сабмодуль backend/: его HEAD - сгенерированный SERVER_COMMIT
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          java: '21'
      - working-directory: src/backend
        run: bash ../../ci/quiet.sh server-dist bash gradlew installDist
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/mongo
      - name: Verify actual client and server contract
        working-directory: src
        run: bash ../ci/quiet.sh client-server python3 scripts/client_server_test.py
      - name: Seal reports
        if: always()
        working-directory: src
        run: bash ../ci/seal.sh ../sealed/client-server.enc core/build/reports/tests core/build/test-results build/client-server.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: client-server-reports
          path: |
            sealed/client-server.enc
            logs
          if-no-files-found: ignore

  # После зелёных проверок versionName без релиза публикуется: тег v<versionName> здесь с APK из `release-apk`, update.json и
  # заметками RELEASE_NOTES.md; mapping.txt - в релиз того же тега приватного ExileForge, на коммите клиента.
  # Пропущенные по фильтру проверки (core без изменений) релиз не держат; упавшие или отменённые - держат.
  release:
    # Пакеты магазинов собираются до публикации: сломанный вариант сборки не даёт выпустить версию в одном канале и не выпустить в другом
    needs: [ changes, core, app, minified, release-apk, release-aab, release-rustore, emulator, client-server ]
    if: ${{ !cancelled() && needs.changes.outputs.release == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    permissions:
      contents: write
      # Запуск деплоя сервера (server.yml) после релиза
      actions: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      SHA: ${{ needs.changes.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Публикации нужны заметки, версии и ревизии из исходников, а закрытию Issues - история с тегами
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.CLIENT_REPO }}
          ref: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: src
          submodules: true
          fetch-depth: 0
          fetch-tags: true
      - id: version
        working-directory: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.version.outputs.exists == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-release
          path: sealed
      - if: steps.version.outputs.exists == 'false'
        name: Release files
        id: files
        working-directory: src
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          . ../ci/build-tasks.env
          export DIRECT_APK DIRECT_MAPPING
          bash ../ci/seal.sh -d ../sealed/release.enc .
          python3 ../ci/release-files.py "$TAG" ..
          cat ../update.json
          echo "apk=ExileForge-$TAG.apk" >> "$GITHUB_OUTPUT"
      # Карта R8 - сначала и только в приватный ExileForge: тег на коммите клиента нужен и для диапазона «Closes #N» ниже.
      - if: steps.version.outputs.exists == 'false'
        name: Private release with the R8 mapping
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" mapping.txt -R "$CLIENT_REPO" --clobber
          else
            gh release create "$TAG" mapping.txt -R "$CLIENT_REPO" --target "$SHA" --title "ExileForge ${TAG#v}" --notes "R8 mapping of ${TAG#v}"
          fi
      - if: steps.version.outputs.exists == 'false'
        name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.files.outputs.apk }}
        run: gh release create "$TAG" "$APK" update.json -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ExileForge ${TAG#v}" --notes-file RELEASE_NOTES.md --latest
      # Issues, что чинит релиз: коммиты с прошлого релиза, что называют «Closes #N» (fixes, resolves), - Issue получает метку
      # версии и закрывается выполненным, без комментария; игра увидит это синхронизацией сервера.
      # Рабочая ветка - не основная, сам GitHub по таким словам Issues не закрывает.
      - if: steps.version.outputs.exists == 'false'
        name: Close the issues this release fixes
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: bash ../ci/close-issues.sh "$CLIENT_REPO" "$TAG" "$SHA"
      # Сервер с новым API ждёт этот релиз: опубликовали - запускаем его деплой, он выкатит проверенный образ головы
      # рабочей ветки сервера.
      - if: steps.version.outputs.exists == 'false'
        name: Trigger the server deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run server.yml -R "$GITHUB_REPOSITORY" --ref main -f mode=deploy
      # Прямой канал сервер узнаёт отчётом: релиз GitHub вышел, доля 1.0. Новый деплой сервера (шаг выше) ещё идёт, поэтому отчёт
      # может не дойти (маршрута нет у прежнего сервера) - это предупреждение, отчёт повторит почасовая задача store-status в maintenance.yml.
      - if: steps.version.outputs.exists == 'false'
        name: Report the direct channel to the server
        continue-on-error: true
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_TOKEN }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
        run: |
          code=0
          bash ci/quiet.sh report-direct python3 ci/store-status.py direct update.json || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: release-log

  # Загрузка в магазины - после публикации релиза и только с ключами магазина; без них job зелёный и ничего не делает. Перед загрузкой
  # job ждёт сервер: манифест SERVER_URL/static/index.json должен объявить ревизию не ниже apiRevision релиза (ci/wait-server.py, до 30
  # минут, иначе красный): сборка из магазина не должна опередить сервер, на котором она говорит. Повторить неудачную загрузку можно
  # перезапуском упавшего job'а: пакеты лежат в артефактах прогона, повторная загрузка той же версии безопасна. Заметки магазинов и
  # обязательность (приоритет обновления 5) - из update.json релиза (RELEASE_NOTES.md без заголовка).
  publish-play:
    needs: [ changes, release, release-aab ]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.changes.outputs.stores == 'true') && needs.release-aab.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    concurrency:
      group: publish-play
      cancel-in-progress: false
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_TRACK: ${{ vars.PLAY_TRACK }}
      TAG: ${{ needs.release.outputs.tag || needs.changes.outputs.tag }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - id: gate
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set: Google Play upload skipped"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.enabled == 'true'
        name: Wait for the server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p update.json
          python3 ci/wait-server.py update.json
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-play
          path: sealed
      - if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/store-tools
      - if: steps.gate.outputs.enabled == 'true'
        name: Upload to Google Play
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
        run: |
          set -a; . ci/build-tasks.env; set +a
          bash ci/seal.sh -d sealed/play.enc .
          code=0
          bash ci/quiet.sh publish-play python3 ci/play.py upload "$PLAY_AAB" update.json || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: publish-play-log

  publish-rustore:
    needs: [ changes, release, release-rustore ]
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.changes.outputs.stores == 'true') && needs.release-rustore.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    concurrency:
      group: publish-rustore
      cancel-in-progress: false
    env:
      RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
      RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
      TAG: ${{ needs.release.outputs.tag || needs.changes.outputs.tag }}
      RUSTORE_CONTACT_EMAIL: ${{ vars.RUSTORE_CONTACT_EMAIL }}
      RUSTORE_CONTACT_WEBSITE: ${{ vars.RUSTORE_CONTACT_WEBSITE }}
      RUSTORE_CONTACT_VK: ${{ vars.RUSTORE_CONTACT_VK }}
      SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - id: gate
        run: |
          if [ -n "$RUSTORE_KEY_ID" ] && [ -n "$RUSTORE_PRIVATE_KEY" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::RUSTORE_KEY_ID or RUSTORE_PRIVATE_KEY is not set: RuStore upload skipped"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: steps.gate.outputs.enabled == 'true'
        name: Wait for the server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p update.json
          python3 ci/wait-server.py update.json
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: exile-forge-rustore
          path: sealed
      - if: steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/store-tools
      - if: steps.gate.outputs.enabled == 'true'
        id: upload
        name: Upload to RuStore
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
        run: |
          set -a; . ci/build-tasks.env; set +a
          bash ci/seal.sh -d sealed/rustore.enc .
          code=0
          export RUSTORE_STATE="$RUNNER_TEMP/rustore-state.json"
          bash ci/quiet.sh publish-rustore python3 ci/rustore.py upload "$RUSTORE_APK" update.json || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          # Файл состояния RuStore есть - магазин требует ручной загрузки или ждёт модерации прошлой версии: APK - в релиз, владельцу - Issue
          if [ "$code" = 0 ] && [ -s "$RUSTORE_STATE" ]; then
            echo "manual=true" >> "$GITHUB_OUTPUT"
            echo "apk=$RUSTORE_APK" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $code
      - if: steps.upload.outputs.manual == 'true'
        name: Hand the APK over for a manual RuStore upload
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          APK: ${{ steps.upload.outputs.apk }}
        run: |
          version=$(python3 -c 'import json;print(json.load(open("update.json"))["versionName"])')
          asset="ExileForge-$version-rustore.apk"
          cp "$APK" "$RUNNER_TEMP/$asset"
          gh release upload "$TAG" "$RUNNER_TEMP/$asset" -R "$GITHUB_REPOSITORY" --clobber
          # Один Issue на версию: шаги, строка «ждёт модерации прошлой / нужна ручная загрузка»; повтор - store-status (maintenance.yml)
          EXILEFORGE_TOKEN="$ISSUE_TOKEN" bash ci/quiet.sh rustore-manual python3 ci/rustore_manual.py note "$version" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$asset" "$RUNNER_TEMP/rustore-state.json"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: publish-rustore-log

  # Архивы для облачных сессий агента - prerelease `gradle-cache` приватного ExileForge (не latest: игра, update.json и релизы
  # версий его не видят); сессия распаковывает их хуками .claude/hooks/gradle-cache.sh и toolchain.sh клиента:
  #   gradle-cache-<ключ>  зависимости (caches/modules-2) и дистрибутивы (wrapper/dists) клиента и закреплённого в нём сервера;
  #                        пересобирается, только когда меняется ключ - хэш файлов сборки клиента и сервера (имя файла архива);
  #   build-cache-<ключ>   кэш сборки Gradle (caches/build-cache-1): результаты задач, чтобы неизменные модули не компилировались
  #                        заново; обновляется после каждого релиза версии и в ручном режиме cache, только из запусков на main;
  #   toolchain-<ключ>     JDK, Android SDK и kotlin-language-server (job gradle-toolchain); ключ - хэш toolchain.env клиента,
  #                        пересобирается, только когда меняется файл; версии и раскладку задаёт .claude/hooks/toolchain.sh.
  # Старые архивы своего вида удаляются после загрузки нового. Проверки здесь лишь наполняют кэш: их падение архив не
  # останавливает (ворота - core, app и client-server). Секреты: SOURCE_TOKEN (чтение кода), EXILEFORGE_TOKEN (релиз ExileForge).
  gradle-cache:
    needs: [ changes, release ]
    # Только после релиза версии в этом прогоне и по ручному режиму cache (тогда release пропущен)
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.changes.outputs.cache == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: gradle-cache
      cancel-in-progress: false
    env:
      TAG: gradle-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Cache key
        id: key
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          key=$(for d in src src/backend; do git -C "$d" ls-files -z -- '*.gradle.kts' 'gradle.properties' 'gradle/*' | (cd "$d" && xargs -0 sha256sum); done | sha256sum | cut -c1-16)
          asset="gradle-cache-$key.tar.gz"
          have=$(gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -qx "$asset" <<<"$have"; then fresh=true; else fresh=false; fi
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            build=true
          else
            build=false
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "build_asset=build-cache-$key.tar.gz" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "fill=$([ "$fresh" = false ] || [ "$build" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh build=$build"
      - name: Fill the client cache
        if: steps.key.outputs.fill == 'true'
        working-directory: src
        run: bash ../ci/quiet.sh gradle-cache-client bash scripts/check.sh all --all-variants || true
      - name: Fill the server cache
        if: steps.key.outputs.fill == 'true'
        working-directory: src/backend
        run: bash ../../ci/quiet.sh gradle-cache-server bash scripts/check.sh all || true
      - name: Stop Gradle
        if: steps.key.outputs.fill == 'true'
        run: (cd src && ./gradlew --stop >/dev/null 2>&1 || true)
      - name: Publish the dependency archive
        if: steps.key.outputs.fresh == 'false'
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.asset }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          tar -C "$HOME/.gradle" --exclude='*.lock' --exclude='gc.properties' -czf "$ASSET" caches/modules-2 wrapper/dists
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci client.yml, job gradle-cache). Not a game release."
          fi
          gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^gradle-cache-' | grep -vx "$ASSET" | while read -r old; do
            gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - name: Publish the build cache archive
        if: steps.key.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.build_asset }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          if [ ! -d "$HOME/.gradle/caches/build-cache-1" ]; then
            echo "no build cache produced, archive skipped"
            exit 0
          fi
          tar -C "$HOME/.gradle" --exclude='*.lock' --exclude='gc.properties' -czf "$ASSET" caches/build-cache-1
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci client.yml, job gradle-cache). Not a game release."
          fi
          gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^build-cache-' | grep -vx "$ASSET" | while read -r old; do
            gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: gradle-cache-log

  # JDK, Android SDK и kotlin-language-server по toolchain.env клиента; ставит их тот же .claude/hooks/toolchain.sh, что и сессия
  # при отсутствии архива, поэтому раскладка и версии совпадают. После job'а gradle-cache: релиз к этому времени уже создан.
  gradle-toolchain:
    needs: [ changes, gradle-cache ]
    if: ${{ !cancelled() && needs.gradle-cache.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gradle-cache
      cancel-in-progress: false
    env:
      TAG: gradle-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/source
        with:
          sha: ${{ needs.changes.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          submodules: 'false'
          persist-credentials: 'false'
      - name: Toolchain key
        id: key
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          asset="toolchain-$(bash .claude/hooks/toolchain.sh key).tar.gz"
          have=$(gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -qx "$asset" <<<"$have"; then fresh=true; else fresh=false; fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh"
      - name: Install the toolchain
        if: steps.key.outputs.fresh == 'false'
        working-directory: src
        run: bash ../ci/quiet.sh toolchain bash .claude/hooks/toolchain.sh install
      - name: Publish the toolchain archive
        if: steps.key.outputs.fresh == 'false'
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.asset }}
          SHA: ${{ needs.changes.outputs.sha }}
        run: |
          bash .claude/hooks/toolchain.sh pack "$PWD/$ASSET"
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci client.yml, job gradle-cache). Not a game release."
          fi
          gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^toolchain-' | grep -vx "$ASSET" | while read -r old; do
            gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: toolchain-log
