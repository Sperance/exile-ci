# Чистка платного хранилища GitHub (бесплатно 0,5 ГБ на аккаунт, считаются только приватные репозитории): раз в сутки и вручную.
# Артефакты Actions в ExileForge и ktor-bestgame удаляются все - их оставили прогоны до переезда CI сюда, новые их не создают.
# Образы сервера ghcr.io/sperance/ktor-bestgame: живут тег ветки и 5 последних проверенных, черновые и безымянные старше суток
# удаляются; откат на VPS идёт на локальную копию прежнего образа (deploy/update.sh сервера). Правила - ci/cleanup.py.
# Журнал публичен: только счётчики и коды ответов, подробности падения - в зашифрованном артефакте (ключ LOG_KEY).
# Секреты: CLEANUP_TOKEN (fine-grained, ExileForge и ktor-bestgame, Actions: Read and write; нет - артефакты пропускаются с
# предупреждением), LOG_KEY. Образы удаляет GITHUB_TOKEN: пакету выдана роль Admin этого репозитория
# (Package settings - Manage Actions access).
name: Cleanup

on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  LOG_KEY: ${{ secrets.LOG_KEY }}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cleanup
      cancel-in-progress: false
    env:
      PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Шаги независимы: отказ одного не мешает другому, прогон красный, если упал любой
      - name: Artifacts of the private repositories
        id: artifacts
        continue-on-error: true
        env:
          CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
        run: |
          code=0
          bash ci/quiet.sh cleanup-artifacts python3 ci/cleanup.py artifacts || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true; rm -f "$PUBLIC_NOTES"
          exit $code
      - name: Old server images
        id: images
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          code=0
          bash ci/quiet.sh cleanup-images python3 ci/cleanup.py images || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Encrypted log
        if: steps.artifacts.outcome == 'failure' || steps.images.outcome == 'failure'
        uses: ./.github/actions/upload-log
        with:
          name: cleanup-log
      - name: Result
        if: steps.artifacts.outcome == 'failure' || steps.images.outcome == 'failure'
        run: exit 1
