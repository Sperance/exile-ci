# Архивы для облачных сессий агента - prerelease `gradle-cache` приватного ExileForge (не latest: игра, update.json и релизы
# версий его не видят); сессия распаковывает их хуками .claude/hooks/gradle-cache.sh и toolchain.sh клиента:
#   gradle-cache-<ключ>  зависимости (caches/modules-2) и дистрибутивы (wrapper/dists) клиента и закреплённого в нём сервера;
#                        пересобирается, только когда меняется ключ - хэш файлов сборки клиента и сервера (имя файла архива);
#   build-cache-<ключ>   кэш сборки Gradle (caches/build-cache-1): результаты задач, чтобы неизменные модули не компилировались
#                        заново; обновляется после каждого успешного Client и ручного запуска (задачи берутся из кэша
#                        setup-gradle, поэтому быстро), только из запусков на main;
#   toolchain-<ключ>     JDK, Android SDK и kotlin-language-server (job toolchain); ключ - хэш toolchain.env клиента,
#                        пересобирается, только когда меняется файл; версии и раскладку задаёт .claude/hooks/toolchain.sh.
# Старые архивы своего вида удаляются после загрузки нового. Проверки здесь лишь наполняют кэш: их падение архив не
# останавливает (ворота - client.yml и server.yml).
# Запуск: после каждого Client (workflow_run) и вручную. Секреты: SOURCE_TOKEN (чтение кода), EXILEFORGE_TOKEN (релиз ExileForge).
name: Gradle cache

on:
  workflow_run:
    workflows: [ Client ]
    types: [ completed ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-cache
  cancel-in-progress: false

env:
  CLIENT_REPO: Sperance/ExileForge
  TAG: gradle-cache
  LOG_KEY: ${{ secrets.LOG_KEY }}

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Target commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: pack
          INPUT_SHA: ''
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: . ci/branches.env && bash ci/resolve.sh "$CLIENT_REPO" "$CLIENT_BRANCH" client pack
      - uses: ./.github/actions/source
        with:
          sha: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
      - name: Cache key
        id: key
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          key=$(for d in src src/backend; do git -C "$d" ls-files -z -- '*.gradle.kts' 'gradle.properties' 'gradle/*' | (cd "$d" && xargs -0 sha256sum); done | sha256sum | cut -c1-16)
          asset="gradle-cache-$key.tar.gz"
          have=$(gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -qx "$asset" <<<"$have"; then fresh=true; else fresh=false; fi
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$CONCLUSION" = success ]; }; then
            build=true
          else
            build=false
          fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "build_asset=build-cache-$key.tar.gz" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "fill=$([ "$fresh" = false ] || [ "$build" = true ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh build=$build"
      - name: Fill the client cache
        if: steps.key.outputs.fill == 'true'
        working-directory: src
        run: bash ../ci/quiet.sh gradle-cache-client bash scripts/check.sh all --all-variants || true
      - name: Fill the server cache
        if: steps.key.outputs.fill == 'true'
        working-directory: src/backend
        run: bash ../../ci/quiet.sh gradle-cache-server bash scripts/check.sh all || true
      - name: Stop Gradle
        if: steps.key.outputs.fill == 'true'
        run: (cd src && ./gradlew --stop >/dev/null 2>&1 || true)
      - name: Publish the dependency archive
        if: steps.key.outputs.fresh == 'false'
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.asset }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          tar -C "$HOME/.gradle" --exclude='*.lock' --exclude='gc.properties' -czf "$ASSET" caches/modules-2 wrapper/dists
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci gradle-cache.yml). Not a game release."
          fi
          gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^gradle-cache-' | grep -vx "$ASSET" | while read -r old; do
            gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - name: Publish the build cache archive
        if: steps.key.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.build_asset }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          if [ ! -d "$HOME/.gradle/caches/build-cache-1" ]; then
            echo "no build cache produced, archive skipped"
            exit 0
          fi
          tar -C "$HOME/.gradle" --exclude='*.lock' --exclude='gc.properties' -czf "$ASSET" caches/build-cache-1
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci gradle-cache.yml). Not a game release."
          fi
          gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^build-cache-' | grep -vx "$ASSET" | while read -r old; do
            gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: gradle-cache-log

  # JDK, Android SDK и kotlin-language-server по toolchain.env клиента; ставит их тот же .claude/hooks/toolchain.sh, что и сессия
  # при отсутствии архива, поэтому раскладка и версии совпадают. После pack: релиз к этому времени уже создан.
  toolchain:
    needs: pack
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Target commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: pack
          INPUT_SHA: ''
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: . ci/branches.env && bash ci/resolve.sh "$CLIENT_REPO" "$CLIENT_BRANCH" client pack
      - uses: ./.github/actions/source
        with:
          sha: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          submodules: 'false'
          persist-credentials: 'false'
      - name: Toolchain key
        id: key
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          asset="toolchain-$(bash .claude/hooks/toolchain.sh key).tar.gz"
          have=$(gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' 2>/dev/null || true)
          if grep -qx "$asset" <<<"$have"; then fresh=true; else fresh=false; fi
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh" >> "$GITHUB_OUTPUT"
          echo "fresh=$fresh"
      - name: Install the toolchain
        if: steps.key.outputs.fresh == 'false'
        working-directory: src
        run: bash ../ci/quiet.sh toolchain bash .claude/hooks/toolchain.sh install
      - name: Publish the toolchain archive
        if: steps.key.outputs.fresh == 'false'
        working-directory: src
        env:
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          ASSET: ${{ steps.key.outputs.asset }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          bash .claude/hooks/toolchain.sh pack "$PWD/$ASSET"
          echo "archive: $(du -h "$ASSET" | cut -f1)"
          if ! gh release view "$TAG" -R "$CLIENT_REPO" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$CLIENT_REPO" --target "$SHA" --prerelease --latest=false --title "Gradle cache" \
              --notes "Gradle dependencies for cloud agent sessions (exile-ci gradle-cache.yml). Not a game release."
          fi
          gh release upload "$TAG" "$ASSET" -R "$CLIENT_REPO" --clobber
          gh release view "$TAG" -R "$CLIENT_REPO" --json assets -q '.assets[].name' | grep '^toolchain-' | grep -vx "$ASSET" | while read -r old; do
            gh release delete-asset "$TAG" "$old" -R "$CLIENT_REPO" -y
          done
      - if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: toolchain-log
