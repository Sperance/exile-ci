# Проверка черновиков wip перед финальным пушем в рабочие ветки: сервер (ktor-bestgame) и клиент (ExileForge) по их ТЕКУЩИМ wip вместе.
# Запуск: вручную (Actions -> Check wip -> Run workflow, или `gh workflow run check-wip.yml --ref main`), агентом или кнопкой.
#   1. resolve: головы wip обоих репозиториев; сервер, закреплённый в клиенте (backend/), обязан быть головой wip сервера - иначе красное
#      с понятным сообщением (клиент пока закрепляет не тот сервер, что проверяется);
#   2. server.yml и client.yml как вызываемые workflow в режиме check-wip: те же ворота, что у пуша кода, но все, а не по разнице
#      (клиент: core, app, R8-сборки и эмулятор, контракт с сервером; сервер: проверки, панель в браузере, совместимость со старейшим
#      клиентом). Образ в ghcr не собирается и не метится, выпуска и деплоя нет;
#   3. guards (идёт ПЕРВЫМ после resolve: server и client ждут его, красное из дешёвых сторожей приходит за минуту, а не после полной загрузки раннеров;
#      зелёный путь дольше на ~15 с): версия правил за выпуск (ci/rules-step.py: RULES_VERSION не выше правил последнего релиза клиента + 1), накопление не потеряно (ci/release_state.py check): (а) строки невыпущенной «Следующей версии» RELEASE_NOTES.md и
#      неопубликованного IMPORTANT.md рабочей ветки есть на wip (перенос между подразделами - не удаление), иначе нужен трейлер
#      `Notes-Edit: <причина>` в коммите wip; (б) поднятая с прошлого выката сервера версия игровой коллекции (любой, кроме служебных из ci/service-collections.txt)
#      сопровождена новым текстом IMPORTANT.md или трейлером `Wipe-Silent: <причина>`; (в) к вышедшему тексту IMPORTANT.md (тег
#      important-* есть) не дописано - файл начинают заново; подразделы заметок в порядке, «Важное» влезает в пост;
#      Там же сторожа самого exile-ci (шаг «CI scripts guards»): ci/guard-network.py - голый gh, curl, git или urlopen вне ci/retry.sh и ci/net.py,
#      ci/guard-parity.py - шаг CI без строки в ci/precheck-map.txt или шаг precheck из карты, которого нет в scripts/precheck.sh обоих репозиториев,
#      ci/guard-test-vps.py - job тестового стенда с боевым ключом деплоя или путём /opt/exileforge;
#      ci/guard-edge.py - Caddy боя к игре боя не по псевдониму exileforge-prod-game или блок теста не на exileforge-test-game (deploy/test сервера);
#      ci/guard-releases.py - gh release create без --prerelease (выпуск игрока - с пометкой «# player-release» над командой);
#      ci/guard-test-version.py - формат версии теста x.y.z_test (клиент и сервер теста), что читает TestVersion: смена формата не ломает молча карты падений и проверку исправлений;
#      ci/guard-dispatch.py - запуск workflow мимо ci/dispatch-wait.sh (голый gh workflow run) или запускаемый workflow без входа caller в run-name;
#   3a. test-dry-run: сухой прогон вычисления версий теста на свежих данных GitHub (ci/test-server-version.sh - тот же код, что у deploy-test сервера, и ci/qa-version.sh - как у тестовой
#      сборки клиента) без выкладки и записи; красное тут - красное и у настоящего deploy-test, поэтому оно роняет и статус check-wip;
#   4. record: сводка времён job'ов и сторож замедления (ci/check-wip-timing.py: wall прогона > 1,4 медианы последних 10 успешных - предупреждение, не падение);
#      оба зелёные - на sha клиента и sha сервера кладётся commit status «check-wip» = success (ci/check-wip-status.sh); упал любой
#      - failure. Отметку читает хук pre-push репозиториев: пуш в рабочую ветку без зелёного check-wip на этом sha отклоняется.
# Журналы шифруются так же, как в client.yml и server.yml (ci/quiet.sh, age). Ворота client.yml, прошедшие здесь, ставят метки
# зелёного дерева: релиз потом их не повторяет.
# Запись статуса сразу читается обратно токеном SOURCE_TOKEN (ci/check-wip-read.sh --expect): так же читают ворота пуша; нечитаемый статус - красное.
# Секреты: SOURCE_TOKEN (чтение, в том числе «Commit statuses: read» на ExileForge и ktor-bestgame), CHECK_WIP_TOKEN либо EXILEFORGE_TOKEN с правом «Commit statuses: write» на ExileForge и ktor-bestgame.
name: Check wip

on:
  workflow_dispatch:
    inputs:
      client_sha:
        description: 'Client commit (empty - head of wip)'
        required: false
      server_sha:
        description: 'Server commit (empty - head of wip)'
        required: false

permissions:
  contents: read

concurrency:
  group: check-wip
  cancel-in-progress: false

env:
  CLIENT_REPO: Sperance/ExileForge
  SERVER_REPO: Sperance/ktor-bestgame
  LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
  SEAL_AGE_RECIPIENT: ${{ vars.SEAL_AGE_RECIPIENT }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      client: ${{ steps.heads.outputs.client }}
      server: ${{ steps.heads.outputs.server }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Heads of wip and the pin
        id: heads
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
          INPUT_CLIENT: ${{ inputs.client_sha }}
          INPUT_SERVER: ${{ inputs.server_sha }}
        run: |
          . ci/branches.env
          . ci/retry.sh
          fetch_head() { sha=$(bash ci/retry.sh read git ls-remote "https://x-access-token:$TOKEN@github.com/$1.git" "refs/heads/$WIP_BRANCH" | cut -f1) && [[ -n $sha ]]; }
          client=${INPUT_CLIENT:-}
          server=${INPUT_SERVER:-}
          if [ -z "$client" ]; then sha=""; retry fetch_head "$CLIENT_REPO" || true; client=$sha; fi
          if [ -z "$server" ]; then sha=""; retry fetch_head "$SERVER_REPO" || true; server=$sha; fi
          [[ $client =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no wip head of the client: push the client wip first"; exit 1; }
          [[ $server =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no wip head of the server: push the server wip first"; exit 1; }
          bash ci/quiet.sh clone-client bash ci/retry.sh read git clone -q --no-checkout --branch "$WIP_BRANCH" "https://x-access-token:$TOKEN@github.com/$CLIENT_REPO.git" cli
          git -C cli cat-file -e "$client^{commit}" 2>/dev/null || { echo "::error::client commit ${client:0:12} is not in wip"; exit 1; }
          pin=$(git -C cli ls-tree "$client" backend | awk '{print $3}')
          [[ $pin =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the client ${client:0:12} pins no server in backend/"; exit 1; }
          if [ "$pin" != "$server" ]; then
            echo "::error::the client wip pins the server ${pin:0:12}, but the server wip head is ${server:0:12}: pin the server wip head in the client (git add backend, API_REVISION by its rules), push the client wip and run Check wip again"
            exit 1
          fi
          echo "client $client, server $server (pinned)"
          { echo "client=$client"; echo "server=$server"; } >> "$GITHUB_OUTPUT"

  server:
    needs: [ resolve, guards ]
    uses: ./.github/workflows/server.yml
    with:
      mode: check-wip
      sha: ${{ needs.resolve.outputs.server }}
    secrets: inherit
    # Права вызываемого workflow не выше вызывающего: server.yml просит packages и actions: write у job'ов образа и деплоя (в check-wip они пропущены)
    permissions:
      contents: write
      packages: write
      actions: write

  client:
    needs: [ resolve, guards ]
    uses: ./.github/workflows/client.yml
    with:
      mode: check-wip
      sha: ${{ needs.resolve.outputs.client }}
    secrets: inherit
    permissions:
      contents: write
      actions: write

  # Сухой прогон вычисления версий теста на свежих данных GitHub: ТОЧНО тот же код, что у deploy-test (ci/test-server-version.sh) и у шага «Test build target»
  # client.yml (ci/qa-version.sh), без выкладки: метки server-deployed, образ боя, живой манифест боя и запись о стенде только читаются, во временный файл
  # считается и запись о выкате (ci/test-stand.py record). Права только на чтение, publish не вызывается. Красное здесь - красное и у настоящего deploy-test.
  # Образ берётся у головы рабочей ветки сервера (у wip образа нет: check-wip его не собирает); нет проверенного образа - предупреждение, считается по sha головы.
  test-dry-run:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/sperance/ktor-bestgame
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Both repositories with the working branches
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          . ci/branches.env
          bash ci/quiet.sh clone-client bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout "https://x-access-token:$TOKEN@github.com/$CLIENT_REPO.git" cli
          bash ci/quiet.sh clone-server bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout "https://x-access-token:$TOKEN@github.com/$SERVER_REPO.git" srv
      - name: Test server version and stand record (dry run)
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          CLIENT: ${{ needs.resolve.outputs.client }}
          SERVER: ${{ needs.resolve.outputs.server }}
        run: |
          . ci/branches.env
          head=$(git -C srv rev-parse "origin/$SERVER_BRANCH")
          if found=$(bash ci/checked-image.sh "$IMAGE" srv "$head"); then
            read -r image _ <<<"$found"
          else
            echo "::warning::the working branch head ${head:0:12} has no checked image: the dry run counts from the head itself"
            image=$head
          fi
          out="$RUNNER_TEMP/test-version.txt"
          : > "$out"
          bash ci/test-server-version.sh version srv "$head" "$image" "$out"
          name="" k="" base=""
          while IFS== read -r key value; do
            case $key in name) name=$value ;; k) k=$value ;; base) base=$value ;; esac
          done < "$out"
          TEST_VERSION=$name TEST_K=$k TEST_BASE=$base bash ci/test-server-version.sh record "$RUNNER_TEMP/stand.json" "$CLIENT" "$SERVER" "$image" qa-0
          echo "test server version (dry run): ${name:-kept from its image}"
          echo "- test server version: \`${name:-kept from its image}\` (dry run, nothing written)" >> "$GITHUB_STEP_SUMMARY"
      - name: Test client version (dry run)
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
        run: |
          out="$RUNNER_TEMP/qa-version.txt"
          : > "$out"
          bash ci/qa-version.sh cli "$CLIENT" "$out"
          name=$(sed -n 's/^name=//p' "$out")
          [[ $name =~ ^[0-9]+\.[0-9]+\.[0-9]+_test$ ]] || { echo "::error::the test client version is malformed"; exit 1; }
          echo "test client version (dry run): $name"
          echo "- test client version: \`$name\` (dry run, nothing written)" >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: test-dry-run-log

  guards:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Both repositories with the working branches
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          . ci/branches.env
          bash ci/quiet.sh clone-client bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout "https://x-access-token:$TOKEN@github.com/$CLIENT_REPO.git" cli
          bash ci/quiet.sh clone-server bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout "https://x-access-token:$TOKEN@github.com/$SERVER_REPO.git" srv
      - name: CI scripts guards
        env:
          CLIENT: ${{ needs.resolve.outputs.client }}
          SERVER: ${{ needs.resolve.outputs.server }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --disable-pip-version-check pyyaml
          bash ci/retry.sh read git -C cli show "$CLIENT:scripts/precheck.sh" > "$RUNNER_TEMP/precheck-client.sh"
          bash ci/retry.sh read git -C srv show "$SERVER:scripts/precheck.sh" > "$RUNNER_TEMP/precheck-server.sh"
          bash ci/retry.sh read git -C srv show "$SERVER:deploy/test/Caddyfile.snippet" > "$RUNNER_TEMP/Caddyfile.snippet"
          bash ci/retry.sh read git -C srv show "$SERVER:deploy/test/install.sh" > "$RUNNER_TEMP/install.sh"
          python3 -I ci/guard-network.py
          python3 -I ci/guard-parity.py --client-precheck "$RUNNER_TEMP/precheck-client.sh" --server-precheck "$RUNNER_TEMP/precheck-server.sh"
          python3 -I ci/guard-test-vps.py
          python3 -I ci/guard-releases.py
          python3 -I ci/guard-test-version.py
          python3 -I ci/guard-dispatch.py
          python3 -I ci/guard-edge.py --snippet "$RUNNER_TEMP/Caddyfile.snippet" --install "$RUNNER_TEMP/install.sh"
      - name: One rules version per release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER: ${{ needs.resolve.outputs.server }}
        run: |
          content=$(python3 ci/rules-step.py --content-path)
          bash ci/retry.sh read git -C srv show "$SERVER:$content" > "$RUNNER_TEMP/Content.kt"
          python3 ci/rules-step.py --file "$RUNNER_TEMP/Content.kt"
      - name: Accumulated notes, important text and wipes
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT: ${{ needs.resolve.outputs.client }}
          SERVER: ${{ needs.resolve.outputs.server }}
          PUBLIC_NOTES: ${{ runner.temp }}/guards.txt
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
        run: |
          . ci/branches.env
          tags() { bash ci/retry.sh read gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$1" --paginate --jq '.[].ref' > "$RUNNER_TEMP/$2"; }
          tags important- tags-important.txt
          tags server-deployed/ tags-deployed.txt
          code=0
          bash ci/quiet.sh release-guards python3 -I ci/release_state.py check --cli cli --srv srv \
            --cli-wip "$CLIENT" --cli-work "origin/$CLIENT_BRANCH" --srv-wip "$SERVER" --srv-work "origin/$SERVER_BRANCH" \
            --posted-important "$RUNNER_TEMP/tags-important.txt" --deployed "$RUNNER_TEMP/tags-deployed.txt" || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: guards-log

  record:
    needs: [ resolve, server, client, guards, test-dry-run ]
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Время каждого job и прогона; прогон дольше 1,4 медианы последних 10 успешных - предупреждение (не падение, шаг ничего не роняет)
      - name: Timing summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs="$RUNNER_TEMP/jobs.jsonl" run="$RUNNER_TEMP/run.json" runs="$RUNNER_TEMP/runs.jsonl"
          bash ci/retry.sh read gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '.jobs[] | {name, started_at, completed_at}' > "$jobs" || : > "$jobs"
          bash ci/retry.sh read gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$run" || echo '{}' > "$run"
          bash ci/retry.sh read gh api "repos/$GITHUB_REPOSITORY/actions/workflows/check-wip.yml/runs?status=success&per_page=10" --jq '.workflow_runs[] | {id, run_started_at, updated_at}' > "$runs" || : > "$runs"
          python3 -I ci/check-wip-timing.py "$jobs" "$run" "$runs" || true
      # Сторож доверия: записанный статус читается обратно тем же токеном (SOURCE_TOKEN) и тем же путём, что ворота пуша в client.yml и server.yml;
      # не прочитался (нет права «Commit statuses: read») - красное, иначе пуш молча повторял бы все проверки
      - name: Record check-wip on both commits
        env:
          TOKEN: ${{ secrets.CHECK_WIP_TOKEN || secrets.EXILEFORGE_TOKEN }}
          READ_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          CLIENT: ${{ needs.resolve.outputs.client }}
          SERVER: ${{ needs.resolve.outputs.server }}
          GREEN: ${{ needs.server.result == 'success' && needs.client.result == 'success' && needs.guards.result == 'success' && needs.test-dry-run.result == 'success' }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          . ci/branches.env
          if [ "$GREEN" = true ]; then state=success; text="client and server wip checked together"; else state=failure; text="check-wip failed or was cancelled"; fi
          bash ci/check-wip-status.sh "$CLIENT_REPO" "$CLIENT" "$state" "$text (server ${SERVER:0:12})" "$URL"
          bash ci/check-wip-status.sh "$SERVER_REPO" "$SERVER" "$state" "$text (client ${CLIENT:0:12})" "$URL"
          TOKEN="$READ_TOKEN" bash ci/check-wip-read.sh --expect "$state" "$CLIENT_REPO" "$CLIENT"
          TOKEN="$READ_TOKEN" bash ci/check-wip-read.sh --expect "$state" "$SERVER_REPO" "$SERVER"
          [ "$state" = success ]
