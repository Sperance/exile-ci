# Обслуживание CI: четыре независимые задачи, выбор - по расписанию, пушу или входу task при ручном запуске.
#   store-status - раз в 6 часов ('17 */6 * * *': 03:17, 09:17, 15:17, 21:17 МСК), сразу после выкладки выпуска (client.yml) и вручную;
#   cleanup      - раз в сутки ('43 2 * * *') и вручную;
#   scan         - раз в неделю ('31 3 * * 1', понедельник) и вручную;
#   doctor       - вручную и на пуш в main, затронувший этот файл (только она).
# Единственный источник запуска store-status по часам - это расписание (раз в 6 часов): других диспетчеров нет (часовой таймер VPS `exileforge-tick` снят).
# Расписание задаёт задачу по github.event.schedule; inputs при нём и при пуше пусты.
#
# Задача store-status:
# Состояние каналов выкладки клиента: раз в 6 часов (расписание ниже) и один раз после выкладки выпуска опрашивает Google Play и RuStore и шлёт серверу по отчёту на каждый активный канал
# (POST admin/release/channels, ChannelStatusReport; сервер сам поднимает минимальную ревизию, когда сборка у всех каналов раздана
# целиком сутки). Прямой канал отчитывается по последнему релизу этого репозитория. Канал без ключей магазина пропускается, как будто
# его нет; без SERVER_URL и RELEASE_STATUS_TOKEN прогон красный: экран «Версии» в игре остаётся без данных.
# Выкладку Play доводит до 100%: сборка на 20% не меньше суток и не больше 3 открытых Issues crash+auto ExileForge с её выхода -
# ci/store-status.py; при всплеске падений доводка останавливается с предупреждением, пока их не разберут.
# RuStore, ручная выкладка (ci/rustore_manual.py): открытый Issue «[RuStore] Загрузить X вручную» закрывается, когда X в магазине;
# когда магазин ничего не модерирует, а живая версия сменилась после прошлой попытки - client.yml запускается в режиме stores (actions: write).
# Журнал публичен: скрипты идут через ci/quiet.sh, в журнал - короткие строки (канал, версия, доля), подробности падения - в
# зашифрованном артефакте (age, открытый ключ vars.LOG_AGE_RECIPIENT).
# Секреты: RELEASE_STATUS_TOKEN, PLAY_SERVICE_ACCOUNT_JSON, RUSTORE_KEY_ID, RUSTORE_PRIVATE_KEY, EXILEFORGE_TOKEN (проверка падений),
# Переменные: LOG_AGE_RECIPIENT, SERVER_URL (адрес сервера с https://, без слеша в конце), PLAY_TRACK (дорожка Play, ci/play.py).
#
# Задача cleanup:
# Чистка платного хранилища GitHub (бесплатно 0,5 ГБ на аккаунт, считаются только приватные репозитории): раз в сутки (расписание ниже) и вручную.
# Артефакты Actions в ExileForge и ktor-bestgame удаляются все - их оставили прогоны до переезда CI сюда, новые их не создают.
# Образы сервера ghcr.io/sperance/ktor-bestgame: живут тег ветки и 5 последних проверенных, черновые и безымянные старше суток
# удаляются; откат на VPS идёт на локальную копию прежнего образа (deploy/update.sh сервера). Правила - ci/cleanup.py.
# Журнал публичен: только счётчики и коды ответов, подробности падения - в зашифрованном артефакте (age, открытый ключ vars.LOG_AGE_RECIPIENT).
# Секреты: CLEANUP_TOKEN (fine-grained, ExileForge и ktor-bestgame, Actions: Read and write; нет - артефакты пропускаются с
# предупреждением). Переменная LOG_AGE_RECIPIENT. Образы удаляет GITHUB_TOKEN: пакету выдана роль Admin этого репозитория
# (Package settings - Manage Actions access).
#
# Задача scan:
# Уязвимости сервера раз в неделю (на пушах сервера Trivy не идёт): зависимости головы рабочей ветки сервера (Gradle) и её проверенный
# образ (ci/checked-image.sh; нет образа - только зависимости, предупреждением). Находки HIGH - предупреждение со счётчиком, находка
# CRITICAL - красный прогон. Отчёт (имена и версии зависимостей приватного кода) - в зашифрованном артефакте `vuln-scan`, в журнал - только счётчики.
# Секреты: SOURCE_TOKEN (чтение сервера); образ читает GITHUB_TOKEN (пакету выдан доступ этого репозитория).
#
# Задача doctor:
# Проверка секретов, токенов и доступов CI без вывода значений: только «есть / работает / нет». Запуск - вручную
# (workflow_dispatch) или правкой этого файла (на пуш в main запускается только эта задача). Ничего не меняет, кроме проверочных метки и черновика релиза в ExileForge (сразу удаляются).
name: Maintenance

on:
  schedule:
    - cron: '17 */6 * * *'
    - cron: '43 2 * * *'
    - cron: '31 3 * * 1'
  workflow_dispatch:
    inputs:
      task:
        description: 'store-status - report the store channels to the server; cleanup - free the paid GitHub storage; scan - Trivy over the server head and its checked image (fails on CRITICAL); doctor - check secrets, tokens and access'
        type: choice
        options: [ store-status, cleanup, scan, doctor ]
        default: store-status
  push:
    branches: [ main ]
    paths: [ .github/workflows/maintenance.yml ]

permissions:
  contents: read

env:
  # Открытый ключ age для журналов (ci/crypt.sh)
  LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}

jobs:
  store-status:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'store-status') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    timeout-minutes: 15
    concurrency:
      group: store-status
      cancel-in-progress: false
    env:
      SERVER_URL: ${{ vars.SERVER_URL }}
      RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_TOKEN }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_TRACK: ${{ vars.PLAY_TRACK }}
      RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
      RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
      EXILEFORGE_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
    steps:
      - id: gate
        run: |
          if [ -z "$SERVER_URL" ] || [ -z "$RELEASE_STATUS_TOKEN" ]; then
            echo "::error::SERVER_URL or RELEASE_STATUS_TOKEN is not set: channel reports are off, the Versions screen shows no data"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] || { [ -n "$RUSTORE_KEY_ID" ] && [ -n "$RUSTORE_PRIVATE_KEY" ]; }; then echo "stores=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: steps.gate.outputs.stores == 'true'
        uses: ./.github/actions/store-tools
      - if: steps.gate.outputs.enabled == 'true'
        name: Report the channels
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
        run: |
          . ci/build-tasks.env
          export APP_ID
          code=0
          bash ci/quiet.sh store-status python3 ci/store-status.py all || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      # Журнал - только когда репозиторий уже выгружен: упавшая проверка ключей своего журнала не пишет
      - name: Encrypted log
        if: failure() && steps.gate.outputs.enabled == 'true'
        uses: ./.github/actions/upload-log
        with:
          name: store-status-log

  cleanup:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '43 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.task == 'cleanup') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 75
    concurrency:
      group: cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Шаги независимы: отказ или срок одного не мешает другому, прогон красный, если упал любой
      - name: Artifacts of the private repositories
        id: artifacts
        continue-on-error: true
        timeout-minutes: 60
        env:
          CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
          PUBLIC_NOTES: ${{ runner.temp }}/artifacts.txt
        run: |
          code=0
          bash ci/quiet.sh cleanup-artifacts python3 ci/cleanup.py artifacts || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Old server images
        id: images
        continue-on-error: true
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/images.txt
        run: |
          code=0
          bash ci/quiet.sh cleanup-images python3 ci/cleanup.py images || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - name: Encrypted log
        if: steps.artifacts.outcome == 'failure' || steps.images.outcome == 'failure'
        uses: ./.github/actions/upload-log
        with:
          name: cleanup-log
      - name: Result
        if: steps.artifacts.outcome == 'failure' || steps.images.outcome == 'failure'
        run: exit 1

  scan:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '31 3 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.task == 'scan') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    concurrency:
      group: scan
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # История нужна ci/checked-image.sh: проверенный образ головы или ближайшего предка с тем же кодом
      - name: Server head and its checked image
        id: head
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
          IMAGE: ghcr.io/sperance/ktor-bestgame
        run: |
          . ci/branches.env
          bash ci/quiet.sh clone-server git clone -q --branch "$SERVER_BRANCH" "https://x-access-token:$TOKEN@github.com/Sperance/ktor-bestgame.git" server
          sha=$(git -C server rev-parse HEAD)
          if found=$(bash ci/checked-image.sh "$IMAGE" server "$sha"); then
            read -r _ digest <<<"$found"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::the server head has no checked image: only the dependencies are scanned"
          fi
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.2
      - name: Scan dependencies and the image
        env:
          DIGEST: ${{ steps.head.outputs.digest }}
          IMAGE: ghcr.io/sperance/ktor-bestgame
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TRIVY_DISABLE_VEX_NOTICE: 'true'
        run: |
          mkdir -p scan
          bash ci/quiet.sh scan-fs trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output scan/fs.json server
          [ -z "$DIGEST" ] || bash ci/quiet.sh scan-image trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --format json --output scan/image.json "$IMAGE@$DIGEST"
          fail=0
          for report in fs image; do
            [ -f "scan/$report.json" ] || continue
            read -r high critical < <(python3 -c 'import json, sys; f = [v.get("Severity") for r in json.load(open(sys.argv[1])).get("Results") or [] for v in r.get("Vulnerabilities") or []]; print(f.count("HIGH"), f.count("CRITICAL"))' "scan/$report.json")
            echo "scan $report: $critical CRITICAL, $high HIGH"
            [ "$high" -eq 0 ] || echo "::warning::scan $report found $high HIGH vulnerabilities: see the sealed artifact vuln-scan"
            if [ "$critical" -gt 0 ]; then echo "::error::scan $report found $critical CRITICAL vulnerabilities: see the sealed artifact vuln-scan"; fail=1; fi
          done
          exit $fail
      - name: Seal the scan report
        if: always()
        run: bash ci/seal.sh sealed/vuln-scan.enc scan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vuln-scan
          path: |
            sealed/vuln-scan.enc
            logs
          retention-days: 7
          if-no-files-found: ignore

  doctor:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.task == 'doctor') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 10
    env:
      SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
      EXILEFORGE_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
      GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
      LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
      SEAL_AGE_RECIPIENT: ${{ vars.SEAL_AGE_RECIPIENT }}
      SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
      VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
      UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      UPDATE_SIGN_PUBLIC_KEY: ${{ vars.UPDATE_SIGN_PUBLIC_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
      RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
      RELEASE_STATUS_TOKEN: ${{ secrets.RELEASE_STATUS_TOKEN }}
      SERVER_URL: ${{ vars.SERVER_URL }}
      CLEANUP_TOKEN: ${{ secrets.CLEANUP_TOKEN }}
    steps:
      # Скрипты ci/ (ключ подписи, ветки); без сохранённых прав - иначе git ls-remote к закрытым репо идёт токеном этого репо
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Secrets and tokens
        run: |
          fail=0
          ok() { echo "OK    $*"; }
          bad() { echo "FAIL  $*"; fail=1; }
          api() { curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" -H "Accept: application/vnd.github+json" "${@:2}" 2>/dev/null || echo 000; }
          for name in SOURCE_TOKEN EXILEFORGE_TOKEN GH_ISSUES_TOKEN DEPLOY_HOST DEPLOY_SSH_KEY; do
            [ -n "${!name}" ] && ok "secret $name is set" || bad "secret $name is missing"
          done
          # Шифрование журналов и артефактов (ci/crypt.sh): age с открытыми ключами
          . ci/crypt.sh; ensure_age
          if [[ $LOG_AGE_RECIPIENT =~ ^age1[a-z0-9]{50,}$ ]]; then ok "variable LOG_AGE_RECIPIENT is an age public key"; else bad "variable LOG_AGE_RECIPIENT is missing or not an age public key (age-keygen)"; fi
          if [[ $SEAL_AGE_RECIPIENT =~ ^age1[a-z0-9]{50,}$ && -n $SEAL_AGE_IDENTITY ]]; then
            [ "$(printf '%s\n' "$SEAL_AGE_IDENTITY" | age-keygen -y 2>/dev/null)" = "$SEAL_AGE_RECIPIENT" ] \
              && ok "SEAL_AGE_RECIPIENT matches the secret SEAL_AGE_IDENTITY" || bad "SEAL_AGE_RECIPIENT does not match the secret SEAL_AGE_IDENTITY"
          else bad "variable SEAL_AGE_RECIPIENT or secret SEAL_AGE_IDENTITY is missing (artifacts between jobs)"; fi
          [[ $VPS_HOST_KEY =~ ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+)[[:space:]]+[A-Za-z0-9+/]+=*([[:space:]].*)?$ ]] \
            && ok "variable VPS_HOST_KEY looks like a host key" || bad "variable VPS_HOST_KEY is missing: SSH to the VPS is refused (ssh-keyscan -t ed25519 <host>)"
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            # Открытая часть ключа подписи должна совпасть с переменной, которую игра получает при сборке
            derived=$(printf '%s\n' "$UPDATE_SIGNING_KEY" | openssl pkey -pubout -outform DER 2>/dev/null | tail -c 32 | od -An -v -tx1 | tr -d ' \n')
            [ ${#derived} = 64 ] && [ "$derived" = "$UPDATE_SIGN_PUBLIC_KEY" ] \
              && ok "UPDATE_SIGN_PUBLIC_KEY matches the secret UPDATE_SIGNING_KEY" || bad "UPDATE_SIGN_PUBLIC_KEY is missing or does not match the secret UPDATE_SIGNING_KEY"
          else echo "WAIT  secret UPDATE_SIGNING_KEY is not set (update.json signing is off)"; fi

          for repo in ExileForge ktor-bestgame; do
            git ls-remote "https://x-access-token:$SOURCE_TOKEN@github.com/Sperance/$repo.git" HEAD >/dev/null 2>&1 \
              && ok "SOURCE_TOKEN reads $repo" || bad "SOURCE_TOKEN cannot read $repo (Contents: Read)"
          done

          R=https://api.github.com/repos/Sperance/ExileForge
          label="ci-doctor-$GITHUB_RUN_ID"
          for t in EXILEFORGE_TOKEN GH_ISSUES_TOKEN; do
            v=${!t}
            [ "$(api "$v" "$R")" = 200 ] && ok "$t sees ExileForge" || bad "$t cannot see ExileForge"
            [ "$(api "$v" "$R/issues?per_page=1")" = 200 ] && ok "$t reads issues" || bad "$t cannot read issues"
            [ "$(api "$v" "$R/releases?per_page=1")" = 200 ] && ok "$t reads releases (Contents: Read)" || bad "$t cannot read releases (Contents: Read)"
            made=$(api "$v" -X POST "$R/labels" -d "{\"name\":\"$label-$t\",\"color\":\"cccccc\"}")
            if [ "$made" = 201 ]; then ok "$t writes issues (label)"; api "$v" -X DELETE "$R/labels/$label-$t" >/dev/null; else bad "$t cannot write issues: HTTP $made (Issues: Read and write)"; fi
          done
          # Право Contents: write - черновиком релиза: тег не создаётся, сборки ExileForge не запускаются
          rel=$(curl -sS -X POST -H "Authorization: Bearer $EXILEFORGE_TOKEN" -H "Accept: application/vnd.github+json" "$R/releases" \
            -d "{\"tag_name\":\"$label\",\"name\":\"$label\",\"draft\":true}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          if [ -n "$rel" ]; then ok "EXILEFORGE_TOKEN writes contents (draft release)"; api "$EXILEFORGE_TOKEN" -X DELETE "$R/releases/$rel" >/dev/null; else bad "EXILEFORGE_TOKEN cannot write contents (Contents: Read and write)"; fi

          [[ $DEPLOY_HOST =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ || $DEPLOY_HOST =~ ^[a-zA-Z0-9.-]+$ ]] && ok "DEPLOY_HOST looks like a host" || bad "DEPLOY_HOST is not an IP or host name"
          timeout 10 bash -c "</dev/tcp/$DEPLOY_HOST/22" 2>/dev/null && ok "DEPLOY_HOST port 22 is open" || bad "DEPLOY_HOST port 22 unreachable"
          # Ключ хоста, который отдаёт VPS, должен совпасть с закреплённым VPS_HOST_KEY (адрес не печатается)
          pinned=$(echo "$VPS_HOST_KEY" | awk '{print $1" "$2}')
          seen=$(ssh-keyscan -T 15 -t "${pinned%% *}" "$DEPLOY_HOST" 2>/dev/null | awk '!/^#/{print $2" "$3; exit}')
          fp() { echo "$1" | ssh-keygen -lf - 2>/dev/null | awk '{print $2}'; }
          if [ -z "$seen" ]; then bad "the VPS did not present a ${pinned%% *} host key (ssh-keyscan got no answer)"
          elif [ "$seen" = "$pinned" ]; then ok "VPS_HOST_KEY matches the key the VPS presents"
          else bad "VPS_HOST_KEY $(fp "$pinned") differs from the key the VPS presents $(fp "$seen")"; fi
          install -m 600 /dev/null "$RUNNER_TEMP/k" && printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/k"
          if ssh-keygen -y -f "$RUNNER_TEMP/k" > "$RUNNER_TEMP/k.pub" 2>/dev/null; then
            ok "DEPLOY_SSH_KEY is a valid private key, public fingerprint: $(ssh-keygen -lf "$RUNNER_TEMP/k.pub" | cut -d' ' -f2)"
          else bad "DEPLOY_SSH_KEY is not a valid private key (copy it with the BEGIN/END lines)"; fi
          rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/k.pub"

          if [ -n "$RELEASE_KEYSTORE" ]; then
            bash ci/keystore.sh "$RUNNER_TEMP/r.jks" 2>/dev/null
            keytool -list -keystore "$RUNNER_TEMP/r.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null 2>&1 \
              && ok "signing keystore opens, alias found" || bad "signing keystore or its password or alias is wrong"
            rm -f "$RUNNER_TEMP/r.jks"
          else echo "WAIT  signing secrets not copied yet (copy them from ExileForge)"; fi
          # Чистка хранилища (задача cleanup): без токена пропускает артефакты приватных репозиториев
          [ -n "$CLEANUP_TOKEN" ] && ok "secret CLEANUP_TOKEN is set" || echo "WAIT  secret CLEANUP_TOKEN is not set (cleanup.yml skips old artifacts of private repositories)"
          # Магазины и отчёты о каналах: аккаунтов может ещё не быть - отсутствие не ошибка, канал просто выключен
          for name in PLAY_SERVICE_ACCOUNT_JSON RUSTORE_KEY_ID RUSTORE_PRIVATE_KEY RELEASE_STATUS_TOKEN; do
            [ -n "${!name}" ] && ok "secret $name is set" || echo "WAIT  secret $name is not set (its store channel stays off)"
          done
          [ -n "$SERVER_URL" ] && ok "variable SERVER_URL is set" || echo "WAIT  variable SERVER_URL is not set (channel reports stay off)"
          exit $fail
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Server image access
        run: |
          . ci/branches.env
          docker buildx imagetools inspect "ghcr.io/sperance/ktor-bestgame:${SERVER_BRANCH//\//-}" >/dev/null 2>&1 \
