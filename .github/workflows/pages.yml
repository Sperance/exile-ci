# Публикует legal/ (политика конфиденциальности и удаление аккаунта для Google Play) на GitHub Pages: https://sperance.github.io/exile-ci/.
# Один раз включить: Settings → Pages → Source: GitHub Actions.
# Pages выкладывает и telegram.yml - legal/ вместе с баннером поста; этот деплой баннер убирает, Telegram его уже сохранил у себя.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ legal/**, .github/workflows/pages.yml ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: legal
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
