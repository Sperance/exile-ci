# Публикует legal/ (политика конфиденциальности и удаление аккаунта для Google Play) на GitHub Pages: https://sperance.github.io/exile-ci/.
# Один раз включить: Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ legal/**, .github/workflows/pages.yml ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: legal
      - id: deployment
        uses: actions/deploy-pages@v4
