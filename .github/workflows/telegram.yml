# Пост об обновлении в тему «Обновления» группы Telegram (TELEGRAM_CHAT, TELEGRAM_TOPIC ниже): баннер «Обновление <версия>», заметки
# релиза (RELEASE_NOTES.md из тела релиза), кнопки RuStore, Google Play и APK; пост закрепляется в теме вместо прошлых.
# Код поста и баннера - ci/telegram/.
# Запуск: job `release` в client.yml сразу после публикации релиза; вручную - Release → telegram (последний релиз) или здесь с тегом.
# Раннеры GitHub - вне РФ, api.telegram.org им доступен напрямую; VPS не участвует.
# Баннер - на GitHub Pages рядом с legal/ (ассеты релиза GitHub отдаёт как octet-stream, Telegram не покажет их картинкой). Превью
# Telegram хранит у себя, поэтому следующий деплой pages.yml баннер убирает без вреда.
# Повтор не дублирует пост: номер поста версии - в кэше Actions (ключ telegram-post-<тег>, живёт 7 дней без обращений), есть номер -
# пост правится; номер можно задать и вручную (вход message_id). Сбой Telegram - предупреждение, workflow зелёный.
# Секрет TELEGRAM_BOT_TOKEN: бот - админ группы с правом «Закрепление сообщений».
name: Telegram

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag, e.g. v0.24.0; empty - the latest release'
        required: false
        default: ''
      message_id:
        description: 'number of the post of this version already in the topic (last number of its link); empty - from the cache'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Общая очередь с pages.yml: два деплоя Pages сразу не идут
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      TELEGRAM_CHAT: '@exileforge'
      # Тема «Обновления»: t.me/exileforge/3
      TELEGRAM_TOPIC: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release view $TAG -R "$GITHUB_REPOSITORY" --json tagName,body > "$RUNNER_TEMP/release.json"
          tag=$(jq -r .tagName "$RUNNER_TEMP/release.json")
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$tag' is not a game release tag"; exit 1; }
          jq -r .body "$RUNNER_TEMP/release.json" | tr -d '\r' > "$RUNNER_TEMP/notes.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release: $tag"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Banner
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          pip install --quiet --disable-pip-version-check pillow==11.0.0
          cp -r legal site
          python3 ci/telegram/banner.py "${TAG#v}" "site/banner/$TAG.png"
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - id: state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: telegram-post.json
          key: telegram-post-${{ steps.release.outputs.tag }}
      # Номер прогона в адресе: Telegram запоминает превью по ссылке, а повтор может нести новый баннер
      - name: Post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
          BANNER_URL: ${{ steps.pages.outputs.base_url }}/banner/${{ steps.release.outputs.tag }}.png?r=${{ github.run_id }}
          MESSAGE_ID: ${{ inputs.message_id }}
        run: python3 ci/telegram/post.py "$TAG" "$RUNNER_TEMP/notes.md" "$BANNER_URL" telegram-post.json "$MESSAGE_ID"
      - if: steps.state.outputs.cache-hit != 'true' && hashFiles('telegram-post.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: telegram-post.json
          key: telegram-post-${{ steps.release.outputs.tag }}
