# CI и авто-деплой приватного сервера Sperance/ktor-bestgame на бесплатных минутах публичного репозитория.
# Код сервера здесь не хранится: каждый job скачивает нужный коммит токеном SOURCE_TOKEN (fine-grained, Contents: read
# на ExileForge и ktor-bestgame). Журналы публичны, поэтому сборка, проверки и деплой идут через ci/quiet.sh: в журнал - только итог
# шага, полный вывод падения - в зашифрованном артефакте (age, открытый ключ LOG_AGE_RECIPIENT).
#
# Запуск:
#   repository_dispatch server-push   - пуш в рабочую ветку сервера (job `forward` в deploy.yml сервера); если на этом sha или на предке, после которого
#                                       менялись только документы (ci/docs-only.py), стоит commit status `check-wip` = success (пуш - fast-forward из wip,
#                                       прошедшего Check wip), проверки, панель и совместимость пропускаются, остаются образ (собранный Check wip на
#                                       том же sha берётся готовым) и метка. Иначе: проверки, браузерная
#                                       проверка графиков панели, совместимость со старейшим клиентом окна ревизий (job `compat`)
#                                       и сборка образа параллельно, затем метка «проверен» на образ (job `mark`). БЕЗ деплоя:
#                                       выпуски накопительные, сервер выкатывается вместе с выпуском клиента;
#   repository_dispatch server-deploy - workflow_dispatch сервера (job `release` client.yml после релиза клиента): деплой головы
#                                       ветки, если её образ уже проверен (после правки только .md вне образа - образ ближайшего
#                                       проверенного предка, ci/checked-image.sh);
#   workflow_dispatch                 - вручную: push - как пуш (без деплоя); deploy - деплой проверенного образа головы (срочный
#                                       выкат только сервера: Release → server); rebuild - проверки, образ и деплой (Release →
#                                       server-rebuild);
#   workflow_dispatch deploy-test     - тестовый сервер (второй проект на том же VPS, /opt/exileforge-test): job `deploy-test` выкатывает уже
#                                       проверенный образ закреплённого в клиенте sha (его запускает job `qa-release` client.yml;
#                                       предрелиз qa-<n> и постоянный qa-latest публикует job `qa-publish` ПОСЛЕ удачного выката); ключ DEPLOY_SSH_KEY_TEST привязан к update.sh тестового проекта, боевой деплой
#                                       этот режим не затрагивает; без vars.TEST_SERVER_URL job пропускается зелёным. После удачного выката job пишет,
#                                       что стоит на тесте (ci/test-stand.sh: prerelease `stand-<UTC>` с stand.json: sha клиента, закреплённый
#                                       сервер, образ, время, база боя и k версии теста) - по записи Release решает, на тесте ли голова. Первый выкат теста (записей ещё нет)
#                                       один раз переносит боевой слепок баланса на тест (job `test-base`, ci/balance-transfer.sh prod-to-test);
#   workflow_call (check-wip.yml)     - режим check-wip: проверки, панель и совместимость на текущем wip сервера и образ; после зелёных проверок образ
#                                       метится :<sha> (без тега ветки) - на нём check-wip.yml выкатывает тест (job test). Боевого деплоя нет.
# После выката сервера с выпуском клиента (job `deploy`, вход version) job `balance` переносит слепок баланса и текстов клиента теста в бой
# (test-to-prod; отказ, если код различается, - красный); без этого переноса выкат идёт, когда выпуск мимо теста (вход skip_test).
# После выката (job `deploy`): коммит отмечается тегом server-deployed/<sha> в этом репозитории (от него считаются «с прошлого выката»:
# вайпы игровых коллекций в check-wip, Issues серверных коммитов); пост «Важное» (вход version - номер выпуска клиента для заголовка);
# без выпуска клиента (Release → server, вход version пуст) - ещё пост новых пунктов «[сервер]» заметок в «Обновления»
# (telegram-server-notes.yml) и закрытие Issues серверных коммитов с прошлого выката меткой «сервер <дата>» (ci/close-server-issues.sh).
# Образ уходит в приватный пакет ghcr.io/sperance/ktor-bestgame черновым тегом :build-<sha>, после зелёных проверок получает
# :<sha> и :<ветка>; на VPS по SSH запускается deploy/update.sh сервера с этим sha.
# Перед деплоем (job `deploy`) - защита ci/deploy-guard.py: сервер не выкатывается, если отрежет самую старую сборку, ещё лежащую в
# канале магазина (минимум ревизии, форма контента CONTENT_SCHEMA и правила RULES_VERSION против update.json этих сборок; каналы - из
# публичного манифеста SERVER_URL/static/index.json). Разрыв, одобренный владельцем, - ручной запуск с force_breaking.
# Деплой: по SSH идёт ci/vps-ssh.sh - ключ хоста закреплён в vars.VPS_HOST_KEY, StrictHostKeyChecking=yes; на VPS уходит команда
# `deploy <sha> <sha256:дайджест>`: update.sh тянет образ по неизменяемому дайджесту, а не по тегу, и сверяет метку sha образа.
# Журналы шифруются age (открытый ключ vars.LOG_AGE_RECIPIENT, ci/crypt.sh).
# Trivy (зависимости и образ сервера) здесь не идёт: раз в неделю его гоняет задача `scan` maintenance.yml.
# Секреты: SOURCE_TOKEN, DEPLOY_HOST, DEPLOY_SSH_KEY, GH_ISSUES_TOKEN, REPORTS_WORK_TOKEN и REPORTS_RELAY_TOKEN (очередь отчётов: уходят серверу вторым и третьим словом stdin после GH_ISSUES_TOKEN; пусто - сервер оставляет прежние) (deploy-test: DEPLOY_SSH_KEY_TEST вместо DEPLOY_SSH_KEY; оба ключа - только jobs `balance` и `test-base`). Переменные: GOOGLE_WEB_CLIENT_ID (идентификатор клиента Google, не секрет: четвёртым словом stdin; пусто - вход через Google выключен), VPS_HOST_KEY, LOG_AGE_RECIPIENT, TEST_SERVER_URL (только deploy-test).
# Пакету в GHCR выдан доступ этого репозитория (Package settings - Manage Actions access - Write).
# Запуск других workflow (telegram-important.yml, telegram-server-notes.yml, client.yml cache) - только через ci/dispatch-wait.sh: вызывающий job ждёт итог запущенного прогона и краснеет,
# если тот красный (посты в Telegram - DISPATCH_WAIT_SOFT, предупреждение со ссылкой). Запущенный workflow объявляет вход `caller` и несёт его в run-name. Тупиков нет: `deploy` (группа deploy)
# ждёт telegram-important / telegram-server-notes (свои группы); `refresh-cache` (без группы) ждёт client.yml cache (client-changes-cache, gradle-cache), а тот не ждёт ни этот прогон, ни
# release клиента (job `release` держит группу `release`, которой у cache нет; gradle-cache прогона release стартует только после `release`).
name: Server
run-name: Server ${{ inputs.mode || github.event.action }} ${{ inputs.caller }}

on:
  repository_dispatch:
    types: [ server-push, server-deploy ]
  workflow_call:
    inputs:
      mode:
        type: string
        default: check-wip
      sha:
        type: string
        default: ''
      force_breaking:
        type: boolean
        default: false
      version:
        type: string
        default: ''
      client_sha:
        type: string
        default: ''
      qa_tag:
        type: string
        default: ''
      qa_run:
        type: string
        default: ''
      skip_test:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      mode:
        description: 'push - checks and image, no deploy; deploy - deploy the checked head image; rebuild - checks, image and deploy; deploy-test - deploy the checked image of the sha to the test server (client.yml qa-release starts it; sha = server pinned in the client); check-wip - checks, panel and compat without image and deploy (check-wip.yml calls it)'
        type: choice
        options: [ deploy, push, rebuild, deploy-test, check-wip ]
        default: deploy
      sha:
        description: 'Server commit (empty - head of the working branch)'
        required: false
      force_breaking:
        description: 'Owner-approved break: deploy even if the server cuts a build still held by a store channel'
        type: boolean
        default: false
      version:
        description: 'Client release version when the deploy follows a release (heading of the important post); empty - server alone'
        required: false
        default: ''
      client_sha:
        description: 'deploy-test: client commit of the test build (client.yml qa-release sets it); the test stand record keeps it'
        required: false
        default: ''
      qa_tag:
        description: 'deploy-test: tag qa-<n> of the test build (record, and the release published after the deploy)'
        required: false
        default: ''
      qa_run:
        description: 'deploy-test: id of the client.yml run whose sealed artifact qa-publish holds the test build files (published only after the deploy succeeded)'
        required: false
        default: ''
      skip_test:
        description: 'deploy after a client release: the release went out without the test stand (Release -> client with skip_test), so the test balance is not carried to prod'
        type: boolean
        default: false
      caller:
        description: 'Marker of the run that waits for this one (ci/dispatch-wait.sh sets it); empty - started by hand'
        required: false
        default: ''

# Чужой код здесь не исполняется: триггеров pull_request нет, токен job'ов по умолчанию только читает.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/sperance/ktor-bestgame
  SERVER_REPO: Sperance/ktor-bestgame
  # Открытые ключи age (ci/crypt.sh): на раннере только они
  LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
  SEAL_AGE_RECIPIENT: ${{ vars.SEAL_AGE_RECIPIENT }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      mode: ${{ steps.target.outputs.mode }}
      trusted: ${{ steps.wip.outputs.trusted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: CI scripts guards
        run: |
          python3 -c 'import yaml' 2>/dev/null || bash ci/retry.sh read python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 -I ci/guard-network.py
          python3 -I ci/guard-parity.py
          python3 -I ci/guard-test-vps.py
          python3 -I ci/guard-releases.py
          python3 -I ci/guard-test-version.py
          python3 -I ci/guard-dispatch.py
          python3 -I ci/guard-age.py
      - name: Target commit
        id: target
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_SHA: ${{ inputs.sha }}
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: . ci/branches.env && bash ci/resolve.sh "$SERVER_REPO" "$SERVER_BRANCH" server push deploy rebuild deploy-test check-wip
      # Пуш в рабочую ветку - fast-forward из wip: commit status `check-wip` = success на этом sha или на предке, после которого менялись только документы
      # (ci/docs-only.py trusted), значит, что проверки, панель и совместимость уже зелёные на этом коде, и они пропускаются; остаются образ (уже
      # собранный Check wip - берётся готовым) и метка «проверен». Режим rebuild (Release → server-rebuild) проверки идёт заново всегда. Статуса нет или
      # он не success - всё как обычно; статус не прочитался - то же, но с предупреждением и строкой в сводке job (ci/check-wip-read.sh), а не молча.
      - name: Check wip status
        id: wip
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
          MODE: ${{ steps.target.outputs.mode }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          trusted=false
          if [ "$MODE" = push ]; then
            if base=$(python3 -I ci/docs-only.py trusted server "$SERVER_REPO" "$SHA"); then
              trusted=true
              echo "checks, panel and compat are skipped: Check wip passed ${base:0:12}${base:+, after it only documents changed}"
            else
              echo "no green check-wip on ${SHA:0:12} or on a documents-only ancestor: the checks run"
            fi
          fi
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

  checks:
    needs: resolve
    if: ${{ needs.resolve.outputs.trusted != 'true' && (needs.resolve.outputs.mode == 'push' || needs.resolve.outputs.mode == 'rebuild' || needs.resolve.outputs.mode == 'check-wip') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Новый пуш отменяет проверки устаревшего: выкатывать всё равно будут его
    concurrency:
      group: server-checks${{ needs.resolve.outputs.mode == 'check-wip' && '-wip' || '' }}
      cancel-in-progress: ${{ needs.resolve.outputs.mode != 'check-wip' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Версию сервера Gradle считает по истории (patch - число коммитов после правки server-version)
      - uses: ./.github/actions/source
        with:
          repo: ${{ env.SERVER_REPO }}
          sha: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: server
          submodules: 'false'
          persist-credentials: 'false'
          fetch-depth: 0
          java: '21'
          cache-writer: 'true'
      # Тесты чистой логики редактора формул панели идут на Node (scripts/check.sh js)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Одна версия правил за выпуск: накопленные работы не поднимают RULES_VERSION дважды до выпуска (ci/rules-step.py). В режиме check-wip
      # шаг идёт раньше, в job guards check-wip.yml: тяжёлые job стартуют после него
      - name: One rules version per release
        if: ${{ needs.resolve.outputs.mode != 'check-wip' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/rules-step.py server
      - name: Content and contract checks
        working-directory: server
        run: bash ../ci/quiet.sh checks bash scripts/check.sh all
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: checks-log

  # Графики панели баланса на настоящем контенте: сервер без базы (scripts/check.sh panel), Chromium обходит разделы с графиками.
  # Ubuntu 24.04 закреплён на всех job'ах: Playwright 1.55 не ставит Chromium на плавающем образе ubuntu-latest (26.04).
  # Отчёт проверки не выкладывается: в нём страницы панели.
  panel:
    needs: resolve
    if: ${{ needs.resolve.outputs.trusted != 'true' && (needs.resolve.outputs.mode == 'push' || needs.resolve.outputs.mode == 'rebuild' || needs.resolve.outputs.mode == 'check-wip') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: server-panel${{ needs.resolve.outputs.mode == 'check-wip' && '-wip' || '' }}
      cancel-in-progress: ${{ needs.resolve.outputs.mode != 'check-wip' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/source
        with:
          repo: ${{ env.SERVER_REPO }}
          sha: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: server
          submodules: 'false'
          persist-credentials: 'false'
          fetch-depth: 0
          java: '21'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Playwright и Chromium - из кэша по версии; системные библиотеки ставятся на каждом прогоне (на чистом раннере их нет).
      # check.sh panel при заданном PANEL_CHECK_PLAYWRIGHT сам ничего не скачивает.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: playwright
        with:
          path: |
            server/build/panel-check/node_modules
            ~/.cache/ms-playwright
          key: playwright-1.55.0-ubuntu-24.04
      - name: Playwright and Chromium
        working-directory: server
        env:
          CACHE_HIT: ${{ steps.playwright.outputs.cache-hit }}
        run: |
          dir=build/panel-check
          if [ "$CACHE_HIT" != true ]; then
            mkdir -p "$dir"
            bash ../ci/retry.sh read npm install --no-save --no-audit --no-fund --prefix "$dir" playwright@1.55.0
            bash ../ci/retry.sh read node "$dir/node_modules/playwright/cli.js" install chromium
          fi
          bash ../ci/retry.sh read node "$dir/node_modules/playwright/cli.js" install-deps chromium
          echo "PANEL_CHECK_PLAYWRIGHT=$PWD/$dir/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Browser check of the panel charts
        working-directory: server
        run: bash ../ci/quiet.sh panel bash scripts/check.sh panel
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: panel-log

  # Совместимость: контрактные тесты самого старого клиента, которого окно ревизий ещё обязано поддерживать (релиз exile-ci с наименьшей
  # версией в окне MIN_API_REVISION..API_REVISION, ci/oldest-client.py), против свежесобранного сервера. Клиент берётся своим коммитом и
  # своим закреплённым сервером (правила в нём прежние), а запускается на сервере этого коммита; его client_server_test.py без правок.
  # Нет релиза в окне - прогон зелёный без дела (старее нового клиента поддерживать нечего).
  compat:
    needs: resolve
    if: ${{ needs.resolve.outputs.trusted != 'true' && (needs.resolve.outputs.mode == 'push' || needs.resolve.outputs.mode == 'rebuild' || needs.resolve.outputs.mode == 'check-wip') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: server-compat${{ needs.resolve.outputs.mode == 'check-wip' && '-wip' || '' }}
      cancel-in-progress: ${{ needs.resolve.outputs.mode != 'check-wip' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Вся история: версию сервера Gradle считает по коммитам
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: server
          persist-credentials: false
          fetch-depth: 0
      - name: Oldest supported client
        id: oldest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          PUBLIC_NOTES: ${{ runner.temp }}/notes.txt
        run: |
          code=0
          bash ci/quiet.sh oldest-client python3 ci/oldest-client.py server/rules/src/main/kotlin/com/sperance/exileforge/rules/wire/Protocol.kt || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code
      - if: ${{ steps.oldest.outputs.tag != '' }}
        uses: ./.github/actions/source
        with:
          sha: ${{ steps.oldest.outputs.tag }}
          token: ${{ secrets.SOURCE_TOKEN }}
          java: '21'
      - name: Start the Mongo image pull
        if: ${{ steps.oldest.outputs.tag != '' }}
        run: (docker pull -q mirror.gcr.io/library/mongo:8.0 >/dev/null 2>&1 || true) &
      - name: Build the new server
        if: ${{ steps.oldest.outputs.tag != '' }}
        working-directory: server
        run: bash ../ci/quiet.sh server-dist bash gradlew installDist
      - if: ${{ steps.oldest.outputs.tag != '' }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      # Тест клиента запускает сервер из src/backend/build/install: кладём туда свежесобранный, а закреплённые исходники клиента не трогаем
      - name: Put the new server where the client test starts it
        if: ${{ steps.oldest.outputs.tag != '' }}
        run: |
          mkdir -p src/backend/build/install
          rm -rf src/backend/build/install/ktor-bestgame
          cp -r server/build/install/ktor-bestgame src/backend/build/install/ktor-bestgame
      - if: ${{ steps.oldest.outputs.tag != '' }}
        uses: ./.github/actions/mongo
      - name: Contract tests of the oldest supported client
        if: ${{ steps.oldest.outputs.tag != '' }}
        working-directory: src
        run: |
          [ -f scripts/client_server_test.py ] || { echo "::notice::the oldest client has no scripts/client_server_test.py: compat check skipped"; exit 0; }
          bash ../ci/quiet.sh compat python3 scripts/client_server_test.py
      - name: Seal reports
        if: ${{ always() && steps.oldest.outputs.tag != '' }}
        working-directory: src
        run: bash ../ci/seal.sh ../sealed/compat.enc core/build/reports/tests core/build/test-results build/client-server.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: compat-reports
          path: |
            sealed/compat.enc
            logs
          if-no-files-found: ignore

  # Образ: пуш, rebuild и Check wip (он выкатывает тест на этот образ). Пуш, чей образ уже собран и помечен Check wip на том же sha, берёт его готовым.
  image:
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'push' || needs.resolve.outputs.mode == 'rebuild' || needs.resolve.outputs.mode == 'check-wip' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: server-image${{ needs.resolve.outputs.mode == 'check-wip' && '-wip' || '' }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image already built by Check wip
        id: existing
        env:
          MODE: ${{ needs.resolve.outputs.mode }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          [ "$MODE" = push ] || exit 0
          if digest=$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{.Manifest.Digest}}' 2>/dev/null) && [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "image of ${SHA:0:12} is already built and checked: no rebuild"
          fi
      # Вся история: patch версии - число коммитов после правки server-version, плюс список изменений в метке образа
      - if: steps.existing.outputs.digest == ''
        uses: ./.github/actions/source
        with:
          repo: ${{ env.SERVER_REPO }}
          sha: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: server
          submodules: 'false'
          persist-credentials: 'false'
          fetch-depth: 0
          java: '21'
      # buildkit - с зеркала Google: Docker Hub отвечал таймаутом и toomanyrequests
      - if: steps.existing.outputs.digest == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
      # Метаданные и сборка - одним шагом: список коммитов (метка образа) не попадает ни в env шага, ни в команду в журнале.
      # Одинаковые библиотеки дают одинаковый слой (время файлов обнулено): VPS докачивает только слой app.
      - name: Build and push the image
        if: steps.existing.outputs.digest == ''
        id: build
        working-directory: server
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
          SOURCE_DATE_EPOCH: 0
        run: |
          bash ../ci/quiet.sh layout bash gradlew dockerLayers
          # Версию посчитал Gradle из git (server-version.properties) - та же, что сервер отдаёт в манифесте.
          SERVER_VERSION=$(sed -n 's/^version=//p' build/generated/serverVersion/server-version.properties)
          [[ -n $SERVER_VERSION && $SERVER_VERSION != *-dev ]] || { echo "::error::server version not resolved from git history"; exit 1; }
          API_REVISION=$(sed -nE 's/^const val API_REVISION = ([0-9]+)/\1/p' rules/src/main/kotlin/com/sperance/exileforge/rules/wire/Protocol.kt)
          CHANGELOG=$(git log --format='%h %s' -30 | base64 -w0)
          REVISION=$SHA
          export SERVER_VERSION API_REVISION CHANGELOG REVISION
          echo "server $SERVER_VERSION, API $API_REVISION"
          bash ../ci/quiet.sh image docker buildx build . --provenance=false \
            --metadata-file "$RUNNER_TEMP/build-meta.json" \
            --output "type=image,name=$IMAGE:build-$SHA,push=true,rewrite-timestamp=true" \
            --build-arg REVISION --build-arg SERVER_VERSION --build-arg API_REVISION --build-arg CHANGELOG
          # Дайджест собранного манифеста: деплой ставит образ по нему, а не по изменяемому тегу
          digest=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "$RUNNER_TEMP/build-meta.json")
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::image digest not found in the build metadata"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: image-log

  # Метка «проверен» на образ: после зелёных проверок, проверки панели, совместимости со старейшим клиентом окна и образа. Пуш на этом
  # заканчивается (деплой - с выпуском клиента); деплой по голове ветки берёт только помеченный образ.
  # Check wip метит только :<sha> (тег ветки - у головы рабочей ветки, его ставит пуш того же sha).
  mark:
    needs: [ resolve, checks, panel, compat, image ]
    if: ${{ !cancelled() && (needs.resolve.outputs.mode == 'push' || needs.resolve.outputs.mode == 'rebuild' || needs.resolve.outputs.mode == 'check-wip') && (needs.resolve.outputs.trusted == 'true' || (needs.checks.result == 'success' && needs.panel.result == 'success' && needs.compat.result == 'success')) && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: mark
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      MODE: ${{ needs.resolve.outputs.mode }}
      PUSHED_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Тег указывает ровно на собранный манифест, без пересборки и перекачки слоёв; --prefer-index=false - а не на новый индекс вокруг
      # него (иначе дайджест тега не совпал бы с собранным).
      - name: Mark the image as checked
        run: |
          . ci/branches.env
          [[ $PUSHED_DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest from the image job"; exit 1; }
          tags=(-t "$IMAGE:$SHA")
          [ "$MODE" = check-wip ] || tags+=(-t "$IMAGE:${SERVER_BRANCH//\//-}")
          docker buildx imagetools create --prefer-index=false "${tags[@]}" "$IMAGE@$PUSHED_DIGEST" >/dev/null

  # Деплой: режим deploy (релиз клиента или вручную) - сразу, по голове ветки; режим rebuild - после метки образа этого прогона.
  # Пуш (режим push) не выкатывает.
  deploy:
    needs: [ resolve, image, mark ]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.resolve.outputs.mode == 'deploy' || (needs.resolve.outputs.mode == 'rebuild' && needs.mark.result == 'success')) }}
    runs-on: ubuntu-24.04
    # Включает ожидание постов в Telegram (telegram-important, telegram-server-notes)
    timeout-minutes: 30
    outputs:
      deployed: ${{ steps.client.outputs.ready == 'true' }}
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      # Тег server-deployed/<sha>
      contents: write
      packages: write
      # Запуск постов (telegram-important.yml, telegram-server-notes.yml)
      actions: write
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ inputs.version }}
      # Дайджест, который собрал job `image` этого прогона (режим push); в режиме deploy пуст - берётся у проверенного тега ниже
      PUSHED_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Деплою нужны только Protocol.kt (API_REVISION, MIN_API_REVISION) и Content.kt (RULES_VERSION, CONTENT_SCHEMA) правил; история
      # без содержимого файлов - для выбора проверенного образа (ci/checked-image.sh)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: server
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            rules/src/main/kotlin/com/sperance/exileforge/rules/wire/Protocol.kt
            rules/src/main/kotlin/com/sperance/exileforge/rules/content/Content.kt
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Запуск от релиза клиента: голова ветки выкатывается, только если её образ уже проверен. Пуш, где менялись только .md вне
      # образа, CI не проверяет: тогда выкатывается образ ближайшего проверенного предка - код тот же. Нет и его - пуш ещё в работе
      # или проверки красные: выкат - Release → server-rebuild.
      - name: Checked image of the branch head
        id: image
        run: |
          if found=$(bash ci/checked-image.sh "$IMAGE" server "$SHA"); then
            read -r commit digest <<<"$found"
            [[ -z $PUSHED_DIGEST || $commit != "$SHA" || $PUSHED_DIGEST == "$digest" ]] || { echo "::error::the checked tag no longer points at the image built by this run"; exit 1; }
            [[ $commit == "$SHA" ]] || echo "only notes changed after $commit: its checked image goes out"
            { echo "ready=true"; echo "digest=$digest"; echo "sha=$commit"; } >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no checked image for $SHA: its push run has not finished or failed; after fixing use Release -> server-rebuild"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Сервер не встаёт раньше клиента (1.81.5): новый API_REVISION уезжает на VPS только когда опубликован релиз
      # клиента, который на нём говорит (update.json последнего релиза exile-ci). Нет релиза - прогон зелёный без
      # деплоя: его запустит job `release` клиента. Несколько попыток - ссылка latest после публикации догоняет не сразу.
      - name: Client release on this API
        id: client
        if: ${{ steps.image.outputs.ready == 'true' }}
        env:
          LATEST: https://github.com/Sperance/exile-ci/releases/latest/download/update.json
        run: |
          api=$(sed -nE 's/^const val API_REVISION = ([0-9]+)/\1/p' server/rules/src/main/kotlin/com/sperance/exileforge/rules/wire/Protocol.kt)
          [[ -n $api ]] || { echo "::error::API_REVISION not found"; exit 1; }
          for attempt in 1 2 3 4 5; do
            client=$(bash ci/retry.sh read curl -fsSL "$LATEST" | python3 -c 'import json, sys; print(json.load(sys.stdin)["apiRevision"])' || echo 0)
            if (( client >= api )); then
              echo "client release speaks API $client, server $api: deploying"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "::notice::client release speaks API $client, server needs $api: the client release job triggers the deploy"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      # Сервер не отрезает сборку, что ещё лежит в канале магазина (ci/deploy-guard.py): иначе игрок магазина не сможет играть, пока
      # обновление идёт модерацию. Красный шаг - деплоя нет; одобренный разрыв - запуск вручную с force_breaking.
      - name: Store channels can play this server
        if: ${{ steps.client.outputs.ready == 'true' }}
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          FORCE_BREAKING: ${{ inputs.force_breaking }}
          GITHUB_TOKEN: ${{ github.token }}
          PUBLIC_NOTES: ${{ runner.temp }}/guard.txt
        run: |
          code=0
          bash ci/quiet.sh deploy-guard python3 ci/deploy-guard.py server || code=$?
          cat "$PUBLIC_NOTES" 2>/dev/null || true
          exit $code

      - name: Update the server on the VPS
        if: ${{ steps.client.outputs.ready == 'true' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
          REPORTS_WORK_TOKEN: ${{ secrets.REPORTS_WORK_TOKEN }}
          REPORTS_RELAY_TOKEN: ${{ steps.relay.outputs.relay }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          [[ $GOOGLE_WEB_CLIENT_ID =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::malformed GOOGLE_WEB_CLIENT_ID variable"; exit 1; }
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest to deploy"; exit 1; }
          [[ $IMAGE_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit of the image to deploy"; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          # Ключ на VPS привязан к одной команде (update.sh без вопросов): её код выхода - итог деплоя.
          # Строка команды доходит до update.sh как SSH_ORIGINAL_COMMAND - из неё он берёт sha коммита и дайджест образа:
          # образ тянется по неизменяемому @sha256, а не по тегу, и его метка sha сверяется с коммитом.
          # Токен GitHub Issues (0.14.1, GH-ISSUES) - первой строкой stdin, ключи очереди отчётов REPORTS_WORK_TOKEN и REPORTS_RELAY_TOKEN - второй и третьей: в строку команды и журналы они не попадают.
          printf '%s\n%s\n%s\n%s\n' "$GH_ISSUES_TOKEN" "$REPORTS_WORK_TOKEN" "$REPORTS_RELAY_TOKEN" "$GOOGLE_WEB_CLIENT_ID" | VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/quiet.sh deploy \
            bash ci/vps-ssh.sh "deploy $IMAGE_SHA $DIGEST"
      # Отметка выката и Issues серверных коммитов: диапазон - от ближайшего выкаченного предка (тег server-deployed/<sha>) до этого
      # коммита. Прошлый выкат считается до новой отметки. Issues закрывает только выкат сервера без клиента: при выпуске клиента их
      # закрывает job `release` client.yml (метка версии). Нет отметки прошлого выката - Issues не закрываются, отметка ставится.
      - name: Mark the deploy and close the server issues
        if: ${{ steps.client.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUES_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          REPORTS_API_URL: ${{ vars.SERVER_URL }}
          REPORTS_WORK_TOKEN: ${{ secrets.REPORTS_WORK_TOKEN }}
        run: |
          bash ci/retry.sh read gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/server-deployed/" --paginate --jq '.[].ref' > "$RUNNER_TEMP/deployed.txt"
          base=$(python3 -I ci/release_state.py baseline --srv server --head "$SHA" --deployed "$RUNNER_TEMP/deployed.txt")
          if [ -z "$VERSION" ] && [ -n "$ISSUES_TOKEN" ]; then
            GH_TOKEN=$ISSUES_TOKEN bash ci/close-server-issues.sh Sperance/ExileForge server "$base" "$SHA" || echo "::warning::server issues were not closed"
          fi
          bash ci/retry.sh idem gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/server-deployed/$SHA" -f sha="$GITHUB_SHA" >/dev/null || echo "::notice::deploy mark already exists"
      # Новый текст IMPORTANT.md выложенного сервера - пост в тему «Важное» группы Telegram (telegram-important.yml); после выпуска клиента
      # заголовок несёт его версию. Выкат сервера без клиента - ещё и пост новых пунктов «[сервер]» заметок (telegram-server-notes.yml).
      - name: Announce the important news
        if: ${{ steps.client.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_WAIT_SOFT: '1'
        run: |
          bash ci/dispatch-wait.sh telegram-important.yml main -f sha="$SHA" -f version="$VERSION"
          [ -n "$VERSION" ] || bash ci/dispatch-wait.sh telegram-server-notes.yml main
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: deploy-log

      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key"

  # Тестовый сервер: образ закреплённого в клиенте sha уже собран и помечен «проверен» пушем сервера (job `mark`); здесь он только выкатывается
  # во второй проект VPS. Пуш сервера мог ещё идти - образ ждём до 12 минут. Проверок совместимости, защиты каналов магазинов и отметки выката
  # (server-deployed/<sha>, Issues, посты) нет: тест идёт впереди выпуска, боевой путь деплоя выше не затронут.
  deploy-test:
    needs: resolve
    if: ${{ needs.resolve.outputs.mode == 'deploy-test' && vars.TEST_SERVER_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      first: ${{ steps.record.outputs.first }}
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    permissions:
      # Запись о выкате - новый prerelease stand-<UTC> (ci/test-stand.sh)
      contents: write
      packages: read
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ env.SERVER_REPO }}
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.SOURCE_TOKEN }}
          path: server
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            rules/src/main/kotlin/com/sperance/exileforge/rules/wire/Protocol.kt
            deploy/update.sh
            deploy/test/compose.yaml
            deploy/test/compose.override.yaml
            deploy/test/verify.sh
            deploy/test/mongo-health.js
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Checked image of the pinned server
        id: image
        run: |
          for attempt in $(seq 1 12); do
            if found=$(bash ci/checked-image.sh "$IMAGE" server "$SHA"); then
              read -r commit digest <<<"$found"
              { echo "digest=$digest"; echo "sha=$commit"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "no checked image for ${SHA:0:12} yet (attempt $attempt of 12)"
            sleep 60
          done
          echo "::error::no checked image for the pinned server ${SHA:0:12}: its push run has not finished or failed; after fixing use Release -> server-rebuild"
          exit 1
      # Версия сервера теста (#1084): x.y.z_test = версия сервера, выкаченного на бой последним (метка образа коммита из метки server-deployed/<sha>), + k patch;
      # k - порядковый номер тестового обновления сервера после того выката (ci/test-stand.py version: другой образ - k записи о прошлом выкате теста + 1, тот же
      # образ - то же число, новый выкат боя - 1). Нет метки выката боя или образа - живой манифест боя, нет и его - версия образа с предупреждением, но не красное.
      # Логика в ci/test-server-version.sh: тот же файл гоняет сухой прогон check-wip.yml (job deploy-test-dry), чтобы они не разошлись.
      - name: Test server version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: bash ci/test-server-version.sh version server "$SHA" "${{ steps.image.outputs.sha }}" "$GITHUB_OUTPUT"
      # Файлы стенда теста (update.sh, compose, verify, mongo-health) CI кладёт сам ДО выката: ключ теста привязан к update.sh, и команда stand-files принимает
      # только архив с точным списком имён и сверенным sha256 (ci/stand-files.sh, сторож ci/guard-test-version.py). Старый update.sh теста команду отвергает -
      # предупреждение «нужна разовая установка», выкат идёт дальше. Содержимое файлов в журнал не выводится.
      - name: Refresh the test stand files
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY_TEST }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          [[ -n $HOST && -n $KEY ]] || { echo "::error::DEPLOY_HOST or DEPLOY_SSH_KEY_TEST is not set"; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/stand-files.sh send server
      # Ключ релея отчётов бой может не принимать (релей живёт на бое, и боевой образ бывает старше маршрута). Проверка - настоящим ключом:
      # ответ с кодом RQ_/BUG_ значит релей живой, AUTH_/RQ_002 - ключ отвергнут. Отвергнут - в третье слово stdin уходит `-`,
      # и update.sh очищает ключ: тест ходит в GitHub напрямую (GH_ISSUES_TOKEN), проверки не слепнут. Сторож - job health в vps.yml.
      - name: The report relay answers this key
        id: relay
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
          REPORTS_RELAY_TOKEN: ${{ secrets.REPORTS_RELAY_TOKEN }}
        run: |
          if [[ -z $REPORTS_RELAY_TOKEN ]]; then
            echo "relay=-" >> "$GITHUB_OUTPUT"
            echo "- релей отчётов: ключ не задан, тест идёт в GitHub напрямую" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body=$(bash ci/retry.sh read curl -sS --max-time 20 -X POST -H "Authorization: Bearer $REPORTS_RELAY_TOKEN" -H 'Content-Type: application/json' \
            -d '{"op":"ISSUE","number":1}' "${SERVER_URL%/}/api/v1/reports-relay" || true)
          if printf '%s' "$body" | grep -qE '"errorCode":"(RQ_|BUG_)'; then
            echo "relay=$REPORTS_RELAY_TOKEN" >> "$GITHUB_OUTPUT"
            echo "- релей отчётов: бой принимает ключ" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "relay=-" >> "$GITHUB_OUTPUT"
            echo "::warning::the prod server does not accept the report relay key: the test stand goes to GitHub directly (no relay)"
            echo "- релей отчётов: **бой не принимает ключ** — тест идёт в GitHub напрямую" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Update the test server on the VPS
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY_TEST }}
          GH_ISSUES_TOKEN: ${{ secrets.GH_ISSUES_TOKEN }}
          REPORTS_WORK_TOKEN: ${{ secrets.REPORTS_WORK_TOKEN }}
          REPORTS_RELAY_TOKEN: ${{ steps.relay.outputs.relay }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          TEST_VERSION: ${{ steps.version.outputs.name }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          [[ -n $HOST && -n $KEY ]] || { echo "::error::DEPLOY_HOST or DEPLOY_SSH_KEY_TEST is not set"; exit 1; }
          [[ $GOOGLE_WEB_CLIENT_ID =~ ^[A-Za-z0-9._-]*$ ]] || { echo "::error::malformed GOOGLE_WEB_CLIENT_ID variable"; exit 1; }
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image digest to deploy"; exit 1; }
          [[ $IMAGE_SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::no commit of the image to deploy"; exit 1; }
          [[ -z $TEST_VERSION || $TEST_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+_test$ ]] || { echo "::error::malformed test server version"; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          # Ключ теста на VPS привязан к update.sh проекта /opt/exileforge-test: боевую установку эта команда достать не может.
          # Третье слово - показываемая версия теста: update.sh кладёт её в .env как TEST_SERVER_VERSION. update.sh на VPS, ещё не знающий
          # третьего слова, отвергает команду: тогда выкат идёт прежней командой из двух слов, а сводка просит обновить update.sh теста.
          if ! printf '%s\n%s\n%s\n%s\n' "$GH_ISSUES_TOKEN" "$REPORTS_WORK_TOKEN" "$REPORTS_RELAY_TOKEN" "$GOOGLE_WEB_CLIENT_ID" | VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/quiet.sh deploy-test \
            bash ci/vps-ssh.sh "deploy $IMAGE_SHA $DIGEST${TEST_VERSION:+ $TEST_VERSION}"; then
            echo "::warning::deploy with the test version failed - retrying without it; update update.sh and compose.yaml of the test stand from deploy/test"
            printf '%s\n%s\n%s\n%s\n' "$GH_ISSUES_TOKEN" "$REPORTS_WORK_TOKEN" "$REPORTS_RELAY_TOKEN" "$GOOGLE_WEB_CLIENT_ID" | VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/quiet.sh deploy-test-legacy \
              bash ci/vps-ssh.sh "deploy $IMAGE_SHA $DIGEST"
          fi
      # Список Issue тестовой сборки идёт на тест тем же защищённым путём, что и выкат (ci/test-build.sh): сервер теста не зависит от чтения GitHub.
      # Нет номера сборки (ручной выкат) - шаг ничего не делает; старый update.sh теста команду отвергает - предупреждение, не провал.
      - name: Send the test build issues to the test server
        if: ${{ inputs.qa_tag != '' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          READ_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          QA_TAG: ${{ inputs.qa_tag }}
          CLIENT_REPO: Sperance/ExileForge
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
        run: |
          if ! GH_TOKEN="$READ_TOKEN" bash ci/retry.sh read gh api "repos/$CLIENT_REPO/releases/tags/$QA_TAG" --jq '.body // ""' > "$RUNNER_TEMP/qa-body.txt"; then
            echo "::warning::the release $QA_TAG of the client could not be read: the test server reads the issue list from GitHub itself"
            exit 0
          fi
          VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/test-build.sh send "$QA_TAG" "$RUNNER_TEMP/qa-body.txt"
      # Что стоит на тесте: Release читает эту запись (клиент выпускается, только если его голова уже на стенде). Пишется только после удачного
      # выката. Нет записи до этого выката - выкат первый, job `test-base` один раз ставит на тест боевой слепок баланса.
      # Выкат теста не увёл адрес боя на тест (общий Caddy, голое имя game ведёт и на тест): index.json боя без поля stand - иначе красное.
      - name: Prod address still serves prod
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: bash ci/prod-route.sh "$SERVER_URL"
      - name: Record the test stand
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_SHA: ${{ inputs.client_sha }}
          QA_TAG: ${{ inputs.qa_tag }}
          IMAGE_SHA: ${{ steps.image.outputs.sha }}
          TEST_BASE: ${{ steps.version.outputs.base }}
          TEST_K: ${{ steps.version.outputs.k }}
          TEST_VERSION: ${{ steps.version.outputs.name }}
        run: |
          code=0
          bash ci/test-stand.sh fetch "$RUNNER_TEMP/previous.json" || code=$?
          first=false
          case $code in 0) ;; 3) first=true ;; *) exit "$code" ;; esac
          bash ci/test-server-version.sh record "$RUNNER_TEMP/stand.json" "$CLIENT_SHA" "$SHA" "$IMAGE_SHA" "$QA_TAG"
          bash ci/test-stand.sh publish "$RUNNER_TEMP/stand.json"
          echo "first=$first" >> "$GITHUB_OUTPUT"
      - name: Keep the ten newest stand records
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/quiet.sh stand-cleanup python3 ci/cleanup.py stand-releases
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: deploy-test-log
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/key"

  # Тестовая сборка публикуется ТОЛЬКО после удачного выката сервера теста: упавший выкат ничего не публикует (клиент теста обновляется принудительно и
  # не должен опередить свой сервер). Файлы собрал и запечатал client.yml (artifact qa-publish его прогона qa_run). Публикуется, пока sha остаётся головой
  # рабочей ветки клиента (более новый пуш ведёт свою сборку, порядок номеров сохраняется); повтор того же тега ничего не публикует. Кроме предрелиза
  # qa-<n> CI ведёт постоянный адрес «последняя тестовая сборка» - предрелиз qa-latest с тем же APK (клиент выбирает qa-<число>, qa-latest он не видит).
  qa-publish:
    needs: [ resolve, deploy-test ]
    if: ${{ !cancelled() && needs.deploy-test.result == 'success' && inputs.qa_tag != '' && inputs.qa_run != '' && inputs.client_sha != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: qa-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ inputs.qa_tag }}
      CLIENT_SHA: ${{ inputs.client_sha }}
      CLIENT_REPO: Sperance/ExileForge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Сборка теста приходит с пуша (голова рабочей ветки клиента) или из Check wip (голова wip клиента): годится голова любой из двух
      - name: Still the head of the working branch or wip
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          . ci/branches.env
          [[ $TAG =~ ^qa-[0-9]+$ ]] || { echo "::error::'$TAG' is not a test build tag"; exit 1; }
          head=$(GH_TOKEN="$HEAD_TOKEN" bash ci/retry.sh read gh api "repos/$CLIENT_REPO/git/ref/heads/$CLIENT_BRANCH" --jq .object.sha)
          wip=$(GH_TOKEN="$HEAD_TOKEN" bash ci/retry.sh read gh api "repos/$CLIENT_REPO/git/ref/heads/$WIP_BRANCH" --jq .object.sha 2>/dev/null || true)
          current=true
          [ "$head" = "$CLIENT_SHA" ] || [ "$wip" = "$CLIENT_SHA" ] || { echo "::warning::${CLIENT_SHA:0:12} is the head of neither the working branch nor wip: a newer push owns the test build, $TAG is not published"; current=false; }
          if bash ci/retry.sh read gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "$TAG is already published"; current=false; fi
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-publish
          run-id: ${{ inputs.qa_run }}
          github-token: ${{ github.token }}
          path: sealed
      - if: steps.head.outputs.current == 'true'
        name: Publish the test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
        run: |
          bash ci/seal.sh -d sealed/qa-publish.enc files
          name=$(python3 -I -c 'import json; print(json.load(open("files/qa/update.json"))["versionName"])')
          code=${TAG#qa-}
          sig=(); [ -s files/qa/update.json.sig ] && sig=(files/qa/update.json.sig)
          bash ci/retry.sh once gh release create "$TAG" files/qa/ExileForge-qa.apk files/qa/update.json "${sig[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "ExileForge test $code" --notes "Test build $name (commit ${CLIENT_SHA:0:7}) for the test server. Newest qa-* wins."
          echo "published $TAG"
          if bash ci/retry.sh read gh release view qa-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            bash ci/retry.sh idem gh release upload qa-latest files/qa/ExileForge-qa.apk files/qa/update.json "${sig[@]}" -R "$GITHUB_REPOSITORY" --clobber
            bash ci/retry.sh idem gh release edit qa-latest -R "$GITHUB_REPOSITORY" --notes "Latest test build: $name ($TAG). The address of this release does not change."
          else
            bash ci/retry.sh once gh release create qa-latest files/qa/ExileForge-qa.apk files/qa/update.json "${sig[@]}" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "ExileForge latest test build" --notes "Latest test build: $name ($TAG). The address of this release does not change."
          fi
          echo "latest test build: $name"
      - if: steps.head.outputs.current == 'true'
        name: Keep the five newest test builds
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ci/quiet.sh qa-cleanup python3 ci/cleanup.py qa-releases
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: qa-publish-log

  # Один раз при первом выкате теста: боевой слепок баланса и текстов клиента - базой теста (update.sh balance-export на бою -> balance-import на тесте).
  # Свои правки теста база не затирает; провал виден красным, повтор - VPS → test-base. Оба ключа VPS - только через действие balance-transfer
  # (сторож ci/guard-test-vps.py).
  test-base:
    needs: deploy-test
    if: ${{ needs.deploy-test.result == 'success' && needs.deploy-test.outputs.first == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: balance-transfer
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/balance-transfer
        with:
          direction: prod-to-test
          host: ${{ secrets.DEPLOY_HOST }}
          prod-key: ${{ secrets.DEPLOY_SSH_KEY }}
          test-key: ${{ secrets.DEPLOY_SSH_KEY_TEST }}
          host-key: ${{ vars.VPS_HOST_KEY }}
          log-recipient: ${{ vars.LOG_AGE_RECIPIENT }}
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: test-base-log

  # Выпуск клиента переносит баланс и тексты клиента теста в бой после выката сервера этого выпуска (вход version). Бой выпускает слепок новой
  # версией баланса (журнал и откат как у панели) и отказывает, если код сервера на тесте и в бою различается - красный прогон, выкат уже
  # состоялся, повторить перенос можно Release → balance. Выпуск мимо теста (вход skip_test) баланс не переносит.
  balance:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' && inputs.version != '' && inputs.skip_test != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: balance-transfer
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/balance-transfer
        with:
          direction: test-to-prod
          host: ${{ secrets.DEPLOY_HOST }}
          prod-key: ${{ secrets.DEPLOY_SSH_KEY }}
          test-key: ${{ secrets.DEPLOY_SSH_KEY_TEST }}
          host-key: ${{ vars.VPS_HOST_KEY }}
          log-recipient: ${{ vars.LOG_AGE_RECIPIENT }}
      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: balance-log

  # Архив кэша Gradle сессий агента собирается под закреплённый в клиенте сервер. Деплой, изменивший файлы сборки сервера, сразу
  # пересобирает архив под голову ветки сервера (client.yml, режим cache с server_head) - сессии не докачивают зависимости.
  refresh-cache:
    needs: [ resolve, deploy ]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    # Включает ожидание client.yml cache (job gradle-cache до 90 минут)
    timeout-minutes: 110
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Compare build files with the client pin
        env:
          TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SHA: ${{ needs.resolve.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          CLIENT_REPO: Sperance/ExileForge
        run: |
          set -a; . ci/branches.env; set +a
          bash ci/quiet.sh clone-sources sh -c 'bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout "https://x-access-token:$TOKEN@github.com/$SERVER_REPO" srv && bash ci/retry.sh read git clone -q --filter=blob:none --no-checkout --branch "$CLIENT_BRANCH" "https://x-access-token:$TOKEN@github.com/$CLIENT_REPO" cli'
          pin=$(git -C cli ls-tree "origin/$CLIENT_BRANCH" backend | awk '{print $3}')
          [[ $pin =~ ^[0-9a-f]{40}$ ]] || { echo "::warning::client pin of backend not found, cache refresh skipped"; exit 0; }
          files() { git -C srv ls-tree -r --name-only "$1" -- '*.gradle.kts' gradle.properties gradle | sort; }
          sums() { files "$1" | while read -r f; do git -C srv show "$1:$f" | sha256sum; done | sha256sum | cut -c1-16; }
          now=$(sums "$SHA"); old=$(sums "$pin")
          if [ "$now" = "$old" ]; then echo "build files unchanged since the client pin: archive stays"; exit 0; fi
          echo "server build files changed since the client pin: client.yml cache starts with the server head"
          bash ci/dispatch-wait.sh client.yml main -f mode=cache -f server_head=true
