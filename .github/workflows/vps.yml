# Обслуживание сервера на VPS, копии базы и картинки игры (правила - rules-md/server/vps-maintenance.md и ci-shell.md сервера).
# Команды update.sh (job `run`): по SSH-ключу деплоя с принудительной командой уходит одно слово, update.sh принимает только точные
# команды: status, logs [N], restart, backup (суточная копия базы, 7 на VPS), prune (чистка Docker и журналов), upgrade и reboot
# (простой игры - только в окне 01:00-03:00 UTC, вне окна update.sh ставит их таймером на ближайшее окно).
# health (каждый час): только сообщает - Issue «[VPS] Сервер требует внимания» в ExileForge (ci/vps_health.py), ничего не чинит.
# db-export (воскресенье): свежая суточная копия, зашифрованная age (ключ владельца и ключ SEAL для восстановления), - в prerelease
# db-<дата> закрытого ExileForge, 4 последних. restore: копия с VPS или недельная - только ручным запуском владельца,
# update.sh перед ним снимает свежую копию. repo-mirror (понедельник): git bundle трёх репозиториев - на VPS, 4 последних.
# Журнал публичен: хост и весь вывод сервера - только в зашифрованном артефакте `vps-<команда>` (age, открытый ключ
# vars.LOG_AGE_RECIPIENT, 7 дней; читать: age -d -i key.txt), в журнал - итог шага. SSH идёт через ci/vps-ssh.sh: ключ хоста
# закреплён в vars.VPS_HOST_KEY, StrictHostKeyChecking=yes. Секреты: DEPLOY_HOST, DEPLOY_SSH_KEY; переменные: VPS_HOST_KEY,
# LOG_AGE_RECIPIENT.
#
# art (job `art`) - архив картинок игры:
# Архив картинок игры - свой prerelease `art-<дата UTC>` на каждый архив: релизы репозитория неизменяемы (immutable), в
# выложенный релиз файл уже не добавить, поэтому архив кладётся при создании релиза. `update.sh art` сервера без ссылки берёт
# самый новый такой релиз. Картинки приходят папкой `art/<категория>/<КОД>.png|jpg|jpeg|webp` с ветки [ref] этого же
# репозитория (обычно черновик `wip` поверх `main`); архив - те же пути без `./`, имя `art-<дата UTC>.tar.gz`. Хранятся пять
# последних релизов архивов. Затем (вход deploy, по умолчанию да) архив сразу ставится на сервер: по SSH-ключу деплоя с
# принудительной командой уходит строка `art`, и update.sh сервера берёт самый новый релиз art-<дата> (ссылку из сети он
# не принимает). Ручного шага нет; новое сервер подхватывает за минуту.
# Картинки с тем же кодом, загруженные из панели, архив перезапишет: прежний файл остаётся на сервере в .trash/<дата>/<категория>/,
# но откат панели его не вернёт (журнал панели о .trash не знает) - вернуть можно только вручную.
# Секреты (только для deploy): DEPLOY_HOST, DEPLOY_SSH_KEY; переменные VPS_HOST_KEY, LOG_AGE_RECIPIENT.
#
# art-backup (job `art-backup`) - резервная копия картинок сервера (запускается и по расписанию, и командой art-backup):
# Раз в сутки (cron ниже) и вручную. Картинки грузятся из панели прямо в папку сервера, поэтому
# копия снимается с сервера: по SSH-ключу деплоя с принудительной командой уходит строка `art-export`, update.sh сервера
# отдаёт архив исходных файлов `<категория>/<КОД>.<ext>` (без .out и .trash) в stdout. Архив выходит своим prerelease
# `art-<дата UTC>` (релизы неизменяемы, файл кладётся при создании) - тот же вид, что у команды art, поэтому `update.sh art`
# восстанавливает из самой новой копии. Хранятся пять последних релизов art-<дата> (общий счёт с командой art).
# Журнал публичен: хост и вывод сервера идут через ci/quiet.sh; картинки и так видит каждый игрок.
# Секреты: DEPLOY_HOST, DEPLOY_SSH_KEY; переменные VPS_HOST_KEY, LOG_AGE_RECIPIENT.
name: VPS

on:
  schedule:
    - cron: '27 3 * * *'   # art-backup
    - cron: '17 * * * *'   # health
    - cron: '35 0 * * *'   # backup
    - cron: '50 0 * * 0'   # db-export
    - cron: '10 1 * * 1'   # repo-mirror
  workflow_dispatch:
    inputs:
      command:
        description: 'update.sh on the server (rules-md/server/vps-maintenance.md): status, logs, restart, health, backup, prune, upgrade, reboot; db-export - weekly encrypted DB copy into an ExileForge release; restore - DB from a copy (owner approval); art, art-backup - pictures'
        type: choice
        options: [ status, logs, restart, health, backup, prune, upgrade, reboot, db-export, restore, repo-mirror, art, art-backup ]
        default: status
      restore_from:
        description: 'restore: a copy on the VPS (daily|deploy|pre/db-YYYYMMDD-HHMMSS.archive.gz, see status) or a weekly release tag db-YYYYMMDD-HHMMSS'
        type: string
        default: ''
      lines:
        description: 'logs: how many last lines (1-5000)'
        type: number
        default: 300
      ref:
        description: 'art: branch of this repository whose art/ folder becomes the archive'
        type: string
        default: wip
      deploy:
        description: 'art: install the archive on the server right after publishing'
        type: boolean
        default: true

permissions:
  contents: read

env:
  KEEP: 5

# Расписания: art-backup (03:27), health (каждый час), backup (00:35), db-export (вс 00:50) - inputs при них пусты, поэтому выбор
# job'а - по github.event.schedule и inputs.command.
jobs:
  run:
    if: ${{ (github.event_name == 'workflow_dispatch' && contains(fromJSON('["status","logs","restart","backup","prune","upgrade","reboot"]'), inputs.command)) || github.event.schedule == '35 0 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run on the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
          COMMAND: ${{ inputs.command || 'backup' }}
          LINES: ${{ inputs.lines }}
        run: |
          [[ -n $HOST && -n $KEY && -n $LOG_AGE_RECIPIENT ]] || { echo '::error::DEPLOY_HOST, DEPLOY_SSH_KEY or LOG_AGE_RECIPIENT is not set'; exit 1; }
          case $COMMAND in
            status|restart|backup|prune|upgrade|reboot) line=$COMMAND ;;
            logs) [[ $LINES =~ ^[0-9]{1,4}$ ]] && ((LINES >= 1)) || { echo '::error::lines must be 1-5000'; exit 1; }; line="logs $LINES" ;;
            *) echo '::error::unknown command'; exit 1 ;;
          esac
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          mkdir -p logs
          code=0
          VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/vps-ssh.sh "$line" </dev/null >"$RUNNER_TEMP/out.txt" 2>&1 || code=$?
          rm -f "$RUNNER_TEMP/key"
          # Вывод сервера - всегда в зашифрованный журнал, при любом исходе
          bash ci/encrypt-log.sh "$RUNNER_TEMP/out.txt" "logs/vps-$COMMAND.log.enc"
          rm -f "$RUNNER_TEMP/out.txt"
          echo "vps $COMMAND: exit $code"
          exit $code

      - name: Encrypted output
        if: always()
        uses: ./.github/actions/upload-log
        with:
          name: vps-${{ inputs.command || 'backup' }}

  art:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.command == 'art' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: art
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check the layout
        run: |
          [[ -d art ]] || { echo '::error::no art/ folder on this ref'; exit 1; }
          bad=0
          while IFS= read -r -d '' entry; do
            path=${entry#art/}
            if [[ -L $entry || ! -f $entry || ! $path =~ ^[a-z]+/[A-Z0-9_]+\.([pP][nN][gG]|[jJ][pP][eE]?[gG]|[wW][eE][bB][pP])$ ]]; then
              echo "::error::unexpected entry: $path"
              bad=1
            fi
          done < <(find art -mindepth 1 ! -type d -print0)
          ((bad == 0)) || exit 1
          find art -type f | sort

      - name: Pack
        id: pack
        run: |
          stamp=$(date -u +%Y%m%d-%H%M%S)
          asset="art-$stamp.tar.gz"
          (cd art && find . -type f | sed 's|^\./||' | sort | tar -czf "$RUNNER_TEMP/$asset" -T -)
          tar -tzf "$RUNNER_TEMP/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "tag=art-$stamp" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.pack.outputs.asset }}
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          # Файл отдаётся вместе с созданием: gh создаёт черновик, грузит архив и только потом публикует
          gh release create "$TAG" "$RUNNER_TEMP/$ASSET" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Art $TAG" --notes 'Game pictures for update.sh art on the server. Newest release wins.'
          # Старые архивы - целыми релизами: тег неизменяемого релиза может остаться, это не мешает
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | grep -E '^art-[0-9]{8}-[0-9]{6}$' | sort -r \
            | tail -n +$((KEEP + 1)) | while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" -y || true; done
          echo "published $TAG"

      - name: Install on the server
        if: ${{ inputs.deploy }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
        run: |
          [[ -n $HOST && -n $KEY ]] || { echo '::error::DEPLOY_HOST or DEPLOY_SSH_KEY is not set: install the archive with update.sh art by hand'; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          # Хост и вывод сервера - не в публичный журнал: ci/quiet.sh печатает только итог, подробности - в зашифрованном журнале
          code=0
          VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/quiet.sh art-install bash ci/vps-ssh.sh art </dev/null || code=$?
          rm -f "$RUNNER_TEMP/key"
          exit $code

      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: art-log

  art-backup:
    if: ${{ (github.event.schedule == '27 3 * * *' || inputs.command == 'art-backup') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: art
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Export from the server
        id: export
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
        run: |
          [[ -n $HOST && -n $KEY ]] || { echo '::error::DEPLOY_HOST or DEPLOY_SSH_KEY is not set'; exit 1; }
          install -m 600 /dev/null "$RUNNER_TEMP/key" && printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          stamp=$(date -u +%Y%m%d-%H%M%S)
          archive="$RUNNER_TEMP/art-$stamp.tar.gz"
          code=0
          VPS_HOST=$HOST VPS_KEY_FILE="$RUNNER_TEMP/key" bash ci/quiet.sh art-export bash -c 'bash ci/vps-ssh.sh art-export </dev/null >"$1"' \
            _ "$archive" || code=$?
          rm -f "$RUNNER_TEMP/key"
          ((code == 0)) || exit $code
          # Только обычные файлы <категория>/<КОД>.<ext>: иначе копия не годится для update.sh art
          tar -tzf "$archive" | grep -vqE '^[a-z]+/([A-Z0-9_]+\.(png|jpg|jpeg|webp|PNG|JPG|JPEG|WEBP))?$' && { echo '::error::unexpected entry in the server archive'; exit 1; }
          count=$(tar -tzf "$archive" | grep -c '\.' || true)
          echo "server archive: $count pictures"
          ((count > 0)) || { echo '::notice::the server has no uploaded pictures yet, nothing to keep'; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "tag=art-$stamp" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: ${{ steps.export.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.export.outputs.archive }}
          TAG: ${{ steps.export.outputs.tag }}
        run: |
          gh release create "$TAG" "$ARCHIVE" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Art $TAG (server backup)" --notes 'Daily copy of the server pictures. update.sh art restores the newest art release.'
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName -q '.[].tagName' | grep -E '^art-[0-9]{8}-[0-9]{6}$' | sort -r \
            | tail -n +$((KEEP + 1)) | while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" -y || true; done
          echo "published $TAG"

      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: art-backup-log

  # Часовой присмотр: только сообщает (Issue «[VPS] Сервер требует внимания» в ExileForge, ci/vps_health.py), ничего не чинит
  health:
    if: ${{ (github.event.schedule == '17 * * * *' || inputs.command == 'health') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vps-health
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check the server
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
          EXILEFORGE_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n $HOST && -n $KEY && -n $EXILEFORGE_TOKEN ]] || { echo '::error::DEPLOY_HOST, DEPLOY_SSH_KEY or EXILEFORGE_TOKEN is not set'; exit 1; }
          tmp=${RUNNER_TEMP:?}
          install -m 600 /dev/null "$tmp/key" && printf '%s\n' "$KEY" > "$tmp/key"
          mkdir -p logs
          code=0
          VPS_HOST=$HOST VPS_KEY_FILE="$tmp/key" timeout 300 bash ci/vps-ssh.sh health </dev/null >"$tmp/out.txt" 2>&1 || code=$?
          rm -f "$tmp/key"
          python3 ci/vps_health.py "$tmp/out.txt" "$code"
          bash ci/encrypt-log.sh "$tmp/out.txt" logs/vps-health.log.enc
          rm -f "$tmp/out.txt"

      - name: Encrypted output
        if: always()
        uses: ./.github/actions/upload-log
        with:
          name: vps-health

  # Недельная копия базы вне VPS: самая свежая суточная копия, зашифрованная age на ключ владельца (LOG_AGE_RECIPIENT) и ключ
  # CI для восстановления (SEAL_AGE_RECIPIENT), - в prerelease db-<дата UTC> закрытого ExileForge; хранятся 4 последних
  db-export:
    if: ${{ (github.event.schedule == '50 0 * * 0' || inputs.command == 'db-export') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vps-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Export, encrypt and publish
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
          SEAL_AGE_RECIPIENT: ${{ vars.SEAL_AGE_RECIPIENT }}
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
        run: |
          [[ -n $HOST && -n $KEY && -n $GH_TOKEN ]] || { echo '::error::DEPLOY_HOST, DEPLOY_SSH_KEY or EXILEFORGE_TOKEN is not set'; exit 1; }
          [[ $LOG_AGE_RECIPIENT =~ ^age1 && $SEAL_AGE_RECIPIENT =~ ^age1 ]] || { echo '::error::LOG_AGE_RECIPIENT and SEAL_AGE_RECIPIENT are required'; exit 1; }
          . ci/crypt.sh; ensure_age
          tmp=${RUNNER_TEMP:?}
          install -m 600 /dev/null "$tmp/key" && printf '%s\n' "$KEY" > "$tmp/key"
          stamp=$(date -u +%Y%m%d-%H%M%S)
          code=0
          VPS_HOST=$HOST VPS_KEY_FILE="$tmp/key" bash ci/quiet.sh db-export bash -c 'bash ci/vps-ssh.sh backup-export </dev/null >"$1"' \
            _ "$tmp/db.archive.gz" || code=$?
          rm -f "$tmp/key"
          ((code == 0)) || exit $code
          gzip -t "$tmp/db.archive.gz" || { rm -f "$tmp/db.archive.gz"; echo '::error::the copy from the server is not a gzip archive'; exit 1; }
          age -r "$LOG_AGE_RECIPIENT" -r "$SEAL_AGE_RECIPIENT" -o "$tmp/db-$stamp.archive.gz.age" "$tmp/db.archive.gz"
          rm -f "$tmp/db.archive.gz"
          gh release create "db-$stamp" "$tmp/db-$stamp.archive.gz.age" -R Sperance/ExileForge --prerelease --latest=false \
            --title "DB db-$stamp" --notes 'Weekly encrypted copy of the game databases (age). Restore: workflow VPS in exile-ci, command restore.'
          rm -f "$tmp/db-$stamp.archive.gz.age"
          gh release list -R Sperance/ExileForge --limit 200 --json tagName -q '.[].tagName' | grep -E '^db-[0-9]{8}-[0-9]{6}$' | sort -r \
            | tail -n +5 | while read -r old; do gh release delete "$old" -R Sperance/ExileForge -y --cleanup-tag || true; done
          echo "published db-$stamp"

      - name: Encrypted log
        if: failure()
        uses: ./.github/actions/upload-log
        with:
          name: db-export-log

  # Восстановление базы: только ручным запуском владельца; перед ним update.sh сам
  # снимает свежую копию в backups/pre. Источник - копия на VPS или недельный релиз db-<дата> (CI расшифровывает его ключом SEAL).
  restore:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.command == 'restore' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vps-db
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore the databases
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
          SEAL_AGE_IDENTITY: ${{ secrets.SEAL_AGE_IDENTITY }}
          GH_TOKEN: ${{ secrets.EXILEFORGE_TOKEN }}
          FROM: ${{ inputs.restore_from }}
        run: |
          [[ -n $HOST && -n $KEY ]] || { echo '::error::DEPLOY_HOST or DEPLOY_SSH_KEY is not set'; exit 1; }
          tmp=${RUNNER_TEMP:?}
          mkdir -p logs
          code=0
          if [[ $FROM =~ ^(daily|deploy|pre)/db-[0-9]{8}-[0-9]{6}\.archive\.gz$ ]]; then
            source_file=/dev/null
            line="restore $FROM"
          elif [[ $FROM =~ ^db-[0-9]{8}-[0-9]{6}$ ]]; then
            [[ -n $SEAL_AGE_IDENTITY && -n $GH_TOKEN ]] || { echo '::error::SEAL_AGE_IDENTITY or EXILEFORGE_TOKEN is not set'; exit 1; }
            . ci/crypt.sh; ensure_age
            gh release download "$FROM" -R Sperance/ExileForge -p "$FROM.archive.gz.age" -O "$tmp/db.age" || { echo '::error::no such weekly copy'; exit 1; }
            install -m 600 /dev/null "$tmp/id" && printf '%s\n' "$SEAL_AGE_IDENTITY" > "$tmp/id"
            age -d -i "$tmp/id" -o "$tmp/db.archive.gz" "$tmp/db.age"
            rm -f "$tmp/id" "$tmp/db.age"
            gzip -t "$tmp/db.archive.gz" || { rm -f "$tmp/db.archive.gz"; echo '::error::the weekly copy is damaged'; exit 1; }
            source_file=$tmp/db.archive.gz
            line="restore stdin"
          else
            echo '::error::restore_from must be daily|deploy|pre/db-YYYYMMDD-HHMMSS.archive.gz or db-YYYYMMDD-HHMMSS'; exit 1
          fi
          install -m 600 /dev/null "$tmp/key" && printf '%s\n' "$KEY" > "$tmp/key"
          VPS_HOST=$HOST VPS_KEY_FILE="$tmp/key" bash ci/vps-ssh.sh "$line" <"$source_file" >"$tmp/out.txt" 2>&1 || code=$?
          rm -f "$tmp/key" "$tmp/db.archive.gz"
          bash ci/encrypt-log.sh "$tmp/out.txt" logs/vps-restore.log.enc
          rm -f "$tmp/out.txt"
          echo "vps restore: exit $code"
          exit $code

      - name: Encrypted output
        if: always()
        uses: ./.github/actions/upload-log
        with:
          name: vps-restore

  # Зеркало кода вне GitHub: полные копии трёх репозиториев (все ветки и теги) git bundle'ами - на VPS, 4 последних
  repo-mirror:
    if: ${{ (github.event.schedule == '10 1 * * 1' || inputs.command == 'repo-mirror') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Bundle and send
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_HOST_KEY }}
          LOG_AGE_RECIPIENT: ${{ vars.LOG_AGE_RECIPIENT }}
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
        run: |
          [[ -n $HOST && -n $KEY && -n $SOURCE_TOKEN ]] || { echo '::error::DEPLOY_HOST, DEPLOY_SSH_KEY or SOURCE_TOKEN is not set'; exit 1; }
          tmp=${RUNNER_TEMP:?}
          mkdir -p "$tmp/bundles" logs
          for repo in ExileForge ktor-bestgame exile-ci; do
            git clone -q --mirror "https://x-access-token:$SOURCE_TOKEN@github.com/Sperance/$repo.git" "$tmp/$repo.git"
            git -C "$tmp/$repo.git" bundle create -q "$tmp/bundles/$repo.bundle" --all
          done
          tar -C "$tmp/bundles" -cf "$tmp/repos.tar" ExileForge.bundle ktor-bestgame.bundle exile-ci.bundle
          install -m 600 /dev/null "$tmp/key" && printf '%s\n' "$KEY" > "$tmp/key"
          code=0
          VPS_HOST=$HOST VPS_KEY_FILE="$tmp/key" bash ci/vps-ssh.sh repos-import <"$tmp/repos.tar" >"$tmp/out.txt" 2>&1 || code=$?
          rm -f "$tmp/key" "$tmp/repos.tar"
          bash ci/encrypt-log.sh "$tmp/out.txt" logs/repo-mirror.log.enc
          echo "repo-mirror: exit $code"
          exit $code

      - name: Encrypted output
        if: always()
        uses: ./.github/actions/upload-log
        with:
          name: repo-mirror
