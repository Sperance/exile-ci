# Исходники приватного репозитория (клиент Sperance/ExileForge с сабмодулем сервера backend/ или сервер Sperance/ktor-bestgame), JDK и
# Gradle - общая подготовка job'ов client.yml и server.yml. Токен - SOURCE_TOKEN (Contents: read на ExileForge и ktor-bestgame).
# Без параметров - клиент в src/ с сабмодулем, как его берут job'ы client.yml.
name: Private source
description: Checks out a private repository (optionally with submodules) and sets up JDK and Gradle
inputs:
  sha:
    description: Commit to check out
    required: true
  token:
    description: Read token for ExileForge and ktor-bestgame
    required: true
  repo:
    description: Repository to check out
    default: Sperance/ExileForge
  path:
    description: Directory of the checkout
    default: src
  submodules:
    description: Check out submodules (the client pins the server in backend/) and deepen the pinned server history
    default: 'true'
  persist-credentials:
    description: Keep the token in the checkout git config (the client needs it to deepen the backend/ submodule)
    default: 'true'
  java:
    description: JDK version
    default: '17'
  fetch-depth:
    description: History depth (0 - all, with tags)
    default: '1'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repo }}
        ref: ${{ inputs.sha }}
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}
        submodules: ${{ inputs.submodules }}
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: ${{ inputs.fetch-depth }}
    # История клиента Gradle не нужна, история сабмодуля - нужна: версию закреплённого сервера он считает по коммитам backend/
    - if: ${{ inputs.submodules == 'true' }}
      shell: bash
      env:
        SRC: ${{ inputs.path }}
      run: '[ "$(git -C "$SRC/backend" rev-parse --is-shallow-repository)" = false ] || git -C "$SRC/backend" fetch --quiet --unshallow'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java }}
    - uses: gradle/actions/setup-gradle@v4
      with:
        # Неиспользуемые файлы кэша удаляются перед сохранением: кэш не копится до лимита GitHub
        cache-cleanup: on-success
        # Сводка job'а перечисляла бы задачи Gradle в публичном журнале
        add-job-summary: never
