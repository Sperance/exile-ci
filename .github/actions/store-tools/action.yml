# Python и пакеты для скриптов магазинов (ci/play.py, ci/rustore.py, ci/store-status.py). Версии закреплены.
name: Store tools
description: Sets up Python with the pinned libraries of the store scripts
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.12'
    - shell: bash
      run: bash "${{ github.action_path }}/../../../ci/retry.sh" read pip install --quiet --disable-pip-version-check google-auth==2.35.0 requests==2.32.3 cryptography==43.0.3
