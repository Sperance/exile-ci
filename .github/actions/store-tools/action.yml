# Python и пакеты для скриптов магазинов (ci/play.py, ci/rustore.py, ci/store-status.py). Версии закреплены.
name: Store tools
description: Sets up Python with the pinned libraries of the store scripts
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - shell: bash
      run: pip install --quiet --disable-pip-version-check google-auth==2.35.0 requests==2.32.3 cryptography==43.0.3
